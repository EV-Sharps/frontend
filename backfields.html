<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>🏈 Backfields</title>

	<!--
	<script type="text/javascript" src="test.js"></script>
	-->

	<script type="text/javascript" src="tabulator.min.js"></script>
	<script type="text/javascript" src="peity-vanilla.min.js"></script>
	<script type="text/javascript" src="flatpickr.min.js"></script>
	<link href="tabulator.min.css" rel="stylesheet">
	<link href="flatpickr.min.css" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
	<script src="plotly-3.0.0.min.js" charset="utf-8"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<style>
		#table {
			width: auto;
		}
		@media (max-width: 600px) {
			#table {
				flex: 1;
			}
		}
	</style>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FX06BZ5MRL"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag(){dataLayer.push(arguments);}

	gtag('config', 'G-FX06BZ5MRL');

<body>
	<div id="app">
		<header id="header">
			<div id="title">
				<h1>+EV Sharps</h1>
			</div>
			<div id="center-dropdown">
				<div id="page-select-wrapper" class="select-wrapper">
					<select id="page-select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
				<div class="select-wrapper">
					<select id="format-select">
						<option value="half">½ PPR</option>
					</select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
				<button onclick="downloadCSV()">💾 CSV</button>
			</div>
		</header>
		<main>
			<div>
				<select id="devig-select" aria-hidden="true" style="display:none;"></select>

				<div id="dev-picker" class="book-picker" role="tablist" aria-label="Select devig"></div>
			</div>
			<div id="table-container">
				<div>Green or Red relative to season's performance. Sorted by Snap%</div>
				<div id="table"></div>
				<div id="watermark">
					<img src="logos/logo.png">
				</div>
			</div>
			<div id="right-body" class="body">
			</div>
		</main>
		<footer class="site-footer">
			<p>All content is for entertainment purposes only. +EV Sharps is not affiliated with NFL. <a href="/disclaimer">Read Full Terms</a></p>
		</footer>
	</div>
	<script type="text/javascript" src="shared.js"></script>
	<script type="text/javascript">
		PAGE = "backfields";
		let WEEK;
		const windowURL = new URL(window.location.href);
		const URLParams = new URLSearchParams(windowURL.search);
		let FORMAT = URLParams.get("format") || "half";
		let POS = URLParams.get("pos") || "ALL";
		let YEAR = new Date();
		YEAR = YEAR.getFullYear();

		parseURLParams();
		SPORT = "nfl";
		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		fetchData();

		function fetchData() {
			let s = SPORT;
			renderTable([]);
			fetch(API_BASE+`/api/backfields`, {
				headers: { "Accept": "application/vnd.github.v3.raw" }
			}).then(response => response.json()).then(data => {
				WEEK = data.week;
				RES = data.data;
				renderTable(RES);
				setTimeout(function() {
					if (CSV != undefined) {
						TABLE.download("csv", `${PAGE}.csv`, { bom: true });
					}
				}, 200);
			}).catch(err => console.log(err));
		}

		function renderTable(data) {
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
    			placeholder:"Data Loading...",
				//ajaxURL: "https://raw.githubusercontent.com/dailyev/props/main/static/dailyev/evArr.json",
				layout: "fitDataFill",
				responsiveLayout: MOBILE ? "" : "",
				autoResize: true,
				data: data,
				initialSort: [
					{column: "lastSnap", dir: "desc"},
					{column: "team", dir: "asc"}
				],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					resizable: false,
					headerSortStartingDir: "desc"
				},
				rowFormatter: function(row) {
					if (row.getData().prop == "separator") {
						row.getElement().style.backgroundColor = "#d3d3d3";
						row.getElement().style.height = "5px";
						//row.getElement().innerHTML = "";
					}
				},
				//groupBy: "game",
				groupHeader: function(value, count, data, group){
					return `<span style='color: #c8c3bc'>${value.toUpperCase()}</span>`;
				},
				groupToggleElement: "header",
				groupBy: "team",
				columns: [
						{title: "Player", field: "player", headerFilter: "input", width: 150, formatter: playerFormatter, formatterParams: {sport: SPORT}},
						{title: `WK${parseInt(WEEK)-1}<br>FPts`, field: "lastPts", hozAlign: "center", width: 60, formatter: trendFormatter},
						{title: "Avg FPts", field: "pts", hozAlign: "center", width: 60},
						{title: `WK${parseInt(WEEK)-1}<br>Snap %`, field: "lastSnap", hozAlign: "center", width: 60, sorter: "number", formatter: trendFormatter},
						{title: "Szn Avg<br>Snap %", field: "snap", hozAlign: "center", width: 60},
						{title: "RZ Looks<br>Share", field: "lastRz", hozAlign: "center", width: 60, formatter: trendFormatter},
						{title: "Avg RZ<br>Looks Share", field: "rz", hozAlign: "center", width: 60},
						{title: "RB Target<br>Share", field: "lastTgt", hozAlign: "center", width: 60, formatter: trendFormatter},
						{title: "Avg RB<br>Target Share", field: "tgt", hozAlign: "center", width: 60},
						{field: "team", visible: false}
					]
			});
		}

		function groupByGame() {
			if (!TABLE.options.groupBy) {
				TABLE.setGroupBy("game");
			} else {
				TABLE.setGroupBy();
			}
		}

		window.addEventListener('popstate', (event) => {
			const format = event.state?.format || new URLSearchParams(location.search).get('format') || 'half';
			const pos = event.state?.pos || new URLSearchParams(location.search).get('pos') || 'all';
			FORMAT = format;
			//TABLE.updateData(TABLE.getData());
			TABLE.setSort([
				{column: `${FORMAT}_pts`, dir: "desc"}
			]);
			selectPosition(pos.toUpperCase());
			//TABLE.redraw(true);
		});
	</script>
	<script type="text/javascript" src="filter.js"></script>
	<script type="text/javascript" src="card.js"></script>
	<script type="text/javascript" src="weights.js"></script>
</body>
</html>
