		function filterDue() {
			if (TABLE.getFilters().length == 0) {
				TABLE.setFilter([
					{field:"homerLogs.pa.z_median", type:">=", value: -0.1},
					{field:"game", type:"!=", value: ""},
					{field:"book", type:"!=", value: ""},
					//{field:"game_trends.hard_hit_ct.5GPercentile", type:">=", value: 75},
					{field:"barrel_ctPercentile", type:">=", value: 50},
					{field:"game_trends.barrel_ct.3G", type:">", value: 0},
				]);
				TABLE.setSort([
					{column: "homerLogs.pa.z_median", dir: "desc"},
					//{column: "game_trends.barrel_ct.3G", dir: "desc"},
				]);
				TABLE.getColumns().map(col => {
					let arr = ["ev", "book", "player", "pitcher", "on_base_plus_slg", "homerLogs.pa.streak", "homerLogs.pa.med", "homerLogs.pa.z_median", "barrel_ct", "game_trends.barrel_ct.3G", "hard_hit_ct", "game_trends.hard_hit_ct.3G", "exit_velocity_avg", "game_trends.exit_velo_100.3G", "homerLogs.pa.sd"];
					if (!arr.includes(col.getField())) {
						col.hide();
					} else {
						col.show();
					}
				});
			} else {
				TABLE.setFilter();
				TABLE.setSort([
					{column: "barrel_ct", dir: "desc"}
				]);
			}
		}

		function rowClick(row) {
			const data = row.getData();
			const right = document.querySelector("#right-body");
			const left = document.querySelector("#table-container");
			const table = document.querySelector("#table");
			const tableContainer = document.querySelector("#table-container");
			const sel = TABLE.getSelectedRows();
			TABLE.deselectRow();
			if (sel.length > 0 && sel[0] == row) {
				right.style.display = "none";
				left.style.width = "100%";
				table.style.width = "100%";
				setTimeout(() => {
					table.style.width = "max-content";
					tableContainer.style.width = "max-content";
				}, 40);
			} else {
				row.select();
				left.style.width = MOBILE ? "100%" : "50%";
				right.style.display = "flex";
				table.style.width = "100%";
				tableContainer.style.width = "100%";
				document.querySelector("#btwn-select").value = "pa";
				plotHRGap();
			}
		}

			TABLE.setFilter([

		function filterToday2() {
			let url = new URL(window.location.href);
			if (TODAY) {
				url.searchParams.delete("today");
			} else {
				url.searchParams.set("today", "");
			}
			window.location.href = `./barrels${HTML}${url.search}`;
		}

			if (TOGGLE_PERCENTILE) {

			} else {
				window.location.href = `./barrels${HTML}?percentiles=`;
			}
		}

		function exitVelo() {
			TABLE.setSort([
				{column: "tot100+", dir: "desc"},
				{column: "game_trends.exit_velo_100.5G", dir: "desc"},
				{column: "game_trends.exit_velo_100.3G", dir: "desc"},
			]);
			TABLE.getColumns().map(col => {
				let arr = ["book", "player", "sweet_spot_percent", "barrel_ct", "hard_hit_ct","exit_velocity_avg", "game_trends.exit_velocity_avg.5G", "tot100+", "game_trends.exit_velo_100.5G", "game_trends.exit_velo_100.3G"];
				if (!arr.includes(col.getField())) {
					col.hide();
				} else {
					col.show();
				}
			});
			const rows = TABLE.getData("active");
			const tweet = rows.slice(0, 10).map((row, idx) => {
				return `${idx+1}. ${title(row.player)} - ${row.game_trends.exit_velo_100["3G"]} 100+ - ${row.exit_velocity_avg} mph avg`;
			})
			console.log(tweet.join("\n"));
		}

		function changeFilter(render = true) {
			let [w,l,profit,kellyProfit] = [0,0,0,0];
			let devigBook = "circa+nv";
			let boost = 0;
			let book = "";
			let ou = "";
			let minOdds = "";
			let maxOdds = "";
			const requiredBooks = [];
			let props = [];
			let games = [];
			let excluded = [];
			let weights = {
				nv: 1,
				circa: 1
			}

			if (!RES) {
				return;
			}

			RES.forEach(row => {
				const bookOdds = { ...row.bookOdds };
				let avg = getAverageImplied(bookOdds, row.under);
				if (avg == null) {
					row["ev"] = null;
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}
				const comboList = devigBook ? devigBook.split("+").filter(Boolean) : Object.keys(bookOdds);
				const presentBooks = comboList.filter(k => bookOdds[k]).length;
				row["present"] = presentBooks;

				if (requiredBooks.length > 0) {
					const hasAllRequired = requiredBooks.every(book => bookOdds[book]);
					if (!hasAllRequired) {
						row["ev"] = null;
						row["fairVal"] = "";
						row["implied"] = "";
						row["kelly"] = "";
						return;
					}
				}

				let ex = [...excluded];
				ex.push("pn"); ex.push("circa");
				if (devigBook) {
					ex.push(devigBook);
				}
				if (book) {
					ex = ex.filter(b => b !== book);
				}
				const highest = highestOver(bookOdds, ex, boost, book, row.under);
				if (!isFinite(highest.value)) {
					row["ev"] = null;
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}

				let ou = avg.avgAmerican.toString();
				let avgDevig = averageDevigs(bookOdds, highest.book, row.under, weights);

				if (row.player == "ian cole" && row.prop == "atgs" && row.handicap == "0.5" && row.ouIdx == 0) {
					//console.log(row.bookOdds, avgDevig)
				}

				if (!isFinite(avgDevig)) {
					row["ev"] = null;
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}

				let line = highest.value >= 0 ? highest.value : 10000 / Math.abs(highest.value);
				let ev = avgDevig * line + (1 - avgDevig) * -100;
				let fairVal;
				const dec = 1 / avgDevig;
				if (dec >= 2) {
					row["fairVal"] = Math.round((dec - 1) * 100);
				} else {
					row["fairVal"] = Math.round(-100 / (dec - 1));
				}

				row["book"] = highest.book;
				row["line"] = highest.value;
				row["ev"] = ev.toFixed(1);
				row["implied"] = round2(avgDevig * 100);
				row["kelly"] = getKelly(highest.value, ev);
			});

			renderTable(RES);
		}
