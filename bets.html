<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>+EV Sharps</title>
	<script type="text/javascript" src="tabulator.min.js"></script>
	<script type="text/javascript" src="peity-vanilla.min.js"></script>
	<link href="tabulator.min.css" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
	<script src="plotly-3.0.0.min.js" charset="utf-8"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<style type="text/css">
	.game-img {
		height: 18px; width: 18px;
	}
	#table {
		width: auto;
	}
	@media (max-width: 1350px) {
		#table-container {
			justify-content: normal;
		}
		#table-container, #table {
			width: 100%;
		}
	}
	@media (max-width: 600px) {
		#table {
			height: 85%;
		}
	}
</style>
<body>
	<div id="app">
		<header id="header">
			<div id="title">
				<h1>+EV Sharps</h1>
			</div>
			<div id="center-dropdown">
				<div class="select-wrapper">
					<select id="page-select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
				<div class="select-wrapper">
					<select id="sport-select">
						<option value="nba">NBA</option>
						<option value="mlb">MLB</option>
						<option value="k">Ks</option>
						<option value="atgs">ATGS</option>
						<option value="nhl">NHL Props</option>
						<option value="nfl">TDs</option>
						<option value="props">NFL Props</option>
					</select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
			</div>
			<div id="auth-buttons">
				<button class="discord-login loggedOut" onclick="loginWithDiscord()">
					<img src="/logos/discord.png" alt="Discord logo">
					<span class="btn-text">Sign in with Discord</span>
				</button>
				<button class="gsi-material-button loggedOut" onclick="loginWithGoogle()">
				  <div class="gsi-material-button-state"></div>
				  <div class="gsi-material-button-content-wrapper">
				    <div class="gsi-material-button-icon">
				      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
				        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
				        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
				        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
				        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
				        <path fill="none" d="M0 0h48v48H0z"></path>
				      </svg>
				    </div>
				    <span style="display: none;">Sign in with Google</span>
				  </div>
				</button>

				<span id="username" class="loggedIn username"></span>
				<button id="pricing" class="loggedOut" onclick="changePage('pricing')">Pricing</button>
				<button id="hide-username" onclick="hideUsername()">Hide</button>
				<button id="account" class="loggedIn" onclick="changePage('profile')">Profile</button>
				<button id="upgrade" class="loggedIn" onclick="changePage('pricing')">Upgrade 🎯</button>
				<button id="logout" class="loggedIn" onclick="logout()">Logout</button>
			</div>
		</header>
		<main>
			<div class="select-wrapper">
				<select id="devig-select" aria-hidden="true" style="display:none;"></select>

				<div id="dev-picker" class="book-picker" role="tablist" aria-label="Select devig"></div>
			</div>
			<div id="table-container">
				<div class="record">
				  <ul style="list-style:none; padding:0; margin:0;">
				  	<li id="record-all"><strong>'23-'25 +EV:</strong> <span class="w-l"></span> <span class="units">(+u)</span></li>
					<li id="record-szn"><strong>2025 +EV:</strong> <span class="w-l"></span> <span class="units">(+u)</span></li>
					<li id="record-today"><strong>Today:</strong> <span class="w-l"></span> <span class="units">(+u)</span></li>
				  </ul>
				</div>
				<div class="loggedOut">
					<div style="padding: 0.5rem;text-align: center;">
						<a href="/pricing" class="upgrade-link">Upgrade</a> to sharp to see the full slate
					</div>
				</div>
				<div id="table"></div>
			</div>
		</main>
	</div>
	<script type="text/javascript" src="shared.js"></script>
	<script type="text/javascript" src="auth.js"></script>
	<script type="text/javascript">
		PAGE = "bets";

		parseURLParams();
		let sport_select = document.querySelector("#sport-select");
		sport_select.value = SPORT;

		handleSession();

		sport_select.addEventListener("change", (e) => {
			SPORT = e.target.value;
			let url = new URL(window.location.href);
			const params = new URLSearchParams(window.location.search);
			params.set("sport", SPORT);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			updateRecord();
			renderTable(RES[SPORT].data);
		});

		function updateRecord() {
			if (RES[SPORT].record.all) {
				let [wl, units] = RES[SPORT].record.all.split(" ");
				document.querySelector("#record-all .w-l").textContent = wl;
				document.querySelector("#record-all .units").textContent = units;
			}
			if (RES[SPORT].record.szn) {
				[wl, units] = RES[SPORT].record.szn.split(" ");
				document.querySelector("#record-szn .w-l").textContent = wl;
				document.querySelector("#record-szn .units").textContent = units;

				if (units) {
					const num = parseFloat(units.match(/-?\d+(\.\d+)?/)[0]);
					if (num < 0) {
						document.querySelector("#record-szn .units").style.color = "red";
					} else {
						document.querySelector("#record-szn .units").style.color = "green";
					}
				}
			}
			[wl, units] = RES[SPORT].record.today.split(" ");
			document.querySelector("#record-today .w-l").textContent = wl;
			document.querySelector("#record-today .units").textContent = units;
			if (units) {
				const num = parseFloat(units.match(/-?\d+(\.\d+)?/)[0]);
				if (num < 0) {
					document.querySelector("#record-today .units").style.color = "red";
				} else {
					document.querySelector("#record-today .units").style.color = "green";
				}
			}

			if (SPORT == "nfl") {
				document.querySelector("#record-today strong").textContent = "Week:"
			} else {
				document.querySelector("#record-today strong").textContent = "Today:"
			}
			if (SPORT != "MLB") {
				document.querySelector("#record-all").style.display = "none";
			} else {
				document.querySelector("#record-all").style.display = "flex";
			}
		}

		function fetchPlays() {
			fetch(API_BASE+"/api/bets", {
				headers: {
					Authorization: `Bearer ${ACCESS_TOKEN}`
				}
			}).then(response => response.json()).then(data => {
				RES = data;
				//for (record of [data.record.all, data.record.szn, data.record.])
				updateRecord();
				renderTable(data[SPORT].data);
			}).catch(err => console.log(err));
		}

		function renderTable(data) {
			let ph = "Data Loading...";
			if (data.length == 0) {
				ph = "No Bets (yet)";
			}
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
    			placeholder: ph,
				layout: "fitDataFill",
				responsiveLayout: MOBILE ? "" : "",
				autoResize: true,
				data: data,
				initialSort: [
					{column: "cashedOut", dir: "desc"},
					{column: "mkt_ev", dir: "desc"},
					{column: "ev", dir: "desc"},
				],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					resizable: false,
					headerSortStartingDir: "desc"
				},
				rowFormatter: function(row) {
					const data = row.getData();
					if (data.cashedOut) {
						const el = row.getElement();
						const ev = el.querySelector(".ev-cell");
						const player = el.querySelector(".player-cell");
						const evBook = el.querySelector(".evbook-cell");
						if (ev) {
							ev.style.textDecoration = "line-through";
						}
						if (player) {
							player.style.textDecoration = "line-through";
						}
						if (evBook) {
							evBook.style.textDecoration = "line-through";
						}
					}
					if (data.homer) {
						row.getCells().map(r => r.getElement().classList.add("homer"));
					}
				},
				groupToggleElement: "header",
				columns: [
					{
						title: "Circa<br>+EV",
						field: "ev",
						width: MOBILE ? 45 : 60,
						sorter: "number",
						responsive: 0,
						formatter: evFormatter
					},
					{
						title: "PN<br>+EV",
						field: "pn_ev",
						width: MOBILE ? 45 : 60,
						sorter: "number",
						responsive: 0,
						formatter: evFormatter,
						visible: false
					},
					{title: "Game", field: "game", formatter: gameFormatter, formatterParams: { sport: SPORT}, width: 50},
					{
						title: "Player",
						field: "player",
						headerFilter: "input",
						formatter: playerFormatter,
						width: MOBILE ? 100 : 140,
						formatterParams:{ sport: SPORT, noProp: true, fullName: true },
						hozAlign: "left",
						responsive: 0,
						frozen: MOBILE ? true : false
					},
					{
						title: "Line",
						field: "handicap",
						formatter: function(cell) {
							const data = cell.getRow().getData();
							const prop = data.prop;
							if (["attd", "2+td", "3+td", "ftd", "ltd"].includes(prop)) {
								return "";
							}
							let ou = data.ouIdx == 1 ? "u" : "o";
							return `${ou}${cell.getValue()}`;
						},
						visible: SPORT === "mlb" ? false : true
					},
					{
						title: "Prop",
						field: "prop",
						visible: SPORT === "mlb" ? false : true
					},
					{
						title: "Best Book", field: "book",
						vertAlign:"bottom", width: MOBILE ? 65 : 70,
						formatter: evBookFormatter,
						responsive: 0
					},
					{title: "Units", field: "units", width: 40,
						formatter: function(cell) {
							const data = cell.getData();
							return data.units ? data.units : "1u";
						}
					},
					
					{
						title: "¼ Kelly",
						field: "kelly",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						responsive: 0
					},
					{
						title: "Market<br>+EV",
						field: "mkt_ev",
						width: MOBILE ? 45 : 60,
						sorter: "number",
						responsive: 0,
						formatter: evFormatter
					},
					{
						title: "Market<br>¼ Kelly",
						field: "mkt_kelly",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						responsive: 0
					},
					
					{title: "Circa", field: "circa"},
					{title: `FD`, field: "evData.bookOdds.fd", width: MOBILE ? 60 : 60, sorter: "number"},
					{title: `PN`, field: "evData.bookOdds.pn",  width: 70, sorter: "number"},
					{title: `B365`, field: "evData.bookOdds.b365", hozAlign: "center", width: 70, sorter: "number",
						visible: SPORT == "nfl" ? false : true
					},
					{title: `DK`, field: "evData.bookOdds.dk",  width: MOBILE ? 60 : 60, sorter: "number"},
					{title: `MGM`, field: "evData.bookOdds.mgm",  width: 70, sorter: "number"},
					{title: `FN`, field: "evData.bookOdds.fn",  width: 70, sorter: "number"},
					{title: `ESPN`, field: "evData.bookOdds.espn",  width: 70, sorter: "number"},
					{title: `HR`, field: "evData.bookOdds.hr",  width: 70, sorter: "number"},
					{title: `Kambi<br>Parx/Bally`, field: "evData.bookOdds.kambi",  width: 70, sorter: "number"},
					{title: `CZ`, field: "evData.bookOdds.cz",  width: 50, sorter: "number"},
				]
			});
		}
	</script>
</body>
</html>
