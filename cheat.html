<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cheat Sheets</title>
	<link href="style.css" rel="stylesheet">
	<style>
		:root {
			--bg-color: #0f172a;
			--card-bg: #1e293b;
			--text-main: #f8fafc;
			--text-dim: #94a3b8;
			--accent: #38bdf8;
			--success: #22c55e;
			--failure: #ef4444;
			--card-max-height: 300px;
		}

		html {
			overflow: auto;
		}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background-color: var(--bg-color);
			color: var(--text-main);
			margin: 0;
			line-height: 1.5;
			overflow: auto;
		}

		.header {
			text-align: center;
		}

		.header h1 { margin: 0; color: var(--accent); letter-spacing: -1px; }

		.controls {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			overflow-x: auto;
			gap: 15px;
			margin-bottom: 30px;
			padding: 0 1rem 20px;
			border-bottom: 1px solid #334155;
		}

		.btn-ctrl {
			background-color: #334155;
			color: var(--text-main);
			border: 1px solid #475569;
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-weight: 600;
			font-size: 0.85rem;
			transition: all 0.2s;
		}

		.btn-ctrl:hover {
			background-color: #475569;
			border-color: var(--accent);
		}

		.dashboard {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 20px;
			max-width: 1600px;
			margin: 0 auto;
		}

		.book-card {
			background-color: var(--card-bg);
			border-radius: 12px;
			overflow: hidden;
			border: 1px solid #334155;
			display: flex;
			flex-direction: column;
		}

		.card-head {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 12px 14px;
			border-bottom: 1px solid #334155;
			background: #162032;
			cursor: pointer;
		}

		.card-head::after {
			content: '▼';
			font-size: 0.7rem;
			color: var(--text-dim);
			transition: transform 0.3s;
			margin-left: auto;
		}

		.book-card.expanded .card-head::after {
			transform: rotate(180deg);
		}

		.book-logo {
			width: 26px;
			height: 26px;
			object-fit: contain;
			border-radius: 4px;
		}

		.book-name {
			font-size: 1rem;
			font-weight: 800;
			color: var(--accent);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			flex: 1;
		}

		.book-summary {
			font-size: 0.72rem;
			color: var(--text-dim);
			text-align: right;
		}

		.card-content {
			max-height: var(--card-max-height);
			overflow: hidden;
			transition: max-height 0.4s ease-in-out;
			position: relative;
		}

		.card-content::after {
			content: "";
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 50px;
			background: linear-gradient(transparent, var(--card-bg));
			pointer-events: none;
			transition: opacity 0.3s;
		}

		.book-card.expanded .card-content {
			max-height: 700px;
			overflow-y: auto;
		}

		.book-card.expanded .card-content::after {
			opacity: 0;
		}

		.entry {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 8px 14px;
			border-bottom: 1px solid #1e2d40;
		}

		.entry:last-child { border-bottom: none; }

		.entry-left {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 3px;
		}

		.entry-info {
			display: flex;
			align-items: baseline;
			gap: 6px;
			min-width: 0;
		}

		.market-name {
			font-weight: 700;
			font-size: 0.88rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			flex-shrink: 0;
		}

		.devig-source {
			font-size: 0.72rem;
			color: var(--text-dim);
			white-space: nowrap;
		}

		.map-link {
			background: none;
			border: none;
			cursor: pointer;
			font-size: 0.85rem;
			padding: 0 2px;
			color: var(--text-dim);
			flex-shrink: 0;
			line-height: 1;
		}

		.map-link:hover { color: var(--accent); }

		.top-record {
			font-size: 0.7rem;
			color: var(--text-dim);
			white-space: nowrap;
		}

		.units-badge {
			font-family: 'Courier New', monospace;
			font-weight: 700;
			font-size: 0.85rem;
			padding: 3px 8px;
			border-radius: 5px;
			white-space: nowrap;
			min-width: 56px;
			text-align: center;
			background: rgba(34, 197, 94, 0.12);
			color: var(--success);
		}

		.units-negative {
			color: var(--failure);
			background: rgba(239, 68, 68, 0.12);
		}

		.no-unit { color: var(--text-dim); background: rgba(148, 163, 184, 0.1); }

		.expand-btn {
			background: none;
			border: none;
			border-top: 1px solid #334155;
			color: var(--accent);
			cursor: pointer;
			font-size: 0.8rem;
			font-weight: 700;
			padding: 8px 14px;
			text-align: center;
			width: 100%;
			display: block;
		}

		.expand-btn:hover { background: rgba(56,189,248,0.05); }

		.switch input:checked + .slider { background-color: var(--accent); }
		.slider:before {
			position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
			background-color: white; transition: .4s; border-radius: 50%;
		}
		.switch input:checked + .slider:before { transform: translateX(14px); }

		.unit-toggle-container {
			display: flex; align-items: center; gap: 10px; background: #334155; padding: 4px 12px; border-radius: 6px; border: 1px solid #475569;
		}

		@media (max-width: 600px) {
			.controls {
				overflow-x: auto;
				justify-content: normal;
				align-items: center;
			}
			.chkdd, .unit-toggle-container, .btn-ctrl {
				flex: 0 0 auto;
			}
		}

		/* Matrix View */
		#matrix-view { display: none; max-width: 1600px; margin: 0 auto; overflow-x: auto; }

		.matrix-table {
			border-collapse: collapse;
			width: 100%;
			font-size: 0.8rem;
		}
		.matrix-table th {
			background: #1e293b;
			color: var(--accent);
			padding: 8px 12px;
			text-align: center;
			position: sticky;
			top: 0;
			font-size: 0.72rem;
			letter-spacing: 0.5px;
			text-transform: uppercase;
			border: 1px solid #334155;
			white-space: nowrap;
		}
		.matrix-table th:first-child { text-align: left; min-width: 90px; left: 0; z-index: 2; }
		.prop-label {
			font-weight: 700;
			color: var(--text-main);
			padding: 6px 12px;
			background: #1e293b;
			position: sticky;
			left: 0;
			white-space: nowrap;
			border: 1px solid #334155;
			z-index: 1;
		}
		.matrix-cell {
			text-align: center;
			padding: 5px 8px;
			border: 1px solid #2d3748;
			min-width: 80px;
			vertical-align: middle;
			cursor: default;
			transition: opacity 0.15s;
		}
		.matrix-cell:hover { opacity: 0.85; }
		.cell-book { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
		.cell-val { font-weight: 700; font-size: 0.82rem; font-family: 'Courier New', monospace; }
		.cell-val.pos { color: var(--success); }
		.cell-val.neg { color: var(--failure); }
		.cell-record { font-size: 0.62rem; color: var(--text-dim); }
		.matrix-cell.empty { color: #475569; }

		.matrix-book-select {
			background: #334155;
			color: var(--text-main);
			border: 1px solid #475569;
			padding: 6px 10px;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
		}
	</style>
</head>
<body>

<div class="header">
	<h1>Prop Betting Performance</h1>
	<p>Data tracked: Nov 11th, 2025 - Mar 14th, 2026</p>
</div>

<div class="controls">
	<div class="select-wrapper">
		<label for="page-select" class="select-label">Page</label>
		<select id="page-select"></select>
		<svg class="select-arrow" viewBox="0 0 20 20">
			<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
		</svg>
	</div>

	<div class="select-wrapper">
		<label class="select-label" for="selSport">Sport</label>
		<select id="selSport" class="select">
			<option value="nba">🏀 NBA</option>
			<option value="nhl">🏒 NHL</option>
			<option value="nfl">🏈 NFL</option>
			<option value="ncaab">🏀 NCAAB</option>
			<option value="nhl_main">🏒 MAIN</option>
			<option value="nba_main">🏀 MAIN</option>
		</select>
		<svg class="select-arrow" viewBox="0 0 20 20">
			<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
		</svg>
	</div>

	<div class="chkdd" id="devig-dd">
		<button class="chkdd-btn" type="button" onclick="toggleDropdown('devig-dd', event)">Devig Filter</button>
		<div class="chkdd-menu" id="devig-options">
			<div class="chkdd-actions">
				<button type="button" data-act="all">All</button>
				<button type="button" data-act="none">None</button>
			</div>
		</div>
	</div>

	<div class="chkdd" id="prop-dd">
		<button class="chkdd-btn" type="button" onclick="toggleDropdown('prop-dd', event)">Prop Filter</button>
		<div class="chkdd-menu" id="prop-options">
			<div class="chkdd-actions">
				<button type="button" data-act="all">All</button>
				<button type="button" data-act="none">None</button>
			</div>
		</div>
	</div>
	
	<div class="select-wrapper">
        <label for="method-select" class="select-label">Method</label>
        <select id="method-select" class="select">
            <option value="">Worst-Case</option>
            <option value="probit" selected>Probit</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 20 20">
            <path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
    </div>

	<div class="select-wrapper">
		<label for="window-select" class="select-label">Window</label>
		<select id="window-select" class="select" onchange="renderDashboard()">
			<option value="All">All</option>
			<option value="L14">L14</option>
			<option value="L30">L30</option>
			<option value="L60">L60</option>
		</select>
		<svg class="select-arrow" viewBox="0 0 20 20">
			<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
		</svg>
	</div>

	<div class="select-wrapper">
		<label for="odds-type" class="select-label">Odds</label>
		<select id="odds-type" class="select">
			<option value="all">All</option>
			<option value="longshots">Longshots</option>
		</select>
		<svg class="select-arrow" viewBox="0 0 20 20">
			<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
		</svg>
	</div>

	<div class="unit-toggle-container">
		<span style="font-size: 0.85rem; font-weight: 600;">ROI</span>
		<label class="switch" style="position: relative; display: inline-block; width: 34px; height: 20px;">
			<input type="checkbox" id="profit-toggle" onchange="renderDashboard()" style="opacity: 0; width: 0; height: 0;">
			<span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; transition: .4s; border-radius: 20px; border: 1px solid var(--accent);"></span>
		</label>
		<span style="font-size: 0.85rem; font-weight: 600;">Profit</span>
	</div>

	<div class="unit-toggle-container">
		<span style="font-size: 0.85rem; font-weight: 600;">Full Unit</span>
		<label class="switch" style="position: relative; display: inline-block; width: 34px; height: 20px;">
			<input type="checkbox" id="unit-toggle" onchange="renderDashboard()" style="opacity: 0; width: 0; height: 0;">
			<span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .4s; border-radius: 20px; border: 1px solid var(--accent);"></span>
		</label>
		<span style="font-size: 0.85rem; font-weight: 600;">Kelly</span>
	</div>
	<div class="unit-toggle-container" style="gap:8px;">
    <label for="min-bets" style="font-size:0.85rem;font-weight:600;color:var(--text-dim);">Min Bets</label>
    <select id="min-bets" onchange="renderDashboard()"
            style="width:50px;padding:6px;border-radius:6px;border:1px solid #475569;background:#0b1220;color:var(--text-main);">
        <option value="1">1</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
		<option value="200">200</option>
    </select>
</div>
	<button class="btn-ctrl" id="view-toggle-btn" onclick="toggleView()">Matrix View</button>
	<button class="btn-ctrl" id="expand-all-btn" onclick="toggleAll(true)">Expand All</button>
	<button class="btn-ctrl" onclick="toggleAll(false)">Collapse All</button>
</div>

<div class="dashboard" id="dashboard">
</div>

<div id="matrix-view">
	<div style="display:flex;align-items:center;gap:12px;max-width:1600px;margin:0 auto 16px;padding:0 4px;">
		<span style="font-size:0.85rem;font-weight:600;color:var(--text-dim);">Betting Book:</span>
		<select id="matrix-book-select" class="matrix-book-select" onchange="renderMatrix()">
			<option value="best">best</option>
			<option value="fd">fd</option>
			<option value="dk">dk</option>
			<option value="mgm">mgm</option>
			<option value="espn">espn</option>
			<option value="cz">cz</option>
			<option value="fn">fn</option>
			<option value="b365">b365</option>
			<option value="br">br</option>
			<option value="hr">hr</option>
			<option value="bv">bv</option>
			<option value="__all__">All (best across books)</option>
		</select>
		<span style="font-size:0.78rem;color:var(--text-dim);">Rows = Props &nbsp;|&nbsp; Columns = Devig Source &nbsp;|&nbsp; Cell = Performance (ROI%)</span>
	</div>
</div>

<script type="text/javascript" src="shared.js"></script>
<script type="text/javascript" src="record.js"></script>
<script>
	PAGE = "cheat";
	parseURLParams();

	let RECORD_ALL = RECORD;
	let RECORD_LONG_TMP = null;

	const selMethod = document.getElementById('method-select');
	METHOD = METHOD || 'probit';
	selMethod.value = METHOD;
	selMethod.addEventListener('change', () => {
		METHOD = selMethod.value;
		initFilters();
		renderDashboard();
	});

	const selSport = document.getElementById('selSport');
	selSport.value = SPORT || 'nba';
	selSport.addEventListener('change', () => {
		SPORT = selSport.value;
		const params = new URLSearchParams(window.location.search);
		params.set("sport", SPORT);
		const newUrl = `${window.location.pathname}?${params.toString()}`;
		history.pushState({}, '', newUrl);
		initFilters();
		renderDashboard();
	});

	const selOddsType = document.getElementById('odds-type');
	selOddsType.addEventListener('change', () => {
		if (selOddsType.value === 'longshots' && !RECORD_LONG_TMP) {
			const script = document.createElement('script');
			script.src = 'record_long.js';
			script.onload = () => {
				RECORD_LONG_TMP = RECORD_LONG;
				RECORD = RECORD_LONG;
				initFilters();
				renderDashboard();
			};
			document.head.appendChild(script);
		} else {
			RECORD = selOddsType.value === 'longshots' ? RECORD_LONG_TMP : RECORD_ALL;
			initFilters();
			renderDashboard();
		}
	});

	const BEST = {
			"fd": ["reb-circa", "reb-dk", "reb-pn+circa+hr", "3ptm-pn+dk", "3ptm-pn", "3ptm-espn", "3ptm-circa", "ast-circa", "ast-espn+hr", "blk-hr", "blk-mgm", "pts-circa", "pts-dk+espn", "pts+ast-dk+espn", "pts+reb-espn", "reb+ast-dk+espn", "reb+ast-hr", "stl-espn", "stl-dk", "blk-hr", "blk-mgm", "pts+reb+sat-pn+espn+hr"],
			"dk": ["dd-pn", "pts-fd", "pts-espn+hr", "pts+ast-fd", "pts+reb-hr", "pts+reb+ast-pn", "pts+reb+ast-fd", "reb-pn", "reb-pn+fd", "reb+ast-espn"],
			"b365": ["3ptm-dk", "ast-fd+espn+mgm", "pts-fd", "pts+ast-bv", "pts+ast-fd", "pts+ast-dk"],
			"mgm": ["3ptm-fd+dk", "ast-pn", "dd-espn", "pts-fd+dk", "pts-fd", "pts+ast-fd", "pts+reb-fd", "pts+reb+ast-pn+fd", "reb+ast-fd"],
			"espn": ["ast-bv", "ast-fd+dk", "blk-hr", "pts-fd", "pts+ast-fd", "pts+reb-fd", "pts+reb+ast-pn", "reb-pn+espn+mgm"],
			"cz": ["ast-hr", "pts-pn", "reb-fd"],
			"fn": ["3ptm-circa", "ast-circa", "pts-dk", "pts-circa", "pts+reb-fd", "reb-dk", "reb+ast-dk"],
			"br": ["3ptm-dk", "ast-dk", "blk-mgm", "pts-fd", "pts+reb+ast-pn+dk", "reb-fd+dk", "stl-fd"],
			"hr": ["reb+ast-dk+espn", "reb-fd+dk", "pts+reb+ast-mgm", "pts+reb-fd+dk", "pts+ast-fd", "pts+ast-dk", "pts-espn", "pts-fd", "pts-pn", "blk-espn+hr", "ast-dk+espn", "3ptm-circa"],
			"bv": ["ast-fd+dk", "ast-pn", "blk-espn", "dd-pn", "dd-mgm", "pts-pn", "pts-espn+hr", "pts+ast-dk", "pts+reb-fd+espn+mgm", "pts+reb-dk+espn", "reb-circa", "reb-dk+espn", "reb-espn", "reb-fd", "reb-pn"],

		};

	function parseRecord(record) {
		const window = document.getElementById('window-select').value || 'All';
		let data = {};
		for (book in record) {
			let arr = [];
			for (key in record[book]) {
				let j = record[book][key][window] || record[book][key]["All"];
				if (!j) continue;
				let [prop,devig] = key.split("-vs-");

				if (PRETTY != undefined && !BEST?.[book].includes(`${prop}-${devig}`)) continue;

				arr.push({market: prop, vs: devig, u: j["profit"], k: j["kelly"], w: j["wins"] ?? j["w"], l: j["losses"] ?? j["l"], r: j["roi"]});
			}
			data[book] = arr;
		}
		return data;
	}

	function renderDashboard() {
		if (currentView === 'matrix') { renderMatrix(); return; }
		const dashboard = document.getElementById('dashboard');
		dashboard.innerHTML = "";

		const getChecked = (containerId) => {
	        return Array.from(document.querySelectorAll(`#${containerId} input:checked`)).map(cb => cb.value);
	    };

		const activeDevigs = getChecked('devig-options');
   		const activeProps = getChecked('prop-options');
   		const isProfit = document.getElementById('profit-toggle').checked;
		const isKelly = document.getElementById('unit-toggle').checked;
		let unitKey = isKelly ? 'k' : 'u';
		if (!isProfit) unitKey = "r";

		const minBets = Math.max(0, Number(document.getElementById('min-bets').value) || 0);

		let data = parseRecord(RES);
		const BOOK_LABELS = {
		best: "Best Book", fd: "FanDuel", dk: "DraftKings", mgm: "BetMGM",
		espn: "ESPN Bet", cz: "Caesars", fn: "Fanatics", b365: "Bet365",
		br: "BetRivers", hr: "Hard Rock", bv: "Bovada"
	};
	let books = ["best", "fd", "dk", "mgm", "espn", "cz", "fn", "b365", "br", "hr", "bv"];
		for (bookName of books) {
			const bookData = {...data[bookName]};
			const filteredLines = Object.entries(bookData)
				.map(([key, stats]) => {
					const [prop, devig] = key.split("-vs-");
					return {...stats};
				})
				.filter(line => {
					const total = (line.w || 0) + (line.l || 0);
					return activeDevigs.includes(line.vs) && activeProps.includes(line.market) && total >= minBets;
				});

			if (filteredLines.length == 0) continue;

			filteredLines.sort((a,b) => (b[unitKey] || 0) - (a[unitKey] || 0));

			const card = document.createElement('div');
			card.className = 'book-card';
			
			const avgRoi = filteredLines.length
				? Math.round(filteredLines.slice(0, 5).reduce((s, l) => s + (l.r || 0), 0) / Math.min(filteredLines.length, 5))
				: null;

			let entriesHtml = filteredLines.map(line => {
				let val = line[unitKey];
				if (!line || !val) return;

				const total = (line.w || 0) + (line.l || 0);
				const winPct = total > 0 ? Math.round((line.w / total) * 100) : 0;
				const negative = val < 0 ? "units-negative" : "";

				return `
				<div class="entry">
					<div class="entry-left">
						<div class="entry-info">
							<span class="market-name">${line.market}</span>
							<span class="devig-source">vs ${line.vs}</span>
						</div>
						<div class="top-record">${line.w}W-${line.l}L (${winPct}%)</div>
					</div>
					<button class="map-link" data-prop="${line.market}" data-devig="${line.vs}" data-book="${bookName}" title="View heatmap">🗺️</button>
					<span class="units-badge ${negative} ${val === null ? 'no-unit' : ''}">
						${val ? (val >= 0 ? "+" : "") + (!isProfit ? `${val}%` : `${val.toFixed(1)}u`) : ''}
					</span>
				</div>
			`}).join('');

			card.innerHTML = `
				<div class="card-head" onclick="toggleCard(this.parentElement)">
					<img class="book-logo" src="logos/${bookName}.png" alt="${bookName}" onerror="this.style.display='none'">
					<span class="book-name">${BOOK_LABELS[bookName] || bookName}</span>
					${avgRoi != null ? `<span class="book-summary">Top 5 avg ROI<br><b style="color:${avgRoi >= 0 ? 'var(--success)' : 'var(--failure)'}">${avgRoi >= 0 ? '+' : ''}${avgRoi}%</b></span>` : ''}
				</div>
				<div class="card-content">
					${entriesHtml}
				</div>
				<button class="expand-btn" onclick="toggleCard(this.parentElement)">Show More</button>
			`;
			
			dashboard.appendChild(card);

			card.querySelectorAll('.map-link').forEach(el => {
                el.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    const url = `/heatmap${HTML}?sport=${encodeURIComponent(SPORT)}&prop=${encodeURIComponent(el.dataset.prop||'')}&book=${encodeURIComponent(el.dataset.book||'')}&devig=${encodeURIComponent(el.dataset.devig||'')}&method=${encodeURIComponent(METHOD)}`;
                    window.open(url, '_blank', 'noopener');
                });
            });
		}
	}

	let currentView = 'dashboard';

	function toggleView() {
		const btn = document.getElementById('view-toggle-btn');
		const expandBtn = document.getElementById('expand-all-btn');
		if (currentView === 'dashboard') {
			document.getElementById('dashboard').style.display = 'none';
			document.getElementById('matrix-view').style.display = 'block';
			btn.textContent = 'Card View';
			expandBtn.style.display = 'none';
			currentView = 'matrix';
			renderMatrix();
		} else {
			document.getElementById('dashboard').style.display = 'grid';
			document.getElementById('matrix-view').style.display = 'none';
			btn.textContent = 'Matrix View';
			expandBtn.style.display = '';
			currentView = 'dashboard';
		}
	}

	function renderMatrix() {
		const container = document.getElementById('matrix-view');
		// remove any existing table
		const existing = container.querySelector('.matrix-table');
		if (existing) existing.parentElement.remove();

		const isProfit = document.getElementById('profit-toggle').checked;
		const isKelly = document.getElementById('unit-toggle').checked;
		let unitKey = isKelly ? 'k' : 'u';
		if (!isProfit) unitKey = 'r';

		const win = document.getElementById('window-select').value || 'All';
		const minBets = Math.max(0, Number(document.getElementById('min-bets').value) || 0);
		const selectedBook = document.getElementById('matrix-book-select')?.value || 'best';
		const allBooks = selectedBook === '__all__';
		const books = allBooks ? ["best", "fd", "dk", "mgm", "espn", "cz", "fn", "b365", "br", "hr", "bv"] : [selectedBook];

		const activeDevigs = Array.from(document.querySelectorAll('#devig-options input:checked')).map(cb => cb.value);
		const activeProps  = Array.from(document.querySelectorAll('#prop-options input:checked')).map(cb => cb.value);

		// matrix[prop][devig] = {val, book, w, l}
		const matrix = {};
		const propSet = new Set();
		const devigSet = new Set();

		for (const book of books) {
			const bookData = RES[book] || {};
			for (const [key, windows] of Object.entries(bookData)) {
				const [prop, devig] = key.split('-vs-');
				if (!activeProps.includes(prop) || !activeDevigs.includes(devig)) continue;
				const j = windows[win] || windows['All'];
				if (!j) continue;
				const w = j.wins ?? j.w ?? 0;
				const l = j.losses ?? j.l ?? 0;
				if ((w + l) < minBets) continue;
				const rawVal = unitKey === 'r' ? j.roi : unitKey === 'k' ? j.kelly : j.profit;
				if (rawVal == null) continue;

				propSet.add(prop);
				devigSet.add(devig);
				if (!matrix[prop]) matrix[prop] = {};
				const cur = matrix[prop][devig];
				if (!cur || rawVal > cur.val) {
					matrix[prop][devig] = { val: rawVal, book, w, l };
				}
			}
		}

		const props  = [...propSet].sort();
		const devigs = [...devigSet].sort();

		// Sort props: highest avg value first
		props.sort((a, b) => {
			const avg = (p) => {
				const vals = devigs.map(d => matrix[p]?.[d]?.val).filter(v => v != null);
				return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : -Infinity;
			};
			return avg(b) - avg(a);
		});

		// Find max absolute value for color scaling
		let maxAbs = 0;
		props.forEach(p => devigs.forEach(d => {
			const cell = matrix[p]?.[d];
			if (cell) maxAbs = Math.max(maxAbs, Math.abs(cell.val));
		}));
		if (maxAbs === 0) maxAbs = 1;

		const getColor = (val) => {
			const intensity = Math.min(Math.abs(val) / maxAbs, 1);
			const alpha = 0.08 + intensity * 0.55;
			return val >= 0
				? `rgba(34,197,94,${alpha})`
				: `rgba(239,68,68,${alpha})`;
		};

		const fmtVal = (val) => {
			const sign = val >= 0 ? '+' : '';
			return !isProfit ? `${sign}${val}%` : `${sign}${val.toFixed(1)}u`;
		};

		let rows = '';
		for (const prop of props) {
			rows += `<tr><td class="prop-label">${prop}</td>`;
			for (const devig of devigs) {
				const cell = matrix[prop]?.[devig];
				if (!cell) {
					rows += `<td class="matrix-cell empty">—</td>`;
				} else {
					const total = cell.w + cell.l;
					const winPct = total > 0 ? Math.round(cell.w / total * 100) : 0;
					const bookLabel = allBooks ? `<div class="cell-book">${cell.book}</div>` : '';
					rows += `
						<td class="matrix-cell" style="background:${getColor(cell.val)}"
							title="${cell.book} | ${cell.w}W-${cell.l}L (${winPct}%)">
							${bookLabel}
							<div class="cell-val ${cell.val < 0 ? 'neg' : 'pos'}">${fmtVal(cell.val)}</div>
							<div class="cell-record">${cell.w}W-${cell.l}L</div>
						</td>`;
				}
			}
			rows += '</tr>';
		}

		const tableHtml = `
			<div style="overflow-x:auto;">
				<table class="matrix-table">
					<thead>
						<tr>
							<th>Prop</th>
							${devigs.map(d => `<th>${d.toUpperCase()}</th>`).join('')}
						</tr>
					</thead>
					<tbody>${rows}</tbody>
				</table>
			</div>`;

		container.insertAdjacentHTML('beforeend', tableHtml);
	}

	function toggleCard(card) {
		card.classList.toggle('expanded');
		const btn = card.querySelector('.expand-btn');
		btn.textContent = card.classList.contains('expanded') ? 'Show Less' : 'Show More';
	}

	function toggleAll(expand) {
		const cards = document.querySelectorAll('.book-card');
		cards.forEach(card => {
			if (expand) {
				card.classList.add('expanded');
			} else {
				card.classList.remove('expanded');
			}
			const btn = card.querySelector('.expand-btn');
			if (btn) btn.textContent = expand ? 'Show Less' : 'Show More';
		});
	}

	function initFilters() {
		const devigs = new Set();
		const props = new Set();

		RES = RECORD[SPORT][METHOD || "worst"] || {};

		Object.values(RES).forEach(book => {
			Object.keys(book).forEach(key => {
				const [prop, devig] = key.split('-vs-');
				if (prop) props.add(prop);
				if (devig) devigs.add(devig);
			});
		});

		const devigMenu = document.getElementById('devig-options');
		const propMenu = document.getElementById('prop-options');

		propMenu.innerHTML = `
			<div class="chkdd-actions">
				<button type="button" data-act="all">All</button>
				<button type="button" data-act="none">None</button>
			</div>
		`;
		devigMenu.innerHTML = `
			<div class="chkdd-actions">
				<button type="button" data-act="all">All</button>
				<button type="button" data-act="none">None</button>
			</div>
		`;

		const createItem = (val, container) => {
			const label = document.createElement('label');
			label.setAttribute("onclick", "event.stopPropagation()")
			label.innerHTML = `<input type="checkbox" value="${val}" checked onchange="renderDashboard()"> ${val.toUpperCase()}`;
			container.appendChild(label);
		};

		[...devigs].sort().forEach(d => createItem(d, devigMenu));
		[...props].sort().forEach(p => createItem(p, propMenu))
	}

	window.onclick = function(event) {
		if (!event.target.matches('.chkdd-btn')) {
			document.querySelectorAll('.chkdd-menu').forEach(m => m.style.display = 'none');
		}
	}

	document.addEventListener('click', function (e) {
		const btn = e.target.closest('.chkdd-actions button');
		if (!btn) return;

		e.stopPropagation();

		const action = btn.dataset.act;
		const menu = btn.closest('.chkdd-menu');
		const checkboxes = menu.querySelectorAll('input[type="checkbox"]');

		checkboxes.forEach(cb => {
			cb.checked = action === 'all';
		});

		renderDashboard();
	});

	initFilters();
	renderDashboard();
</script>
