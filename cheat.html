<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Betting Performance Infographic</title>
	<link href="style.css" rel="stylesheet">
	<style>
		:root {
			--bg-color: #0f172a;
			--card-bg: #1e293b;
			--text-main: #f8fafc;
			--text-dim: #94a3b8;
			--accent: #38bdf8;
			--success: #22c55e;
			--card-max-height: 300px;
		}

		html {
			overflow: auto;
		}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background-color: var(--bg-color);
			color: var(--text-main);
			margin: 0;
			line-height: 1.5;
			overflow: auto;
		}

		.header {
			text-align: center;
		}

		.header h1 { margin: 0; color: var(--accent); letter-spacing: -1px; }

		.controls {
			display: flex;
			justify-content: center;
			gap: 15px;
			margin-bottom: 30px;
			padding-bottom: 20px;
			border-bottom: 1px solid #334155;
		}

		.btn-ctrl {
			background-color: #334155;
			color: var(--text-main);
			border: 1px solid #475569;
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-weight: 600;
			font-size: 0.85rem;
			transition: all 0.2s;
		}

		.btn-ctrl:hover {
			background-color: #475569;
			border-color: var(--accent);
		}

		.dashboard {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
			gap: 20px;
			max-width: 1600px;
			margin: 0 auto;
		}

		.book-card {
			background-color: var(--card-bg);
			border-radius: 12px;
			padding: 16px;
			position: relative;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
			border: 1px solid #334155;
			display: flex;
			flex-direction: column;
			transition: all 0.3s ease;

		    background-image: url('logos/logo.png');
		    background-repeat: no-repeat;
		    background-position: top center;
		    background-size: 15%;
		    background-blend-mode: soft-light;
		}

		.book-title {
			font-size: 1.1rem;
			font-weight: 800;
			padding-bottom: 12px;
			margin-bottom: 8px;
			border-bottom: 2px solid #334155;
			color: var(--accent);
			text-transform: uppercase;
		}

		.card-content {
			max-height: var(--card-max-height);
			overflow: hidden;
			transition: max-height 0.4s ease-in-out;
			position: relative;
		}

		.card-content::after {
			content: "";
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 50px;
			background: linear-gradient(transparent, var(--card-bg));
			pointer-events: none;
			transition: opacity 0.3s;
		}

		/* Expanded State */
		.book-card.expanded .card-content {
			max-height: 2000px; /* Large enough to fit all content */
		}

		.book-card.expanded .card-content::after {
			opacity: 0;
		}

		.book-title {
			font-size: 1.1rem;
			font-weight: 800;
			padding-bottom: 12px;
			margin-bottom: 8px;
			border-bottom: 2px solid #334155;
			color: var(--accent);
			text-transform: uppercase;
			cursor: pointer;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.book-title::after {
			content: '▼';
			font-size: 0.7rem;
			transition: transform 0.3s;
		}

		.book-card.expanded .book-title::after {
			transform: rotate(180deg);
		}

		.entry {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 8px 0;
			border-bottom: 1px solid #2d3748;
		}

		.entry:last-child { border-bottom: none; }

		.market-info { display: flex; flex-direction: column; }
		.market-name { font-weight: 600; font-size: 0.95rem; }
		.devig-source { font-size: 0.75rem; color: var(--text-dim); }

		.units-badge {
			background: rgba(34, 197, 94, 0.1);
			color: var(--success);
			padding: 4px 8px;
			border-radius: 4px;
			font-weight: 700;
			font-family: 'Courier New', Courier, monospace;
			font-size: 0.9rem;
		}

		.no-unit { color: var(--text-dim); background: rgba(148, 163, 184, 0.1); }

		.expand-btn {
			background: none;
			border: none;
			color: var(--accent);
			cursor: pointer;
			font-size: 0.8rem;
			font-weight: bold;
			padding: 10px 0 0 0;
			text-align: center;
			width: 100%;
			display: block;
		}
	</style>
</head>

const dashboard = document.getElementById('dashboard');

// Create cards
function renderDashboard() {
	Object.keys(bettingData).forEach(bookName => {
		const card = document.createElement('div');
		card.className = 'book-card';
		
		// Sort lines by units (descending)
		const sortedLines = bettingData[bookName].sort((a, b) => (b.u || 0) - (a.u || 0));
		
		let entriesHtml = sortedLines.map(line => `
			<div class="entry">
				<div class="market-info">
					<span class="market-name">${line.market}</span>
					<span class="devig-source">vs ${line.vs}</span>
				</div>
				<span class="units-badge ${line.u === null ? 'no-unit' : ''}">
					${line.u !== null ? '+' + line.u + 'u' : ''}
				</span>
			</div>
		`).join('');

		card.innerHTML = `
			<div class="book-title" onclick="toggleCard(this.parentElement)">
				${bookName}
			</div>
			<div class="card-content">
				${entriesHtml}
			</div>
			<button class="expand-btn" onclick="toggleCard(this.parentElement)">Show More</button>
		`;
		
		dashboard.appendChild(card);
	});
}

function toggleCard(card) {
	card.classList.toggle('expanded');
	const btn = card.querySelector('.expand-btn');
	btn.textContent = card.classList.contains('expanded') ? 'Show Less' : 'Show More';
}

function toggleAll(expand) {
	const cards = document.querySelectorAll('.book-card');
	cards.forEach(card => {
		if (expand) {
			card.classList.add('expanded');
		} else {
			card.classList.remove('expanded');
		}
		const btn = card.querySelector('.expand-btn');
		if (btn) btn.textContent = expand ? 'Show Less' : 'Show More';
	});
}

renderDashboard();
</script>
