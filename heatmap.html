<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Heatmap Viewer</title>
	<link href="style.css" rel="stylesheet">
	<style>
		header {
			position: sticky;
			top: 0;
			z-index: 5;
			background: rgba(15,17,21,0.92);
			backdrop-filter: blur(10px);
			border-bottom: 1px solid rgba(255,255,255,0.08);
			padding: 10px 12px;
			display: flex;
			gap: 10px;
			align-items: center;
			flex-wrap: wrap;
		}
		.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; }
		.pill {
			padding: 6px 10px;
			border: 1px solid rgba(255,255,255,0.12);
			background: rgba(255,255,255,0.04);
			border-radius: 999px;
			font-size: 12px;
		}
		button, select, input {
			border: 1px solid rgba(255,255,255,0.14);
			background: rgba(255,255,255,0.06);
			color: #e8e8e8;
			border-radius: 10px;
			padding: 8px 10px;
			font-size: 14px;
			outline: none;
		}
		button { cursor: pointer; }
		button:disabled { opacity: 0.45; cursor: not-allowed; }
		input { width: min(520px, 100%); }
		main {
			padding: 12px;
			display: grid;
			place-items: center;
		}

		.layout {
			display: flex;
			height: 100vh;
		}

		/* LEFT: controls */
		.controls{
			width: 340px;
			max-width: 90vw;
			border-right: 1px solid rgba(255,255,255,0.08);
			overflow: hidden; /* inner scroll */
		  }
		  .controls-inner{
			height: 100vh;
			display: flex;
			flex-direction: column;
		  }
		  .controls-top{
			padding: 14px 14px 10px;
			border-bottom: 1px solid rgba(255,255,255,0.08);
		  }
		  .controls-title{
			font-size: 16px;
			font-weight: 800;
			letter-spacing: 0.2px;
		  }
		  .controls-sub{
			margin-top: 6px;
			font-size: 12px;
			opacity: 0.85;
			min-height: 16px;
		  }
		  .controls-block{
			padding: 12px 14px;
			border-bottom: 1px solid rgba(255,255,255,0.06);
		  }
		  .controls-row{
			display: flex;
			gap: 10px;
			width: 100%;
		  }
		  .btn{
			flex: 1;
			border: 1px solid rgba(255,255,255,0.14);
			background: rgba(255,255,255,0.06);
			color: #e8e8e8;
			border-radius: 10px;
			padding: 10px 10px;
			font-size: 14px;
			cursor: pointer;
		  }
		  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }

		  .label{
			display: block;
			margin: 10px 0 6px;
			font-size: 12px;
			font-weight: 700;
			opacity: 0.9;
		  }
		  .select{
			width: 100%;
			border: 1px solid rgba(255,255,255,0.14);
			background: rgba(255,255,255,0.06);
			color: #e8e8e8;
			border-radius: 10px;
			padding: 10px 10px;
			font-size: 14px;
			outline: none;
		  }
		  .hint{
			margin-top: 10px;
			font-size: 12px;
			opacity: 0.75;
		  }

		/* RIGHT: image */
		.viewer {
			flex: 1;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 12px;
			overflow: hidden;
		}

		.img-wrap {
			display: flex;
			justify-content: center;
			height: calc(100vh - 24px);
			width: 100%;
			max-width: 1400px;
			max-height: calc(100vh - 24px);
			overflow: auto;
			border-radius: 14px;
			border: 1px solid rgba(255,255,255,0.10);
			background: rgba(0,0,0,0.25);
		}
		img {
			height: calc(100vh - 24px);
			width: auto;
			max-width: none;
			display: block;
		}
		.hint {
			font-size: 12px;
			opacity: 0.8;
		}
		.spacer { flex: 1; }
		.danger { color: #ffb4b4; }

		@media (max-width: 900px) {
			.layout {
				flex-direction: column;
			}

			.controls{
			  width: 100%;
			  max-width: none;
			  border-right: none;
			  border-bottom: 1px solid rgba(255,255,255,0.08);
			}
			.controls-inner{ height: auto; }

			.viewer {
				padding: 8px;
			}

			 .img-wrap {
				height: auto;
				max-height: none;
				overflow-x: auto;
				overflow-y: hidden;
			  }

			  .img-wrap img {
				width: 100%;
				height: auto;
				max-width: 100%;
				transform: none; /* disable zoom scaling on mobile */
			  }
		}
	</style>
</head>
<body>
	<div class="layout">
		<aside class="controls">
		  <div class="controls-inner">
			<div class="controls-top">
			  <div class="controls-title">Heatmap</div>
			  <div class="controls-sub" id="status"></div>
			</div>

			<div class="controls-block">
				<div class="controls-row">
					<button id="btnPrev" class="btn" title="Previous (←)">Prev</button>
					<button id="btnNext" class="btn" title="Next (→)">Next</button>
				</div>

				<label class="label" for="selImages">Devigs</label>
				<div class="select-wrapper">
					<select id="selImages" class="select" title="Choose image"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
					  <path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>


				<label class="label" for="page-select">Page</label>
				<div class="select-wrapper">
					<select id="page-select" class="select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
					  <path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>

				<label class="label" for="selSport">Sport</label>
				<div class="select-wrapper">
					<select id="selSport" class="select">
					  <option value="nba">NBA</option>
					  <option value="nhl">NHL</option>
					</select>
					<svg class="select-arrow" viewBox="0 0 20 20">
					  <path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
			</div>

			<div class="controls-block">
			  <label class="label">Zoom</label>
			  <div class="controls-row">
				<button id="btnZoomOut" class="btn" title="Zoom out">−</button>
				<button id="btnZoomReset" class="btn" title="Reset zoom">Reset</button>
				<button id="btnZoomIn" class="btn" title="Zoom in">+</button>
			  </div>
			  <div class="hint">Tip: ←/→ to toggle</div>
			</div>
		  </div>
		</aside>

		<main class="viewer">
			<div class="img-wrap">
				<img id="heatmapImg" alt="heatmap" />
			</div>
		</main>
	</div>
	<script type="text/javascript" src="shared.js"></script>
	<script>

		const $ = (id) => document.getElementById(id);

		const btnBack = $("btnBack");
		const btnPrev = $("btnPrev");
		const btnNext = $("btnNext");
		const selSport = $("selSport");
		const selImages = $("selImages");
		const imgEl = $("heatmapImg");
		const btnOpen = $("btnOpen");
		const status = $("status");

		const btnZoomOut = $("btnZoomOut");
		const btnZoomIn = $("btnZoomIn");
		const btnZoomReset = $("btnZoomReset");

		let zoom = 1;
		let images = [];   // full paths
		let currentIndex = -1;

		function setStatus(msg, isError=false) {
			status.textContent = msg || "";
			status.className = isError ? "hint danger" : "hint";
		}

		function setZoom(z) {
			zoom = Math.max(0.25, Math.min(4, z));
			imgEl.style.transform = `scale(${zoom})`;
		}

		function parseQuery() {
			const params = new URLSearchParams(location.search);
			const img = params.get("img") || "";
			return { img };
		}

		function getFolder(path) {
			const i = path.lastIndexOf("/");
			return i >= 0 ? path.slice(0, i) : "";
		}

		function getFile(path) {
			const i = path.lastIndexOf("/");
			path = i >= 0 ? path.slice(i + 1) : path;
			let [b,d] = path.replace(".png", "").split("_");
			return `${b.toUpperCase()} vs ${d.toUpperCase().replaceAll("%2B", "+")}`;
		}

		async function headOk(url) {
			try {
				const r = await fetch(url, { method: "HEAD" });
				return r.ok;
			} catch {
				return false;
			}
		}

		function updateNavButtons() {
			const hasList = images.length > 0 && currentIndex >= 0;
			btnPrev.disabled = !hasList || currentIndex <= 0;
			btnNext.disabled = !hasList || currentIndex >= images.length - 1;
			selImages.disabled = !hasList;
		}

		function populateSelect() {
			selImages.innerHTML = "";
			if (!images.length) {
				selImages.innerHTML = `<option value="">(no list found)</option>`;
				updateNavButtons();
				return;
			}
			images.forEach((p, idx) => {
				const opt = document.createElement("option");
				opt.value = String(idx);
				opt.textContent = getFile(p);
				selImages.appendChild(opt);
			});
			if (currentIndex >= 0) selImages.value = String(currentIndex);
			updateNavButtons();
		}

		function setCurrentByPath(path) {
			const idx = images.indexOf(path);
			currentIndex = idx >= 0 ? idx : -1;
			if (currentIndex >= 0) selImages.value = String(currentIndex);
			updateNavButtons();
		}

		function pushUrl(imgPath) {
			const params = new URLSearchParams(location.search);
			params.set("img", imgPath);
			const newUrl = `${location.pathname}?${params.toString()}`;
			history.replaceState(null, "", newUrl);
		}

		async function loadImage(path) {
			if (!path) {
				imgEl.removeAttribute("src");
				setStatus("No image specified.", true);
				return;
			}

			// show immediately; browser will error if missing
			imgEl.src = path;

			// quick check for existence
			const ok = await headOk(path);
			if (!ok) {
				setStatus(`Image not found: ${path}`, true);
			} else {
				setStatus("");
			}

			pushUrl(path);
			setCurrentByPath(path);
		}

		function goIndex(delta) {
			if (!images.length || currentIndex < 0) return;
			const next = currentIndex + delta;
			if (next < 0 || next >= images.length) return;
			currentIndex = next;
			populateSelect();
			loadImage(images[currentIndex]);
		}

		btnPrev.addEventListener("click", () => goIndex(-1));
		btnNext.addEventListener("click", () => goIndex(1));

		selImages.addEventListener("change", () => {
			const idx = parseInt(selImages.value, 10);
			if (!Number.isFinite(idx) || !images[idx]) return;
			currentIndex = idx;
			updateNavButtons();
			loadImage(images[currentIndex]);
		});

		btnZoomOut.addEventListener("click", () => setZoom(zoom - 0.1));
		btnZoomIn.addEventListener("click", () => setZoom(zoom + 0.1));
		btnZoomReset.addEventListener("click", () => setZoom(1));

		window.addEventListener("keydown", (e) => {
			if (e.key === "ArrowLeft") goIndex(-1);
			if (e.key === "ArrowRight") goIndex(1);
		});

		async function loadIndexJson() {
			const r = await fetch("/heatmaps/index.json", { cache: "no-store" });
			if (!r.ok) throw new Error("Missing /heatmaps/index.json");

			const obj = await r.json();

			return Object.keys(obj).map(p =>
				p.startsWith("/") ? p : `/heatmaps/${p}`
			);
		}


		// Init
		(async function init() {
			setZoom(1);

			const { img } = parseQuery();

			const allImages = await loadIndexJson();

			const bySport = {
			  nba: [],
			  nhl: [],
			};

			for (const p of allImages) {
			  if (p.includes("/nba_")) bySport.nba.push(p);
			  else if (p.includes("/nhl_")) bySport.nhl.push(p);
			}

			SPORT = "nba";
			function setSport(sport) {
			  SPORT = sport;
			  images = bySport[sport] || [];
			  images.sort((a, b) => a.localeCompare(b));

			  currentIndex = images.length ? 0 : -1;
			  populateSelect();
			  if (currentIndex >= 0) {
			  	loadImage(images[currentIndex])
			  } else {
			  	imgEl.removeAttribute("src")
			  };
			}

			selSport.addEventListener("change", () => {
			  setSport(selSport.value);
			});

			if (img) {
				if (img.includes("/nhl_")) selSport.value = "nhl";
				if (img.includes("/nba_")) selSport.value = "nba";
			}

			setSport(selSport.value);

			if (img) {
				loadImage(img);
			}

			populateSelect();
		})();
	</script>
	<script type="text/javascript" src="filter.js"></script>
</body>
</html>
