
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Heatmap Viewer</title>
	<link href="style.css" rel="stylesheet">
	<style>
		.roi.positive { color: #22c55e; }
		.roi.negative { color: #ef4444; }
		#header {
			padding: 1rem 2rem;
		}
		#heatmap {
			width: 100%;
			height: 70vh; min-height: 520px
		}
		/* book picker styles */
		#book-select { display: none; }

		#center-dropdown {
			position:relative;
			display: flex;
			flex-direction: column;
			gap: 10px;
			align-items: flex-start;
		}
		#center-dropdown button {
			background: none;
		}
		#heatmap-tooltip {
			position: fixed;
			z-index: 10000;
			pointer-events: none;
			max-width: 420px;
			background: rgba(12,14,20,0.95);
			color: #e6e6e6;
			border: 1px solid rgba(255,255,255,0.06);
			padding: 8px;
			border-radius: 8px;
			font-size: 12px;
			display: none;
			box-shadow: 0 6px 18px rgba(0,0,0,0.6);
		}

		.dev-chip-wrap {
			display: flex;           /* use normal flex (not inline-flex) so gap works reliably */
			flex-direction: column;
			align-items: center;
			flex: 0 0 auto;         /* never shrink, occupy own slot in the scroller */
			margin-right: 8px;
			min-width: 0;
		}

		.book-chip,
		.dev-chip {
			flex: 0 0 auto;         /* prevent chips from shrinking and overlapping */
			display: inline-block;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
		}

			/* keep the small record line compact and prevent it from forcing layout */
		.dev-subinfo {
			margin-top: 6px;
			font-size: 11px;
			color: #bfc6cc;
			line-height: 1;
			max-width: 88px;        /* limit width so it doesn't push neighbors */
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			text-align: center;
		}

		.book-picker,
		#dev-picker {
			display: flex;
			gap: 8px;
			padding: 16px 6px;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
			align-items: center;
			white-space: nowrap;
			min-width: 0;
		}
		.book-picker::-webkit-scrollbar,
		#dev-picker::-webkit-scrollbar { height: 8px; }
		.book-picker::-webkit-scrollbar-thumb,
		#dev-picker::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 6px; }

		/* chips */
		.book-chip,
		.dev-chip {
			flex: 0 0 auto;
			background: #172027;
			color: #e6e6e6;
			border: 1px solid #2a2e39;
			border-radius: 999px;
			padding: 6px 12px;
			font-size: 13px;
			white-space: nowrap;
			cursor: pointer;
			transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
		}

		.book-chip:hover,
		.dev-chip:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 14px rgba(0,0,0,0.32);
		}

		.book-chip:focus,
		.dev-chip:focus {
			outline: none;
			box-shadow: 0 0 0 3px rgba(31,101,255,0.14);
		}

		/* active styling (visible in dark mode) */
		.book-chip.active,
		.dev-chip.active {
			background: linear-gradient(180deg,#1f65ff,#1554d6) !important;
			border-color: #1554d6;
			color: #ffffff;
			box-shadow: 0 6px 18px rgba(31,101,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.15);
			transform: translateY(-1px);
		}

		/* label + wrapper adjustments for compact header */
		.select-wrapper {
			display: flex;
			gap: 6px;
			min-width: 0;
		}
		.select-label {
			font-size: 12px;
			color: #bfc6cc;
		}

		/* ensure pickem scrolls smoothly and doesn't wrap */
		#book-picker, #dev-picker { white-space: nowrap; }

		/* optional max-width to avoid pushing header too far on narrow screens */
		#book-picker { width: 100%; }
		#dev-picker  { width: 100%; }

		#header-top {
			display: flex;width:100%;gap:10px;
		}

		@media (min-width: 1100px) {
			/* on large screens allow the devig row to expand further */
			#dev-picker {  }
			/* keep header horizontally compact when space allows */
			#center-dropdown { flex-direction: row; gap: 18px; align-items: center; }
			/* visually separate title area from controls */
			#title { margin-right: 12px; }
		}
		@media (max-width: 700px){
			#header {
				padding: 0.5rem 1rem
			}
			#heatmap { height: 80vh; min-height: 240px; }
			#header-top {
				flex-wrap: wrap;
			}
		}
	</style>
</head>

	<script>
		PAGE = "heatmap";
		let RECORD;
		let SIZING = "unit";
		parseURLParams();

		function initBookPicker(){
			const select = document.getElementById('book-select');
			const picker = document.getElementById('book-picker');
			if (!select || !picker) return;
			picker.innerHTML = '';
			Array.from(select.options).forEach(opt => {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'book-chip';
				btn.dataset.value = opt.value;
				btn.textContent = opt.text;
				if ((BOOK === undefined && opt.selected) || (BOOK && opt.value === BOOK)) {
					btn.classList.add('active');
					// ensure BOOK matches the selected option
					BOOK = opt.value;
					select.value = opt.value;
				}
				btn.addEventListener('click', () => {
					BOOK = opt.value;
					select.value = BOOK;
					document.querySelectorAll('.book-chip').forEach(c => c.classList.toggle('active', c === btn));
					btn.scrollIntoView({behavior: 'smooth', inline: 'center'});
					updateHeatmap();
				});
				picker.appendChild(btn);
			});
			// scroll active into view
			const active = picker.querySelector('.book-chip.active');
			if (active) active.scrollIntoView({inline: 'center'});
		}

		// init devig picker by reading available dev keys from the gz JSON (union across books)
        async function initDevPicker(data){
			const devSet = new Set(Object.keys(data || {}));
			const picker = document.getElementById('dev-picker');
			const hidden = document.getElementById('devig-select');
			if (!picker) return;
			picker.innerHTML = '';
			if (hidden) hidden.innerHTML = '';

			const getRoi = dev => {
				try {
					const rec = RECORD?.[BOOK]?.[`${PROP}-vs-${dev}`]?.["All"];
					return (typeof rec?.roi === 'number') ? rec.roi : -Infinity;
				} catch { return -Infinity; }
			};
		Array.from(devSet).sort((a, b) => getRoi(b) - getRoi(a)).forEach(dev => {
				// wrapper holds the chip button and the small record line beneath
				const wrap = document.createElement('div');
				wrap.className = 'dev-chip-wrap';

				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'book-chip dev-chip';
				btn.dataset.value = dev;
				btn.textContent = dev.toUpperCase();
				wrap.appendChild(btn);

				// try to read record from RECORD global (by BOOK & dev key)
				const info = document.createElement('div');
				info.className = 'dev-subinfo';
				let recText = '';
				try {
					let rec = (typeof RECORD !== 'undefined' && RECORD && RECORD[BOOK]) ? RECORD[BOOK][`${PROP}-vs-${dev}`] : null;
					if (rec) {
						rec = rec["All"];
						const wins = rec.wins ?? rec.w ?? 0;
						const losses = rec.losses ?? rec.l ?? 0;
						const roi = (typeof rec.roi === 'number') ? `${rec.roi > 0 ? '+' : ''}${rec.roi}%` : (rec.roi ?? '');
						//recText = `${wins}W ${losses}L ${roi ? `(${roi})` : ''}`;
						recText = `${wins}W - ${losses}L ${roi ? `<br><span class="roi ${rec.roi > 0 ? 'positive' : 'negative'}">${roi}</span>` : ''}`;
					}
				} catch (e) {
					recText = '';
				}
				info.innerHTML = recText;
				wrap.appendChild(info);

				// default selection logic: preserve DEVIG or pick first available
				if ((DEVIG === undefined && dev === (hidden && hidden.querySelector('option[selected]') ? hidden.querySelector('option[selected]').value : null)) || (DEVIG && dev === DEVIG)) {
					btn.classList.add('active');
					DEVIG = dev;
					if (hidden) hidden.value = dev;
				}

				btn.addEventListener('click', () => {
					DEVIG = dev;
					if (hidden) hidden.value = dev;
					// toggle active class only on buttons
					document.querySelectorAll('.dev-chip').forEach(c => c.classList.toggle('active', c === btn));
					btn.scrollIntoView({behavior: 'smooth', inline: 'center'});
					updateHeatmap();
				});

				picker.appendChild(wrap);
			});

			// ensure active visible
			const activeWrap = picker.querySelector('.dev-chip.active');
			if (activeWrap) {
				// if the active element is a button inside wrap, scroll its wrapper
				const btn = picker.querySelector('.dev-chip.active');
				if (btn && btn.parentElement) btn.parentElement.scrollIntoView({inline: 'center'});
			}
		}

		function initPropPicker(props) {
			const propSet = new Set(Object.keys(props || {}));
			const sel = document.getElementById('selProp');
			if (!sel) return;

			// populate select
			sel.innerHTML = '';
			const propsList = Array.from(propSet).sort();
			propsList.forEach(p => {
				const opt = document.createElement('option');
				opt.value = p;
				opt.text = p.toUpperCase();
				sel.appendChild(opt);
			});

			if (!PROP || !propSet.has(PROP)) PROP = propsList[0] || '';
			sel.value = PROP;

			sel.addEventListener('change', (e) => {
				PROP = e.target.value;
				updateHeatmap();
			});
		}

		async function loadGzJson(url){
			const res = await fetch(url);
			const buf = await res.arrayBuffer();
			const str = pako.ungzip(new Uint8Array(buf), { to: 'string' });
			return JSON.parse(str);
		}

		function americanWinProfit(odds){
			if (odds === 0) return 0;
			if (odds > 0) return odds/100;
			return 100/Math.abs(odds);
		}

		function arange(start, stop, step){
			const r = [];
			for(let v = start; v <= stop + 1e-9; v += step) r.push(v);
			return r;
		}

		function formatXLabel(left, right){ return `${Math.round(left)}–${Math.round(right)}%`; }
		function formatYLabel(left, right){ return `${Math.round(left)}–${Math.round(right)}`; }

		async function renderHeatmap(gzUrl, opts = {}){
			const cfg = Object.assign({
				roi: false,
				evRange: [0,15], evStep: 1,
				oddsRange: [100,1200], oddsStep: 100,
				minBets: 1,
				bookLabel: 'BOOK',
				devLabel: 'DEV',
				containerId: 'heatmap'
			}, opts);

			//let bets = await loadGzJson(gzUrl);
			//RES = bets;
			initDevPicker(RES["xy"][cfg.prop][cfg.bookLabel]);

			let bets = RES["xy"][cfg.prop][cfg.bookLabel][cfg.devLabel];

			// Convert columnar format {ev:[...], odds:[...], ...} → [{ev, odds, ...}, ...]
			if (bets && !Array.isArray(bets)) {
				const keys = Object.keys(bets);
				const len = bets[keys[0]]?.length || 0;
				bets = Array.from({length: len}, (_, i) => {
					const row = {};
					keys.forEach(k => row[k] = bets[k][i]);
					return row;
				});
			}

			// adjust for sport-specific ranges (optional)
			// filter to display range
			const [evMin, evMaxRange] = cfg.evRange;
			const [odMin, odMaxRange] = cfg.oddsRange;
			const filtered = bets.filter(b => {
				const ev = Number(b.ev);
				const od = Number(b.odds);
				return ev >= evMin && ev <= evMaxRange && od >= odMin && od <= odMaxRange;
			});

			// bins
			const evBins = arange(cfg.evRange[0], cfg.evRange[1], cfg.evStep);
			const oddsBins = arange(cfg.oddsRange[0], cfg.oddsRange[1], cfg.oddsStep);

			const nX = evBins.length - 1;
			const nY = oddsBins.length - 1;

			// initialize matrices
			const sumMatrix = Array.from({length: nY}, () => Array(nX).fill(0));
			const countMatrix = Array.from({length: nY}, () => Array(nX).fill(0));
			const winMatrix = Array.from({length: nY}, () => Array(nX).fill(0));

			const cellBets = Array.from({length: nY}, () => Array.from({length: nX}, () => []));

			function findBinIndex(value, bins){
				if (value < bins[0] || value > bins[bins.length-1]) return -1;
				// right-inclusive as in pandas cut(right=True)
				for(let i=0;i<bins.length-1;i++){
					const left = bins[i], right = bins[i+1];
					if (value >= left && value <= right) return i;
				}
				return -1;
			}

			for(const b of filtered){
				const ev = Number(b.ev);
				const od = Number(b.odds);
				const i = findBinIndex(od, oddsBins);
				const j = findBinIndex(ev, evBins);
				if (i === -1 || j === -1) continue;
				const isWin = !!b.hit;
				const winProfit = americanWinProfit(od);
				let profit;
				if (cfg.sizing === "kelly") {
					const kellyFrac = winProfit > 0 ? ev / (100 * winProfit) : 0;
					profit = isWin ? kellyFrac * winProfit : -kellyFrac;
				} else {
					profit = isWin ? winProfit : -1.0;
				}
				sumMatrix[i][j] += profit;
				countMatrix[i][j] += 1;
				if (isWin) winMatrix[i][j] += 1;

				// store a small bet summary in the cell list (use sensible player field fallbacks)
                const player = b.player || '';
                cellBets[i][j].push({
                    ev: Number(b.ev),
                    odds: Number(b.odds),
                    hit: !!b.hit,
                    player: player
                });
			}

			// produce final heat values (ROI = mean profit per bet, else total)
			const z = Array.from({length: nY}, (_,i) => Array(nX).fill(null));
			let vmin = Infinity, vmax = -Infinity;
			for(let i=0;i<nY;i++){
				for(let j=0;j<nX;j++){
					if (countMatrix[i][j] < cfg.minBets){
						z[i][j] = null;
						continue;
					}
					const val = cfg.roi ? (sumMatrix[i][j] / countMatrix[i][j]) : sumMatrix[i][j];
					z[i][j] = val;
					if (Number.isFinite(val)){
						vmin = Math.min(vmin, val);
						vmax = Math.max(vmax, val);
					}
				}
			}
			if (!isFinite(vmin)) { vmin = -1; vmax = 1; }

			// labels
			const xLabels = [];
			for(let j=0;j<nX;j++){
				xLabels.push(formatXLabel(evBins[j], evBins[j+1]));
			}
			const yLabels = [];
			for(let i=0;i<nY;i++){
				yLabels.push(formatYLabel(oddsBins[i], oddsBins[i+1]));
			}

			let annotations = [];
			for(let i=0;i<nY;i++){
				for(let j=0;j<nX;j++){
					if (countMatrix[i][j] >= cfg.minBets){
						const w = winMatrix[i][j] || 0;
						const l = countMatrix[i][j] - w;
						annotations.push({
							x: xLabels[j],
							y: yLabels[i],
							text: `${w}W ${l}L`,
							showarrow: false,
							font: {size:10, color:'black'},
							align: 'center',
							bgcolor: 'rgba(255,255,255,0.7)'
						});
					}
				}
			}

			if (MOBILE) annotations = [];

			// build Plotly trace
			const trace = {
				z: z,
				x: xLabels,
				y: yLabels,
				type: 'heatmap',
				colorscale: [
					[0.0, '#b2182b'],  // red = bad
					[0.5, '#f7f7f7'],  // neutral
					[1.0, '#2166ac']   // blue = good
				],
				zmid: 0,
				zmin: -1,
				zmax: 1,
				//zmin: Math.min(-Math.abs(vmax), vmin),
				//zmax: Math.max(Math.abs(vmax), -vmin),
				colorbar: {
					title: {
						text: cfg.roi
							? (cfg.sizing === "kelly" ? 'ROI (avg kelly units/bet)' : 'ROI (avg units/bet)')
							: (cfg.sizing === "kelly" ? 'Total Profit (kelly units)' : 'Total Profit (units)')
					},
					orientation: 'h',
					x: 0.5, y: -0.30, xanchor: 'center'
				},
				hoverinfo: 'skip',
				hovertemplate: '%{y}<br>%{x}<br>Value: %{z:.3f}<extra></extra>',
				customdata: cellBets
			};

			const layout = {
				paper_bgcolor: '#0f1117',
				plot_bgcolor: '#0f1117',
				font: {
					color: '#e6e6e6'
				},
				autosize: true,
				showlegend: false,
				responsive: true,
				xaxis: {
					title: {
						text: 'EV %',
					},
					//tickangle: 45,
					gridcolor: '#2a2e39',
					zerolinecolor: '#2a2e39'
				},
				yaxis: {
					title: {
						text: 'Odds',
					},
					autorange: 'reversed',
					gridcolor: '#2a2e39',
					zerolinecolor: '#2a2e39'
				},
				title: {
					text: `${(cfg.sport||'SPORT').toUpperCase()} ${(cfg.prop||'PROP').toUpperCase()} ${(cfg.roi ? 'ROI' : 'Total Profit')} Heatmap — ${cfg.sizing === 'kelly' ? 'Kelly' : 'Unit'} sizing (bet on ${cfg.bookLabel}, devig: vs ${cfg.devLabel}, method: ${METHOD||'worst-case'})`,
				},
				annotations,
				margin: { l: 80, r: 20, t: 40, b: MOBILE ? 160 : 90 },
			};

			Plotly.newPlot(cfg.containerId, [trace], layout, {displayModeBar:false, responsive:true});
			setTimeout(() => {
				Plotly.Plots.resize(cfg.containerId)
			}, 100);

			// custom hover tooltip showing list of bets split between hits and losses
            (function attachTooltip() {
                const gd = document.getElementById(cfg.containerId);
                if (!gd) return;

                // create tooltip element once
                let tip = document.getElementById('heatmap-tooltip');
                if (!tip) {
                    tip = document.createElement('div');
                    tip.id = 'heatmap-tooltip';
                    document.body.appendChild(tip);
                }

                gd.on('plotly_hover', (ev) => {
                    try {
                        if (!ev || !ev.points || !ev.points.length) return;
                        const pt = ev.points[0];
                        // customdata holds the array for each cell
                        const betsList = pt.customdata || [];
                        if (!Array.isArray(betsList) || betsList.length === 0) {
                            tip.style.display = 'none';
                            return;
                        }
                        // partition hits / losses
                        const hits = [], losses = [];
                        for (const bet of betsList) {
                            const line = `${(bet.ev||'').toFixed ? bet.ev.toFixed(2) : bet.ev}% • ${bet.odds} • ${(title(bet.player) || '')}`;
                            if (bet.hit) hits.push(line); else losses.push(line);
                        }
                        let html = `<div style="font-weight:600;margin-bottom:6px;">${pt.y} — ${pt.x} (${betsList.length} bets)</div>`;
                        if (hits.length) {
                            html += `<div style="color:#22c55e;font-weight:600;margin-bottom:4px;">Hits (${hits.length})</div><div style="margin-bottom:6px;">`;
                            html += hits.slice(0,50).map(h => `<div style="margin:2px 0;">${h}</div>`).join('');
                            if (hits.length > 50) html += `<div style="opacity:.7;margin-top:6px;">...and ${hits.length-50} more</div>`;
                            html += `</div>`;
                        }
                        if (losses.length) {
                            html += `<div style="color:#ef4444;font-weight:600;margin-bottom:4px;">Losses (${losses.length})</div><div>`;
                            html += losses.slice(0,50).map(h => `<div style="margin:2px 0;">${h}</div>`).join('');
                            if (losses.length > 50) html += `<div style="opacity:.7;margin-top:6px;">...and ${losses.length-50} more</div>`;
                            html += `</div>`;
                        }
                        tip.innerHTML = html;

                        // position near mouse (ev.event has original browser event)
                        const e = ev.event && (ev.event.clientX !== undefined) ? ev.event : null;
                        if (e) {
                            const x = Math.min(window.innerWidth - 20 - tip.offsetWidth, e.clientX + 12);
                            const y = Math.min(window.innerHeight - 20 - tip.offsetHeight, e.clientY + 12);
                            tip.style.left = `${x}px`;
                            tip.style.top = `${y}px`;
                        }
                        tip.style.display = 'block';
                    } catch (err) {
                        // fail quietly
                        tip.style.display = 'none';
                    }
                });

                gd.on('plotly_unhover', () => {
                    if (tip) tip.style.display = 'none';
                });
            })();
		}

		const selSport = document.getElementById('selSport');
		const selEvStep = document.getElementById('selEvStep');
        const selOddsStep = document.getElementById('selOddsStep');

		selSport.value = SPORT || 'nba';
		selSport.addEventListener('change', () => {
			SPORT = selSport.value;
			BOOK = "fd";
			DEVIG = "circa";
			if (SPORT == "nba") PROP = "reb";
			else if (SPORT == "nhl") PROP = "atgs";
			else if (SPORT == "nfl") PROP = "attd";
			else if (SPORT == "mlb") PROP = "hr";
			//updateHeatmap();
			init();
		});

		if (selEvStep) selEvStep.addEventListener('change', () => updateHeatmap());
        if (selOddsStep) selOddsStep.addEventListener('change', () => updateHeatmap());

		const selSizing = document.getElementById('selSizing');
		if (selSizing) selSizing.addEventListener('change', () => { SIZING = selSizing.value; updateHeatmap(); });

		if (!BOOK) BOOK = 'fd';
		if (!DEVIG) DEVIG = 'circa';
		if (!PROP) {
			if (SPORT === 'nba') PROP = 'reb';
			else if (SPORT === 'nhl') PROP = 'atgs';
			else if (SPORT === 'nfl') PROP = 'attd';
		};

		function getRanges() {
			let evRange = [0,15], oddsRange = [-300,1200];
			if (SPORT === 'nba') {
				//oddsRange = [-300,1200];
			} else if (SPORT === "nhl" && PROP == "atgs") {
				if (METHOD === "probit") {
					evRange = [0,25], oddsRange = [100, 2800];
				} else {
					oddsRange = [100, 1400];
				}
			}
			/*
			if (SPORT === 'nba') {
				evRange = [0,15]; oddsRange = [100,1200];
			} else if (SPORT === 'nhl') {
				evRange = [0,10]; oddsRange = [100,800];
			} else if (SPORT === 'nfl') {
				evRange = [0,20]; oddsRange = [100,1500];
			}
				*/
			return [evRange, oddsRange];
		}

		async function init() {
			initBookPicker();
			RES = await loadGzJson(`/heatmaps/${SPORT}_${METHOD || "worst"}.json.gz`);
			RECORD = RES["record"];
			initPropPicker(RES["xy"]);
			updateHeatmap();
		}

		function updateHeatmap() {
			const params = new URLSearchParams(window.location.search);
			params.set("sport", SPORT);
			params.set("book", BOOK);
			params.set("devig", DEVIG);
			params.set("prop", PROP);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);

			const [evRange, oddsRange] = getRanges();

            const evStep = selEvStep ? Number(selEvStep.value) : 1;
            const oddsStep = selOddsStep ? Number(selOddsStep.value) : 100;

			renderHeatmap(`/heatmaps/${SPORT}.json.gz`, {
				roi: true, minBets: 1, containerId:'heatmap', bookLabel: BOOK, devLabel: DEVIG, sport: SPORT,
				prop: PROP, sizing: SIZING,
				evStep: evStep, oddsStep: oddsStep,
				evRange: evRange, oddsRange: oddsRange
			});
		}

		async function downloadHeatmapImage(){
            const btn = document.getElementById('download-btn');
            const gd = document.getElementById('heatmap');
            if (!gd) {
                alert('Heatmap not ready');
                return;
            }
            const filenameBase = `heatmap_${(SPORT||'sport')}_${(PROP||'prop')}_${(BOOK||'book')}_${(DEVIG||'dev')}`.replace(/[^a-z0-9-_]/gi,'_');
            try {
                if (btn) { btn.disabled = true; btn.textContent = 'Preparing...'; }
                // prefer toImage for data-uri -> anchor download (works across builds)
                if (typeof Plotly.toImage === 'function') {
                    // choose a reasonable export size (scale up for better quality)
                    const width = Math.max(gd.clientWidth, 1200);
                    const height = Math.max(gd.clientHeight, 800);
                    const dataUrl = await Plotly.toImage(gd, {format: 'png', width, height, scale: 2});
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = filenameBase + '.png';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    return;
                }
                // fallback to Plotly.downloadImage if available
                if (typeof Plotly.downloadImage === 'function') {
                    await Plotly.downloadImage(gd, {format:'png', filename: filenameBase, width: Math.max(gd.clientWidth,1200), height: Math.max(gd.clientHeight,800)});
                    return;
                }
                alert('This Plotly build does not support image export.');
            } catch (err) {
                console.error('downloadHeatmapImage error', err);
                alert('Failed to generate image.');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Download PNG'; }
            }
        }

		init();
	</script>
