	<style>
		.roi.positive { color: #22c55e; }
		.roi.negative { color: #ef4444; }

			padding: 1rem 2rem;
		}
		main { min-height: 0; overflow-y: auto; justify-content: flex-start; }
		.heatmap-chart {
			width: 100%;
			height: 70vh; min-height: 520px
		}
		#heatmaps { min-width: 0; flex: 0 0 auto; }
		.heatmap-panel + .heatmap-panel { border-top: 1px solid #2a2e39; margin-top: 16px; }

		#heatmap-status { padding: 0 16px; color: #bfc6cc; font-size: 12px; flex: 0 0 auto; }
		#download-btn:disabled { opacity: .55; cursor: default; }
		/* book picker styles */
		#book-select { display: none; }

		#center-dropdown {
			position:relative;
			display: flex;
			flex-direction: column;
			gap: 10px;
			align-items: flex-start;
		}
		#center-dropdown button {
			background: none;
		}
		#heatmap-tooltip {
			position: fixed;
			z-index: 10000;
			pointer-events: none;
			max-width: 420px;
			background: rgba(12,14,20,0.95);
			color: #e6e6e6;
			border: 1px solid rgba(255,255,255,0.06);
			padding: 8px;
			border-radius: 8px;
			font-size: 12px;
			display: none;
			box-shadow: 0 6px 18px rgba(0,0,0,0.6);
		}

		.dev-chip-wrap {
			display: flex;           /* use normal flex (not inline-flex) so gap works reliably */
			flex-direction: column;
			align-items: center;
			flex: 0 0 auto;         /* never shrink, occupy own slot in the scroller */
			margin-right: 8px;
			min-width: 0;
		}

		.book-chip,
		.dev-chip {
			flex: 0 0 auto;         /* prevent chips from shrinking and overlapping */
			display: inline-block;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
		}

			/* keep the small record line compact and prevent it from forcing layout */
		.dev-subinfo {
			margin-top: 6px;
			font-size: 11px;
			color: #bfc6cc;
			line-height: 1;
			max-width: 88px;        /* limit width so it doesn't push neighbors */
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			text-align: center;
		}

		.book-picker,
		#dev-picker {
			display: flex;
			gap: 8px;
			padding: 16px 6px;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
			align-items: center;
			white-space: nowrap;
			min-width: 0;
		}
		.book-picker::-webkit-scrollbar,
		#dev-picker::-webkit-scrollbar { height: 8px; }
		.book-picker::-webkit-scrollbar-thumb,
		#dev-picker::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 6px; }

		/* chips */
		.book-chip,
		.dev-chip {
			flex: 0 0 auto;
			background: #172027;
			color: #e6e6e6;
			border: 1px solid #2a2e39;
			border-radius: 999px;
			padding: 6px 12px;
			font-size: 13px;
			white-space: nowrap;
			cursor: pointer;
			transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
		}

		.book-chip:hover,
		.dev-chip:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 14px rgba(0,0,0,0.32);
		}

		.book-chip:focus,
		.dev-chip:focus {
			outline: none;
			box-shadow: 0 0 0 3px rgba(31,101,255,0.14);
		}

		/* active styling (visible in dark mode) */
		.book-chip.active,
		.dev-chip.active {
			background: linear-gradient(180deg,#1f65ff,#1554d6) !important;
			border-color: #1554d6;
			color: #ffffff;
			box-shadow: 0 6px 18px rgba(31,101,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.15);
			transform: translateY(-1px);
		}

		/* label + wrapper adjustments for compact header */
		.select-wrapper {
			display: flex;
			gap: 6px;
			min-width: 0;
		}
		.select-label {
			font-size: 12px;
			color: #bfc6cc;
		}

		/* ensure pickem scrolls smoothly and doesn't wrap */
		#book-picker, #dev-picker { white-space: nowrap; }

		/* optional max-width to avoid pushing header too far on narrow screens */
		#book-picker { width: 100%; }
		#dev-picker  { width: 100%; }

		#header-top {
			display: flex;width:100%;gap:10px;
		}

		@media (min-width: 1100px) {
			/* on large screens allow the devig row to expand further */
			#dev-picker {  }
			/* keep header horizontally compact when space allows */
			#center-dropdown { flex-direction: row; gap: 18px; align-items: center; }
			/* visually separate title area from controls */
			#title { margin-right: 12px; }
		}
		@media (max-width: 700px){
			#header {
				padding: 0.5rem 1rem
			}
			.heatmap-chart { height: 80vh; min-height: 240px; }
			#header-top {
				flex-wrap: wrap;
			}
		}

	<script>
		PAGE = "heatmap";
		let RECORD;
		let SIZING = "unit";
		let heatmapBooks = [];
		let heatmapVersion = 0;
		let heatmapLoadVersion = 0;
		parseURLParams();

		function initBookPicker(){
			const select = document.getElementById('book-select');
			if (!select) return;
			const available = new Set(Object.values(RES?.xy || {}).flatMap(books => Object.keys(books || {})));
			const preferred = ['best', 'fd', 'dk', 'b365', 'mgm', 'espn', 'cz', 'fn', 'br', 'hr', 'bv', 'kambi'];
			heatmapBooks = [...new Set([...preferred, ...ALL_WEIGHTABLE_BOOKS, ...available])].filter(book => available.has(book));
			if (BOOK && BOOK !== 'none') BOOK = parseBookFilter(BOOK).filter(book => available.has(book)).join(',') || 'none';
			renderBookSelect(heatmapBooks);
		}

		function selectedHeatmapBooks() {
			if (BOOK === 'none') return [];
			const selected = parseBookFilter(BOOK);
			return selected.length ? heatmapBooks.filter(book => selected.includes(book)) : heatmapBooks.slice();
		}

		// References are shared controls; each book retains its own history and record.
        function initDevPicker(books){
			const propData = RES?.xy?.[PROP] || {};
			const references = books.flatMap(book => Object.keys(propData[book] || {}));
			const devSet = new Set(references.filter((dev, index) => references.findIndex(other => devigSetEquals(dev, other)) === index));
			const singleBook = books.length === 1 ? books[0] : null;
			const picker = document.getElementById('dev-picker');
			const hidden = document.getElementById('devig-select');
			if (!picker) return;
			picker.innerHTML = '';
			if (hidden) hidden.innerHTML = '';

			const getRoi = dev => {
				try {
					const rec = RECORD?.[singleBook]?.[`${PROP}-vs-${dev}`]?.["All"];
					return (typeof rec?.roi === 'number') ? rec.roi : -Infinity;
				} catch { return -Infinity; }
			};
			const devs = Array.from(devSet).sort((a, b) => getRoi(b) - getRoi(a));
			if (devs.length) DEVIG = devs.find(dev => devigSetEquals(dev, DEVIG)) || devs[0];
			if (hidden) {
				hidden.replaceChildren(...devs.map(dev => new Option(dev.toUpperCase(), dev)));
				hidden.value = DEVIG;
			}
			devs.forEach(dev => {
				// wrapper holds the chip button and the small record line beneath
				const wrap = document.createElement('div');
				wrap.className = 'dev-chip-wrap';

				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'book-chip dev-chip';
				btn.dataset.value = dev;
				btn.textContent = dev.toUpperCase();
				wrap.appendChild(btn);

				// try to read record from RECORD global (by BOOK & dev key)
				const info = document.createElement('div');
				info.className = 'dev-subinfo';
				let recText = '';
				try {
					let rec = RECORD?.[singleBook]?.[`${PROP}-vs-${dev}`];
					if (rec) {
						rec = rec["All"];
						const wins = rec.wins ?? rec.w ?? 0;
						const losses = rec.losses ?? rec.l ?? 0;
						const roi = (typeof rec.roi === 'number') ? `${rec.roi > 0 ? '+' : ''}${rec.roi}%` : (rec.roi ?? '');
						//recText = `${wins}W ${losses}L ${roi ? `(${roi})` : ''}`;
						recText = `${wins}W - ${losses}L ${roi ? `<br><span class="roi ${rec.roi > 0 ? 'positive' : 'negative'}">${roi}</span>` : ''}`;
					}
					if (!singleBook) recText = `${books.filter(book => Object.keys(propData[book] || {}).some(other => devigSetEquals(dev, other))).length}/${books.length} books`;
				} catch (e) {
					recText = '';
				}
				info.innerHTML = recText;
				wrap.appendChild(info);

				// default selection logic: preserve DEVIG or pick first available
				if ((DEVIG === undefined && devigSetEquals(dev, hidden && hidden.querySelector('option[selected]') ? hidden.querySelector('option[selected]').value : null)) || (DEVIG && devigSetEquals(dev, DEVIG))) {
					btn.classList.add('active');
					DEVIG = dev;
					if (hidden) hidden.value = dev;
				}

				btn.addEventListener('click', () => {
					DEVIG = dev;
					if (hidden) hidden.value = dev;
					// toggle active class only on buttons
					document.querySelectorAll('.dev-chip').forEach(c => c.classList.toggle('active', c === btn));
					btn.scrollIntoView({behavior: 'smooth', inline: 'center'});
					updateHeatmap();
				});

				picker.appendChild(wrap);
			});

			const activeWrap = picker.querySelector('.dev-chip.active')?.parentElement;
			if (activeWrap) picker.scrollLeft = Math.max(0, activeWrap.offsetLeft - picker.offsetLeft - picker.clientWidth / 2 + activeWrap.clientWidth / 2);
		}

		function initPropPicker(props) {
			const propSet = new Set(Object.keys(props || {}));
			const sel = document.getElementById('selProp');
			if (!sel) return;

			// populate select
			sel.innerHTML = '';
			const propsList = Array.from(propSet).sort();
			propsList.forEach(p => {
				const opt = document.createElement('option');
				opt.value = p;
				opt.text = p.toUpperCase();
				sel.appendChild(opt);
			});

			if (!PROP || !propSet.has(PROP)) PROP = propsList[0] || '';
			sel.value = PROP;

			sel.onchange = (e) => {
				PROP = e.target.value;
				updateHeatmap();
			};
		}

		async function loadGzJson(url){
			const res = await fetch(url);
			const buf = await res.arrayBuffer();
			const str = pako.ungzip(new Uint8Array(buf), { to: 'string' });
			return JSON.parse(str);
		}

		function americanWinProfit(odds){
			if (odds === 0) return 0;
			if (odds > 0) return odds/100;
			return 100/Math.abs(odds);
		}

		function arange(start, stop, step){
			const r = [];
			for(let v = start; v <= stop + 1e-9; v += step) r.push(v);
			return r;
		}

		function formatXLabel(left, right){ return `${Math.round(left)}–${Math.round(right)}%`; }
		function formatYLabel(left, right){ return `${Math.round(left)}–${Math.round(right)}`; }

		async function renderHeatmap(opts = {}){
			const cfg = Object.assign({
				roi: false,
				evRange: [0,15], evStep: 1,
				oddsRange: [100,1200], oddsStep: 100,
				minBets: 1,
				bookLabel: 'BOOK',
				devLabel: 'DEV',
				containerId: 'heatmap'
			}, opts);

			const bookData = RES?.xy?.[cfg.prop]?.[cfg.bookLabel] || {};

			// Server ships pre-binned bets - evIdx -> oddsIdx -> [wins, losses, profitSum] -
			// at a fine grid (RES.grid) instead of one row per historical bet, so we fold
			// each fine bin into whichever display bin (cfg.evStep/oddsStep, user-selectable)
			// its midpoint falls into, rather than filtering/binning raw bets.
			const reference = Object.keys(bookData).find(dev => devigSetEquals(dev, cfg.devLabel));
			const fineBins = bookData[reference];
			const grid = RES["grid"];

			// bins
			const evBins = arange(cfg.evRange[0], cfg.evRange[1], cfg.evStep);
			const oddsBins = arange(cfg.oddsRange[0], cfg.oddsRange[1], cfg.oddsStep);

			const nX = evBins.length - 1;
			const nY = oddsBins.length - 1;

			// initialize matrices
			const sumMatrix = Array.from({length: nY}, () => Array(nX).fill(0));
			const countMatrix = Array.from({length: nY}, () => Array(nX).fill(0));
			const winMatrix = Array.from({length: nY}, () => Array(nX).fill(0));

			function findBinIndex(value, bins){
				if (value < bins[0] || value > bins[bins.length-1]) return -1;
				// right-inclusive as in pandas cut(right=True)
				for(let i=0;i<bins.length-1;i++){
					const left = bins[i], right = bins[i+1];
					if (value >= left && value <= right) return i;
				}
				return -1;
			}

			if (fineBins && grid) {
				for (const evIdxStr in fineBins) {
					const evMid = grid.evMin + (Number(evIdxStr) + 0.5) * grid.evStep;
					const j = findBinIndex(evMid, evBins);
					if (j === -1) continue;

					const oddsCells = fineBins[evIdxStr];
					for (const oddsIdxStr in oddsCells) {
						const oddsMid = grid.oddsMin + (Number(oddsIdxStr) + 0.5) * grid.oddsStep;
						const i = findBinIndex(oddsMid, oddsBins);
						if (i === -1) continue;

						const [w, l, p] = oddsCells[oddsIdxStr];
						let profit;
						if (cfg.sizing === "kelly") {
							// Exact per-bet ev/odds no longer exist post-binning; approximate
							// using this fine bin's midpoint for every bet inside it.
							const winProfit = americanWinProfit(oddsMid);
							const kellyFrac = winProfit > 0 ? evMid / (100 * winProfit) : 0;
							profit = w * kellyFrac * winProfit - l * kellyFrac;
						} else {
							profit = p;
						}
						sumMatrix[i][j] += profit;
						countMatrix[i][j] += (w + l);
						winMatrix[i][j] += w;
					}
				}
			}

			// produce final heat values (ROI = mean profit per bet, else total)
			const z = Array.from({length: nY}, (_,i) => Array(nX).fill(null));
			let vmin = Infinity, vmax = -Infinity;
			for(let i=0;i<nY;i++){
				for(let j=0;j<nX;j++){
					if (countMatrix[i][j] < cfg.minBets){
						z[i][j] = null;
						continue;
					}
					const val = cfg.roi ? (sumMatrix[i][j] / countMatrix[i][j]) : sumMatrix[i][j];
					z[i][j] = val;
					if (Number.isFinite(val)){
						vmin = Math.min(vmin, val);
						vmax = Math.max(vmax, val);
					}
				}
			}
			if (!isFinite(vmin)) { vmin = -1; vmax = 1; }

			// labels
			const xLabels = [];
			for(let j=0;j<nX;j++){
				xLabels.push(formatXLabel(evBins[j], evBins[j+1]));
			}
			const yLabels = [];
			for(let i=0;i<nY;i++){
				yLabels.push(formatYLabel(oddsBins[i], oddsBins[i+1]));
			}

			let annotations = [];
			for(let i=0;i<nY;i++){
				for(let j=0;j<nX;j++){
					if (countMatrix[i][j] >= cfg.minBets){
						const w = winMatrix[i][j] || 0;
						const l = countMatrix[i][j] - w;
						annotations.push({
							x: xLabels[j],
							y: yLabels[i],
							text: `${w}W ${l}L`,
							showarrow: false,
							font: {size:10, color:'black'},
							align: 'center',
							bgcolor: 'rgba(255,255,255,0.7)'
						});
					}
				}
			}

			if (MOBILE) annotations = [];
			if (!fineBins) annotations = [{
				xref: 'paper', yref: 'paper', x: 0.5, y: 0.5,
				text: 'No history for this book, prop and reference.', showarrow: false,
				font: { color: '#bfc6cc', size: 13 }
			}];

			// build Plotly trace
			const trace = {
				z: z,
				x: xLabels,
				y: yLabels,
				type: 'heatmap',
				colorscale: [
					[0.0, '#b2182b'],  // red = bad
					[0.5, '#f7f7f7'],  // neutral
					[1.0, '#2166ac']   // blue = good
				],
				zmid: 0,
				zmin: -1,
				zmax: 1,
				//zmin: Math.min(-Math.abs(vmax), vmin),
				//zmax: Math.max(Math.abs(vmax), -vmin),
				colorbar: {
					title: {
						text: cfg.roi
							? (cfg.sizing === "kelly" ? 'ROI (avg kelly units/bet)' : 'ROI (avg units/bet)')
							: (cfg.sizing === "kelly" ? 'Total Profit (kelly units)' : 'Total Profit (units)')
					},
					tickfont: { size: MOBILE ? 10 : 12 },
					orientation: 'h',
					x: 0.5, y: -0.30, xanchor: 'center'
				},
				hoverinfo: 'skip',
				hovertemplate: '%{y}<br>%{x}<br>Value: %{z:.3f}<extra></extra>'
			};

			const layout = {
				paper_bgcolor: '#0f1117',
				plot_bgcolor: '#0f1117',
				font: {
					color: '#e6e6e6'
				},
				autosize: true,
				showlegend: false,
				responsive: true,
				xaxis: {
					title: {
						text: 'EV %',
					},
					//tickangle: 45,
					gridcolor: '#2a2e39',
					zerolinecolor: '#2a2e39'
				},
				yaxis: {
					title: {
						text: 'Odds',
					},
					autorange: 'reversed',
					gridcolor: '#2a2e39',
					zerolinecolor: '#2a2e39'
				},
				title: {
					text: `${cfg.bookLabel === 'best' ? 'Best book' : cfg.bookLabel.toUpperCase()} · ${(cfg.sport||'SPORT').toUpperCase()} ${(cfg.prop||'PROP').toUpperCase()} ${(cfg.roi ? 'ROI' : 'Total Profit')}<br>${cfg.sizing === 'kelly' ? 'Kelly' : 'Unit'} sizing · vs ${cfg.devLabel.toUpperCase() || '-'} · ${METHOD||'worst-case'}`,
					font: { size: MOBILE ? 12 : 15 },
					x: .5, xanchor: 'center',
				},
				annotations,
				margin: { l: 80, r: 20, t: 65, b: MOBILE ? 160 : 90 },
			};

			await Plotly.newPlot(cfg.containerId, [trace], layout, {displayModeBar:false, responsive:true});

			// custom hover tooltip showing list of bets split between hits and losses
            (function attachTooltip() {
				const gd = typeof cfg.containerId === 'string' ? document.getElementById(cfg.containerId) : cfg.containerId;
				if (!gd?.isConnected) return;

                // create tooltip element once
                let tip = document.getElementById('heatmap-tooltip');
                if (!tip) {
                    tip = document.createElement('div');
                    tip.id = 'heatmap-tooltip';
                    document.body.appendChild(tip);
                }

                gd.on('plotly_hover', (ev) => {
                    try {
                        if (!ev || !ev.points || !ev.points.length) return;
                        const pt = ev.points[0];
                        // customdata holds the array for each cell
                        const betsList = pt.customdata || [];
                        if (!Array.isArray(betsList) || betsList.length === 0) {
                            tip.style.display = 'none';
                            return;
                        }
                        // partition hits / losses
                        const hits = [], losses = [];
                        for (const bet of betsList) {
                            const line = `${(bet.ev||'').toFixed ? bet.ev.toFixed(2) : bet.ev}% • ${bet.odds} • ${(title(bet.player) || '')}`;
                            if (bet.hit) hits.push(line); else losses.push(line);
                        }
                        let html = `<div style="font-weight:600;margin-bottom:6px;">${pt.y} - ${pt.x} (${betsList.length} bets)</div>`;
                        if (hits.length) {
                            html += `<div style="color:#22c55e;font-weight:600;margin-bottom:4px;">Hits (${hits.length})</div><div style="margin-bottom:6px;">`;
                            html += hits.slice(0,50).map(h => `<div style="margin:2px 0;">${h}</div>`).join('');
                            if (hits.length > 50) html += `<div style="opacity:.7;margin-top:6px;">...and ${hits.length-50} more</div>`;
                            html += `</div>`;
                        }
                        if (losses.length) {
                            html += `<div style="color:#ef4444;font-weight:600;margin-bottom:4px;">Losses (${losses.length})</div><div>`;
                            html += losses.slice(0,50).map(h => `<div style="margin:2px 0;">${h}</div>`).join('');
                            if (losses.length > 50) html += `<div style="opacity:.7;margin-top:6px;">...and ${losses.length-50} more</div>`;
                            html += `</div>`;
                        }
                        tip.innerHTML = html;

                        // position near mouse (ev.event has original browser event)
                        const e = ev.event && (ev.event.clientX !== undefined) ? ev.event : null;
                        if (e) {
                            const x = Math.min(window.innerWidth - 20 - tip.offsetWidth, e.clientX + 12);
                            const y = Math.min(window.innerHeight - 20 - tip.offsetHeight, e.clientY + 12);
                            tip.style.left = `${x}px`;
                            tip.style.top = `${y}px`;
                        }
                        tip.style.display = 'block';
                    } catch (err) {
                        // fail quietly
                        tip.style.display = 'none';
                    }
                });

                gd.on('plotly_unhover', () => {
                    if (tip) tip.style.display = 'none';
                });
            })();
		}

		const selSport = document.getElementById('selSport');
		const selEvStep = document.getElementById('selEvStep');
        const selOddsStep = document.getElementById('selOddsStep');

		selSport.value = SPORT || 'nba';
		selSport.addEventListener('change', () => {
			SPORT = selSport.value;
			DEVIG = "circa";
			if (SPORT == "nba") PROP = "reb";
			else if (SPORT == "nhl") PROP = "atgs";
			else if (SPORT == "nfl") PROP = "attd";
			else if (SPORT == "mlb") PROP = "hr";
			//updateHeatmap();
			init();
		});

		if (selEvStep) selEvStep.addEventListener('change', () => updateHeatmap());
        if (selOddsStep) selOddsStep.addEventListener('change', () => updateHeatmap());

		const selSizing = document.getElementById('selSizing');
		if (selSizing) selSizing.addEventListener('change', () => { SIZING = selSizing.value; updateHeatmap(); });

		if (BOOK == null) BOOK = 'fd';
		if (!DEVIG) DEVIG = 'circa';
		if (!PROP) {
			if (SPORT === 'nba') PROP = 'reb';
			else if (SPORT === 'nhl') PROP = 'atgs';
			else if (SPORT === 'nfl') PROP = 'attd';
		};

		function getRanges() {
			let evRange = [0,15], oddsRange = [-300,1200];
			if (SPORT === 'nba') {
				//oddsRange = [-300,1200];
			} else if (SPORT === "nhl" && PROP == "atgs") {
				if (METHOD === "probit") {
					evRange = [0,25], oddsRange = [100, 2800];
				} else {
					oddsRange = [100, 1400];
				}
			}
			/*
			if (SPORT === 'nba') {
				evRange = [0,15]; oddsRange = [100,1200];
			} else if (SPORT === 'nhl') {
				evRange = [0,10]; oddsRange = [100,800];
			} else if (SPORT === 'nfl') {
				evRange = [0,20]; oddsRange = [100,1500];
			}
				*/
			return [evRange, oddsRange];
		}

		async function init() {
			const version = ++heatmapLoadVersion;
			const data = await loadGzJson(`/heatmaps/${SPORT}_${METHOD || "worst"}.json.gz`);
			if (version !== heatmapLoadVersion) return;
			RES = data;
			RECORD = RES["record"];
			initPropPicker(RES["xy"]);
			initBookPicker();
			return updateHeatmap();
		}

		async function updateHeatmap() {
			if (!RES?.xy) return;
			const version = ++heatmapVersion;
			const books = selectedHeatmapBooks();
			initDevPicker(books);
			const [evRange, oddsRange] = getRanges();

            const evStep = selEvStep ? Number(selEvStep.value) : 1;
            const oddsStep = selOddsStep ? Number(selOddsStep.value) : 100;

			const container = document.getElementById('heatmaps');
			container.querySelectorAll('.heatmap-chart').forEach(chart => Plotly.purge(chart));
			container.replaceChildren();
			document.getElementById('heatmap-status').textContent = books.length > 1
				? `${books.length} book histories. Chart controls apply to all books.` : '';
			const download = document.getElementById('download-btn');
			download.disabled = true;
			if (!books.length) {
				const empty = document.createElement('p');
				empty.className = 'heatmap-empty';
				empty.textContent = heatmapBooks.length ? 'Select a betting book to view its history.' : 'No book histories are available.';
				container.appendChild(empty);
			}
			const plots = books.map((book, index) => {
				const panel = document.createElement('section');
				panel.className = 'heatmap-panel';
				panel.dataset.book = book;
				panel.setAttribute('aria-label', `${book === 'best' ? 'Best book' : book.toUpperCase()} history`);
				const chart = document.createElement('div');
				chart.className = 'heatmap-chart';
				chart.id = index === 0 ? 'heatmap' : `heatmap-${index}`;
				panel.appendChild(chart);
				container.appendChild(panel);
				return renderHeatmap({
					roi: true, minBets: 1, containerId: chart, bookLabel: book, devLabel: DEVIG, sport: SPORT,
					prop: PROP, sizing: SIZING, evStep, oddsStep, evRange, oddsRange
				});
			});
			const params = new URLSearchParams(window.location.search);
			params.set("sport", SPORT);
			params.set("book", BOOK);
			params.set("devig", DEVIG);
			params.set("prop", PROP);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			if (newUrl !== window.location.pathname + window.location.search) history.pushState({}, '', newUrl);
			await Promise.all(plots);
			if (version === heatmapVersion) download.disabled = books.length === 0;
		}

		async function downloadHeatmapImage(){
            const btn = document.getElementById('download-btn');
            const charts = [...document.querySelectorAll('.heatmap-chart')].filter(chart => chart.data);
            if (!charts.length || btn.disabled) return;
            const filenameBase = `heatmap_${(SPORT||'sport')}_${(PROP||'prop')}_${(BOOK||'all')}_${(DEVIG||'dev')}`.replace(/[^a-z0-9-_]/gi,'_');
            try {
                if (btn) { btn.disabled = true; btn.textContent = 'Preparing...'; }
                let dataUrl;
                if (charts.length === 1) {
                    const gd = charts[0];
                    dataUrl = await Plotly.toImage(gd, {format: 'png', width: Math.max(gd.clientWidth, 1200), height: Math.max(gd.clientHeight, 800), scale: 2});
                } else {
                    // One image avoids browsers blocking repeated automatic downloads.
                    // Every panel remains independent, with its own book and reference title.
                    const width = 1200, height = 800, columns = 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = width * columns;
                    canvas.height = height * Math.ceil(charts.length / columns);
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#0f1117';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    for (let index = 0; index < charts.length; index++) {
                        const uri = await Plotly.toImage(charts[index], {format: 'png', width, height, scale: 1});
                        const picture = new Image();
                        picture.src = uri;
                        await picture.decode();
                        context.drawImage(picture, (index % columns) * width, Math.floor(index / columns) * height, width, height);
                    }
                    dataUrl = canvas.toDataURL('image/png');
                }
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = filenameBase + '.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (err) {
                console.error('downloadHeatmapImage error', err);
                alert('Failed to generate image.');
            } finally {
                if (btn) { btn.disabled = selectedHeatmapBooks().length === 0; btn.textContent = 'Download PNG'; }
            }
        }

		init();
	</script>
	<script type="text/javascript" src="filter.js"></script>
