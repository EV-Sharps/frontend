	<style>
		.batter-list {
			display: flex;
			flex-direction: row;
			gap: 5px;
			overflow-x: auto;
			margin: 8px 0 4px;
			padding-bottom: 4px;
			scroll-snap-type: x mandatory;
			-webkit-overflow-scrolling: touch;
		}
		.batter-list::-webkit-scrollbar { height: 4px; }
		.batter-list::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
		.batter-item {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 5px 9px;
			border-radius: 7px;
			cursor: pointer;
			background: #0b1220;
			border: 1px solid #1f2937;
			color: #e5e7eb;
			font-size: 12.5px;
			white-space: nowrap;
			flex-shrink: 0;
			scroll-snap-align: start;
		}
		.batter-item:hover { background: #0f172a; }
		.batter-item.active { border-color: #a78bfa; background: #1e1b4b; }
		.batter-item .hand { color: #a78bfa; font-size: 11px; flex-shrink: 0; }
		.batter-detail-header {
			font-size: 14px;
			font-weight: 600;
			color: #e5e7eb;
			padding: 6px 0 6px;
		}
		.batter-ps-toggle { display: flex; gap: 4px; }
		.ps-btn {
			padding: 3px 8px; border-radius: 6px; border: 1px solid #243449;
			background: #0b1220; color: #9ca3af; cursor: pointer; font-size: 11px;
		}
		.ps-btn.is-active { border-color: #a78bfa; color: #a78bfa; background: #1e1b4b; }
		#table {
			width: auto;
		}
		.table {
			max-height: none;
		}
		#pitcher-name, #team-pitcher-name {
			text-align: center;
			display: flex;
			justify-content: center;
		}
		#team-pitcher-name {
			display: none;
		}
		#pitcher-container {
			width: 80%;
  			justify-content: space-evenly;
		}
		.split-panel { min-width: 0; flex: 1; max-width: 550px; }
		#team-pitcher-tables, #pitcher-tables {
			display: flex;
			overflow: hidden;
			justify-content: space-evenly;
		}
		#team-pitcher-tables, .team-pitcher {
			display: none;
		}
		h4 {
			margin: 0;
		}
		.games-bar{
			display:flex;align-items:center;gap:8px;width: 100%;
			justify-content: center;
		}
		.nav{
			background:#0b1220;border:1px solid #1f2937;color:#e5e7eb;
			width:32px;height:32px;border-radius:8px;cursor:pointer;
			align-items: center;
		}
		.nav:hover{background:#0f172a}
		.games-scroller{
		display:flex;gap:12px;overflow-x:auto;padding:8px 4px;
		scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
		}
		.games-scroller::-webkit-scrollbar{height:6px}
		.games-scroller::-webkit-scrollbar-thumb{background:#1f2937;border-radius:4px}
		.game-card {
			scroll-snap-align:center;flex:0 0 auto;width:92px;
		    background:#0b1220;border:1px solid #1f2937;border-radius:12px;
		    padding:8px; text-align:center; color:#e5e7eb; text-decoration:none;
		    transition:transform .08s ease, background .15s ease;
		}
		.game-card.popular {
			border-color: gold;
		}
		.game-card:hover { background: #0f172a; transform: translateY(-1px); }
		.pair{display:flex;align-items:center;justify-content:center;gap:6px}
		.team{
			display:flex;flex-direction:column;align-items:center;gap:2px
			color: initial;
			text-decoration: none;
		}
		.team img{width:28px;height:28px;object-fit:contain}
		.team-btn{
			display:flex;flex-direction:column;align-items:center;gap:2px;
			background:none;border:none;cursor:pointer;padding:0;
		}
		.team-btn img{width:28px;height:28px;object-fit:contain}
		.team-btn .code{font-size:11px;text-transform:uppercase;color:#c7d2fe}
		.code{font-size:11px;text-transform:uppercase;color:#c7d2fe}
		.at{font-size:10px;color:#94a3b8}
		.chev { opacity:.6 }
		.splits-toggle { 
			display:none; gap:8px; margin:8px 0 12px;
			justify-content: center;
		}
		.toggle-btn{
		  padding:6px 10px; border-radius:8px; border:1px solid #243449;
		  background:#0b1220; color:#e5e7eb; cursor:pointer; font-weight:600;
		}
		.batter-container h3 {
			margin-bottom: 0;
		}
		@media (max-width: 768px) {
			#pitcher-container {
				display: flex;
				flex-wrap: wrap;
				width: 100%;
			}
			.splits-toggle {
				display: flex;
			}
			.split-panel, #pitcher-tables {
				width: 100%;
			}
			.toggle-btn.is-active{ border-color:#ffd45a; box-shadow:inset 0 0 0 1px rgba(255,212,90,.35); }
			.is-hidden{ display:none; }
		}
	</style>

	<script type="text/javascript">
		PAGE = "pitcher_mix";
		parseURLParams();

		const windowURL = new URL(window.location.href);
		const URLParams = new URLSearchParams(windowURL.search);
		TEAM = URLParams.get("team") || "lad";

		if (MARK != undefined) {
			document.querySelector("#watermark").style.display = "initial";
			document.querySelector("#table-container").style["max-height"] = "initial";
			document.querySelector("#watermark").style.width = "20%";
		}

		document.querySelector("#side-select").style.display = "none";

		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		window.addEventListener("popstate", () => {
			const team = new URLSearchParams(window.location.search).get("team") || "lad";
			if (ALL_DATA) switchTeam(team);
		});

		handleSession();

		let ALL_DATA = null;

		function fetchMixData() {
			fetch(API_BASE+`/api/pitcher_mix`, {
				headers: {
					Authorization: `Bearer ${ACCESS_TOKEN}`
				}
			}).then(response => response.json()).then(data => {
				ALL_DATA = data;
				renderGames(data.games);
				switchTeam(TEAM);
			}).catch(err => console.log(err));
		}

		function switchTeam(team) {
			TEAM = team;
			const params = new URLSearchParams(window.location.search);
			params.set("team", TEAM);
			history.pushState({}, '', `${window.location.pathname}?${params.toString()}`);

			// highlight active game card
			document.querySelectorAll(".game-card").forEach(c => {
				c.classList.toggle("popular", c.dataset.teams?.split(",").includes(TEAM));
			});

			// clear batter lists + details
			for (const side of ["l","r"]) {
				document.querySelector(`#batter-list-${side}`).innerHTML = "";
				document.querySelector(`#batter-detail-header-${side}`).innerHTML = "";
				try { Tabulator.findTable(`#batter-detail-table-${side}`)?.[0]?.destroy(); } catch(e) {}
				document.querySelector(`#batter-detail-table-${side}`).innerHTML = "";
				SELECTED_BATTER[side] = null;
				SELECTED_PS[side] = null;
				document.getElementById(`batter-ps-toggle-${side}`).style.display = "none";
			}

			// destroy old pitcher Tabulator instances
			["pitcher-table-l","pitcher-table-r","team-pitcher-table-l","team-pitcher-table-r"].forEach(id => {
				const el = document.getElementById(id);
				if (el) {
					try { Tabulator.findTable("#"+id)?.[0]?.destroy(); } catch(e) {}
					el.innerHTML = "";
				}
			});

			const teamData = ALL_DATA.teams?.[TEAM];
			if (!teamData) return;
			const enriched = { ...teamData, games: ALL_DATA.games };
			formatMix(enriched);
			RES = enriched;
			renderPitcherTable(enriched.pitcher);
			renderPitcherTable(enriched.team_pitcher, "team-");
			renderTable(enriched.batters);

			setTimeout(function() {
				if (PRETTY != undefined) pretty_();
				if (GAME) {
					document.querySelector("#team-pitcher-tables").style.display = "flex";
					document.querySelectorAll(".team-pitcher").forEach(r => r.style.display = "flex");
				}
			}, 200);
		}

		function safe(n){ return Number.isFinite(n) ? n : 0; }

		function transformPitcher(pitcher) {
			for (side of ["l", "r"]) {
				if (!pitcher?.pitch) {
					continue;
				}
				const section = pitcher?.pitch[side];
				if (!section) continue;

				const entries = Object.entries(section).map(([type, stats]) => {
					return {
						type: type,
						...stats,
						n: stats["#"] || 0,
						percent: stats["%"] || 0,
					}
				});
				pitcher[`pitch_table_${side}`] = entries;
			}
		}

		let PITCHER_HAND = "r";
		const SELECTED_PS = { l: null, r: null };

		function formatMix(data) {
			const pitcher = data.pitcher;
			const team_pitcher = data.team_pitcher;
			SIDE = pitcher.pitch_hand?.toLowerCase() || "both";
			PITCHER_HAND = SIDE === "l" || SIDE === "r" ? SIDE : "r";
			SELECTED_PS.l = PITCHER_HAND;
			SELECTED_PS.r = PITCHER_HAND;

			transformPitcher(pitcher);
			transformPitcher(team_pitcher);			

			document.querySelector("#pitcher-hr-l").textContent = pitcher?.hr_pitch_l;
			document.querySelector("#pitcher-hr-r").textContent = pitcher?.hr_pitch_r;

			document.querySelector("#team-pitcher-hr-l").textContent = team_pitcher?.hr_pitch_l;
			document.querySelector("#team-pitcher-hr-r").textContent = team_pitcher?.hr_pitch_r;

			const top_pitches = getTopPitches(pitcher);
			const batters = data.batters || [];
			for (const row of batters) {
				for (const side of ["l", "r"]) {
					const section = row.pitch[side];
					if (!section) continue;
					row[`pitch_table_${side}`] = Object.entries(section).map(([type, stats]) => {
						let num = top_pitches[side];
						num = num ? (num.indexOf(type) === -1 ? 0 : num.indexOf(type) + 1) : "";
						return { type, ...stats, n: stats["#"] || 0, percent: stats["%"] || 0, pitch_num: num };
					});
				}
			}
		}

		function getTopPitches(data) {
			const map = {};
			for (which of ["l", "r"]) {
				if (!data[`pitch_table_${which}`]) continue;
				const pitches = data[`pitch_table_${which}`].sort((a,b) => b.n - a.n).map(r => r.type);
				map[which] = pitches;
			}
			return map;
		} 

		// PropFinder-style background color based on percentile
		// High percentile = green (batter advantage); low = red (pitcher advantage)
		// Pass formatterParams: {invert: true} for pitcher-advantage metrics (K%, WHIFF%)
		function getPitchBgColor(pct) {
			if (pct == null) return "";
			if (pct >= 80) return "rgba(46,160,67,0.85)";
			if (pct >= 65) return "rgba(46,160,67,0.45)";
			if (pct >= 40) return "";
			if (pct >= 25) return "rgba(200,56,46,0.45)";
			return "rgba(200,56,46,0.85)";
		}

		const bgPitchFormatter = function(cell, params, rendered) {
			const data = cell.getRow().getData();
			const field = cell.getField();
			let val = cell.getValue();

			let display;
			if (["ba", "woba", "slg", "iso"].includes(field)) {
				display = avgFormatter(cell);
			} else {
				display = (val != null && val !== "") ? parseFloat(val).toFixed(1) + "%" : "";
			}

			let pct = data[field + "_pct"];
			if (params && params.invert && pct != null) pct = 100 - pct;

			rendered(function() {
				const el = cell.getElement();
				const bg = getPitchBgColor(pct);
				el.style.background = bg;
				el.style.color = bg ? "#0f0f0f" : "";
				el.style.fontWeight = bg ? "600" : "";
			});

			return display || "";
		};

		const MIX_COLS = [
			{ title:"Type", field:"type", width:90, formatter: pitchFormatter, hozAlign: "left", frozen: MOBILE },
			{ title:"#", field:"n", sorter:"number", width:45 },
			{ title:"%", field:"percent", sorter:"number", formatter: percentFormatter, width:50 },
			{ title:"BA", field:"ba", sorter:"number", width:50, formatter: bgPitchFormatter },
			{ title:"WOBA", field:"woba", sorter:"number", width:55, formatter: bgPitchFormatter },
			{ title:"SLG", field:"slg", sorter:"number", width:50, formatter: bgPitchFormatter },
			{ title:"ISO", field:"iso", sorter:"number", width:50, formatter: bgPitchFormatter },
			{ title:"HR%", field:"hr_rate", sorter:"number", width:52, formatter: bgPitchFormatter },
			{ title:"K%", field:"k_rate", sorter:"number", width:50, formatter: bgPitchFormatter, formatterParams: {invert: true} },
			{ title:"WHIFF%", field:"whiff_rate", sorter:"number", width:62, formatter: bgPitchFormatter, formatterParams: {invert: true} },
		];

		const BATTER_DATA = { l: {}, r: {} };
		const SELECTED_BATTER = { l: null, r: null };

		function renderTable(data) {
			BATTER_DATA.l = {};
			BATTER_DATA.r = {};

			for (const row of data) {
				const isSwitch = row.pitch_hand === "B";
				if (isSwitch || row.pitch_hand === "L") {
					if (row.pitch_table_l?.length) BATTER_DATA.l[row.player] = row;
				}
				if (isSwitch || row.pitch_hand === "R") {
					if (row.pitch_table_r?.length) BATTER_DATA.r[row.player] = row;
				}
			}

			for (const side of ["l", "r"]) {
				const list = document.querySelector(`#batter-list-${side}`);
				list.innerHTML = "";
				for (const row of Object.values(BATTER_DATA[side])) {
					const item = document.createElement("div");
					item.className = "batter-item";
					item.dataset.player = row.player;
					const hand = row.pitch_hand.replace("B", "S");
					item.innerHTML = `<span>${title(row.player)}</span><span class="hand">${hand}</span>`;
					item.onclick = () => selectBatter(row.player, side);
					list.appendChild(item);
				}
				const keys = Object.keys(BATTER_DATA[side]);
				const restore = SELECTED_BATTER[side] && BATTER_DATA[side][SELECTED_BATTER[side]];
				selectBatter(restore ? SELECTED_BATTER[side] : keys[0], side);
			}
		}

		function selectBatter(player, side, ps) {
			if (!player || !BATTER_DATA[side]?.[player]) return;
			if (ps) SELECTED_PS[side] = ps;
			const pitcherSide = SELECTED_PS[side] || PITCHER_HAND;
			SELECTED_BATTER[side] = player;
			const row = BATTER_DATA[side][player];

			document.querySelectorAll(`#batter-list-${side} .batter-item`).forEach(el => {
				el.classList.toggle("active", el.dataset.player === player);
			});

			const hand = row.pitch_hand.replace("B", "S");
			document.querySelector(`#batter-detail-header-${side}`).innerHTML =
				`${title(player)} <span style="color:#a78bfa;font-weight:400">${hand}</span>`;

			const toggle = document.getElementById(`batter-ps-toggle-${side}`);
			toggle.style.display = "flex";
			toggle.querySelectorAll(".ps-btn").forEach(b => {
				b.classList.toggle("is-active", b.dataset.ps === pitcherSide);
			});

			const tableId = `#batter-detail-table-${side}`;
			try { Tabulator.findTable(tableId)?.[0]?.destroy(); } catch(e) {}
			document.querySelector(tableId).innerHTML = "";

			new Tabulator(tableId, {
				layout: "fitData",
				data: row[`pitch_table_${pitcherSide}`],
				initialSort: [{ column:"n", dir:"desc" }],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					resizable: false,
					headerSortStartingDir: "desc",
				},
				columns: MIX_COLS,
			});
		}

		function logoSrc(code) {
			// assumes logos live at logos/mlb/{team}.png
			return `logos/mlb/${String(code).toLowerCase()}.png`;
		}

		function renderGames(data) {
			const games = document.querySelector("#games");
			games.innerHTML = "";
			for (const game of data) {
				const [a,h] = game.toUpperCase().split(" @ ");
				const al = a.toLowerCase(), hl = h.toLowerCase();
				const div = document.createElement("div");
				div.className = `game-card ${[al,hl].includes(TEAM) ? "popular" : ""}`;
				div.dataset.teams = `${al},${hl}`;
				div.innerHTML = `
				<div class="pair">
					<button class="team-btn" onclick="switchTeam('${al}')">
						<img src="${logoSrc(a)}" alt="${a} logo" />
						<span class="code">${a}</span>
					</button>
					<span class="at">@</span>
					<button class="team-btn" onclick="switchTeam('${hl}')">
						<img src="${logoSrc(h)}" alt="${h} logo" />
						<span class="code">${h}</span>
					</button>
				</div>`;
				games.appendChild(div);
			}
		}

		function renderPitcherTable(data, prefix="") {
			document.querySelector(`#${prefix}pitcher-name`).textContent =`${title(data.player)} (${data.pitch_hand}HP)`;
			for (side of ["l", "r"]) {
				const tableId = `${prefix}pitcher-table-${side}`;
				TABLE = new Tabulator("#"+tableId, {
					tooltipsHeader: true,
					placeholder:"Data Loading...",
					layout: "fitData",
					responsiveLayout: MOBILE ? "" : "",
					autoResize: true,
					data: data[`pitch_table_${side}`],
					initialSort: [
						{ column:"n", dir:"desc" },
					],
					columnDefaults: {
						vertAlign: "middle",
						hozAlign: "center",
						resizable: false,
						headerSortStartingDir: "desc"
					},
					columns: MIX_COLS,
				});
			}
		}

		function groupByGame() {
			if (!TABLE.options.groupBy) {
				TABLE.setGroupBy("game");
			} else {
				TABLE.setGroupBy();
			}
		}

		 const gamesEl = document.querySelector("#games");
		const prev = document.querySelector(".nav.prev");
		const next = document.querySelector(".nav.next");
		const scrollByPx = 320;

		prev.onclick = () => gamesEl.scrollBy({ left: -scrollByPx, behavior: "smooth" });
		next.onclick = () => gamesEl.scrollBy({ left:  scrollByPx, behavior: "smooth" });

		document.querySelectorAll(".batter-ps-toggle").forEach(toggle => {
			toggle.addEventListener("click", e => {
				const btn = e.target.closest(".ps-btn");
				if (!btn) return;
				const side = toggle.dataset.side;
				selectBatter(SELECTED_BATTER[side], side, btn.dataset.ps);
			});
		});

		(function initSplitsToggle(){
			const toggle = document.getElementById('pitcher-splits-toggle');
			const panelL = document.getElementById('panel-l');
			const panelR = document.getElementById('panel-r');

			toggle.addEventListener('click', (e) => {
				const btn = e.target.closest('.toggle-btn');
				if (!btn) return;
				toggle.querySelectorAll('.toggle-btn').forEach(b => {
					b.classList.toggle('is-active', b === btn);
					b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
				});
				const side = btn.dataset.target;
				panelL.classList.toggle('is-hidden', side !== 'l');
				panelR.classList.toggle('is-hidden', side !== 'r');
			});
		})();
	</script>
</body>
</html>
