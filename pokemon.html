<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Pokémon EV</title><link rel="stylesheet" href="pokemon.css?v=card-rates-1">
</head>
<body>
<header><strong>Pokémon EV</strong><span class="local">Private</span><a id="account-link" href="profile">Sign in</a></header>
<main>
  <p id="request-error" class="error" role="alert" hidden></p>
  <section id="access-panel"><p id="access-message">Checking access…</p><a id="access-login" href="profile">Sign in</a></section>
  <div id="workbook" hidden>
    <div class="toolbar">
      <input id="filter-sets" type="search" placeholder="Filter sets" aria-label="Filter tracked sets">
      <label><input id="chase-sets-only" type="checkbox">Favorite sets</label><label>Product <select id="product-basis"><option value="pack">Pack</option><option value="etb">Regular ETB</option><option value="bundle">Booster bundle</option></select></label>
      <label>Values <select id="value-unit"><option value="product">Whole product</option><option value="pack">Per pack</option></select></label>
      <label>Sort <select id="sort"><option value="return_percent">Return %</option><option value="expected_loss_per_pack">Loss / pack (lowest)</option><option value="break_even_buy">Break-even buy $</option><option value="chase_count">Favorites</option><option value="gross_ev">EV</option><option value="net_profit">Net</option><option value="roi">ROI</option></select></label>
      <span class="muted" title="EV counts booster pulls only. Promos and accessories are excluded. Market prices exclude tax/shipping.">Packs only</span>
      <span id="sale-cutoff" class="muted" title="Minimum card market price included in EV. Lower-priced cards contribute $0; their odds stay unchanged. Edit a set to change its cutoff."></span><span id="set-count"></span><span id="sync-status" role="status"></span>
      <span class="muted" title="Provisional values: missing inputs, unreviewed pools, stale prices, or other issues shown in Status.">~ provisional</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <section class="board" aria-label="Set comparison">
      <div class="tablewrap board-scroll"><table class="rankings"><thead><tr><th>#</th><th>Set</th><th>Cards</th><th>Favorites</th><th title="Four rarest pools; + more opens all rates. % avg is average pulls per 100 packs.">Rates / pack</th><th>Pack $</th><th title="Regular retail ETBs only; excludes Pokemon Center, exclusive and premium editions.">ETB $</th><th>Bundle $</th><th title="Cost per pack for the selected product">$/pack</th><th title="Expected sale proceeds after configured fees and costs, divided by purchase price. 100% is break-even.">Return %</th><th id="breakeven-heading" title="Purchase price that gives zero expected net profit after configured selling fees and costs; pack contents only.">Break-even / pack</th><th title="Purchase cost minus expected sale proceeds per pack. Lower is better; negative means expected profit.">Loss / pack</th><th id="ev-heading" title="Expected resale value of cards meeting the sale cutoff, before selling fees and costs.">EV / pack</th><th id="net-heading">Net / pack</th><th>ROI</th><th>Status</th><th></th></tr></thead><tbody id="rankings"></tbody></table></div>
      <details class="add-details"><summary>Add set</summary><form id="add-set" class="addset"><input id="set-search" type="search" placeholder="Filter catalog" aria-label="Filter set catalog"><select id="catalog" aria-label="Set to track"></select><button type="submit">Add</button></form></details>
    </section>
    <section id="editor" class="editor" hidden aria-labelledby="editor-title"></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script><script src="auth.js"></script><script src="pokemon.js?v=card-rates-1"></script>
</body>
</html>
