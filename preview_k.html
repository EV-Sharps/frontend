<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>⚾ Preview K</title>

	<!--
	<script type="text/javascript" src="test.js"></script>
	-->

	<script type="text/javascript" src="tabulator.min.js"></script>
	<script type="text/javascript" src="peity-vanilla.min.js"></script>
	<script type="text/javascript" src="flatpickr.min.js"></script>
	<link href="tabulator.min.css" rel="stylesheet">
	<link href="flatpickr.min.css" rel="stylesheet">
	<script src="plotly-3.0.0.min.js" charset="utf-8"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<link href="style.css" rel="stylesheet">
	<style>
		#table {
			width: auto;
		}
		.k-odds-cell {
			display: flex;
			flex-direction: column;
			gap: 2px;
			align-items: flex-start;
			padding: 2px 0;
		}
		.k-odds-chip {
			display: flex;
			gap: 4px;
			align-items: center;
			font-size: 11px;
			line-height: 1.2;
		}
		.k-side {
			color: #6b7280;
			font-size: 10px;
			width: 10px;
		}
		.k-val { font-weight: 600; }
		.k-odds-chip.positive .k-val { color: #4ade80; }
		.k-odds-chip.negative .k-val { color: #f87171; }
		.k-fv { font-size: 10px; color: #6b7280; margin-top: 1px; }
		@media (max-width: 600px) {
			#table { flex: 1; }
		}
	</style>
</head>

<body>
	<div id="app">
		<header id="header">
			<div id="title">
				<h1>+EV Sharps</h1>
			</div>
			<div id="view-toggle-container">
				<div class="select-wrapper">
					<label for="view-select" class="select-label">View</label>
					<select id="view-select">
						<option value="table" selected>Table</option>
						<option value="mobile">Mobile</option>
					</select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
			</div>
			<div id="center-dropdown">
				<div class="select-wrapper">
					<label for="page-select" class="select-label">Page</label>
					<select id="page-select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
				<button onclick="downloadCSV()">💾 CSV</button>
			</div>
			<div id="auth-buttons">
				<button class="discord-login loggedOut" onclick="loginWithDiscord()">
					<img src="/logos/discord.png" alt="Discord logo">
					<span class="btn-text">Sign in with Discord</span>
				</button>
				<button class="gsi-material-button loggedOut" onclick="loginWithGoogle()">
				  <div class="gsi-material-button-state"></div>
				  <div class="gsi-material-button-content-wrapper">
				    <div class="gsi-material-button-icon">
				      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
				        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
				        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
				        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
				        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
				        <path fill="none" d="M0 0h48v48H0z"></path>
				      </svg>
				    </div>
				    <span style="display: none;">Sign in with Google</span>
				  </div>
				</button>

				<span id="username" class="username loggedIn"></span>
				<button id="pricing" class="loggedOut" onclick="changePage('pricing')">Pricing</button>
				<button id="hide-username" onclick="hideUsername()">Hide</button>
				<button id="account" class="loggedIn" onclick="changePage('profile')">Profile</button>
				<button id="upgrade" class="loggedIn" onclick="changePage('pricing')">Upgrade 🎯</button>
				<button id="logout" class="loggedIn" onclick="logout()">Logout</button>
			</div>
		</header>
		<main>
			<div id="table-container">
				<div id="table"></div>
				<div id="watermark">
					<img src="logos/logo.png">
				</div>
			</div>
		</main>
		<footer class="site-footer">
			<p>All content is for entertainment purposes only. +EV Sharps is not affiliated with MLB. <a href="/disclaimer">Read Full Terms</a></p>
		</footer>
	</div>
	<script type="text/javascript" src="shared.js"></script>
	<script src="auth.js"></script>
	<script type="text/javascript">
		PAGE = "preview_k";

		parseURLParams();
		SPORT = "mlb";

		if (MARK != undefined) {
			document.querySelector("#watermark").style.display = "initial";
			document.querySelector("#table-container").style["max-height"] = "initial";
			document.querySelector("#watermark").style.width = "15%";
		}

		if (PRETTY != undefined) {
			document.querySelector("html").style.overflow = "initial";
			document.querySelector("body").style.overflow = "initial";
			document.querySelector("main").style.overflow = "initial";
			document.querySelector("#table-container").style.overflow = "initial";
		}

		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		function fetchPreviewData() {
			let s = SPORT;
			renderTable([]);
			fetch(API_BASE+`/api/preview?sport=${s}&k=true`, {
				headers: { "Accept": "application/vnd.github.v3.raw" }
			}).then(response => response.json()).then(data => {
				data = data.data;
				RES = data;
				renderTable(data);
				setTimeout(function() {
					if (PRETTY != undefined) {
						pretty_();
					}
				}, 200);
			}).catch(err => console.log(err));
		}

		function kOddsFormatter(cell) {
			const data = cell.getRow().getData();
			const handicap = data.mainLine;
			const entry = data.kOdds?.[handicap];
			if (!entry) return "";

			const overOdds = (entry.bestOdds || "");
			const fmt = (odds, label) => {
				if (!odds || odds === "0") return "";
				const num = parseInt(odds);
				const cls = num >= 0 ? "positive" : "";
				const display = num > 0 ? `+${num}` : `${num}`;
				return `<div class="k-odds-chip ${cls}"><span class="k-side">${label}</span><span class="k-val">${display}</span></div>`;
			};

			return `<div class="k-odds-cell">o${data.mainLine} FV=${entry.fairVal}</div>`;
		}

		function renderTable(data) {
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
    			placeholder:"Data Loading...",
				layout: "fitDataFill",
				responsiveLayout: MOBILE ? "" : "",
				autoResize: true,
				data: data,
				initialSort: [
					{column: "k_per_game", dir: "desc"},
				],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					//resizable: false,
					headerSortStartingDir: "desc"
				},
				//groupBy: "game",
				groupHeader: function(value, count, data, group){
					return `<span style='color: #c8c3bc'>${value.toUpperCase()}</span>`;
				},
				groupToggleElement: "header",
				columns: [
					{
						title: "Player",
						field: "player",
						headerFilter: "input",
						formatter: playerFormatter,
						width: MOBILE ? 100 : 140,
						formatterParams:{ sport: SPORT, noProp: true, fullName: true },
						hozAlign: "left",
						frozen: MOBILE ? true : false
					},
					{title: "Opp", field: "opp", formatter: oppFormatter, formatterParams: {is_pitcher: true}, hozAlign: "left", width: 80},
					{title: "K Props", columns: [
						{title: "Line", field: "mainLine", width: 55, sorter: "number"},
						{title: "Fair Val", field: "mainLine", width: 65, formatter: function(cell) {
							const data = cell.getRow().getData();
							const fv = data.kOdds?.[data.mainLine]?.fairVal;
							if (!fv) return "";
							return `${fv}`;
						}},
					]},
					{title: "IP", field: "p_formatted_ip", width: 45, sorter: "number"},
					{title: "K", columns: [
						{title: "Total", field: "p_strikeout", width: 50, sorter: "number"},
						{title: "K/G", field: "k_per_game", width: 50, sorter: "number", formatter: percentileFormatter},
						{title: "K/IP", field: "k_per_ip", width: 50, sorter: "number"},
					]},
					{title: "Rate Stats", columns: [
						{title: "K%", field: "k_percent", width: 52, sorter: "number", formatter: percentileFormatter},
						{title: "Whiff%", field: "whiff_percent", width: 58, sorter: "number", formatter: percentileFormatter},
						{title: "F-Strike%", field: "f_strike_percent", width: 65, sorter: "number", formatter: percentileFormatter},
						{title: "SwStr%", field: "p_swinging_strike", width: 58, sorter: "number", formatter: percentileFormatter},
						{title: "Z-Swing<br>Miss%", field: "z_swing_miss_percent", width: 60, sorter: "number", formatter: percentileFormatter},
						{title: "Swing%", field: "swing_percent", width: 58, sorter: "number", formatter: percentileFormatter},
					]}
				]
			});
		}

		function groupByGame() {
			if (!TABLE.options.groupBy) {
				TABLE.setGroupBy("game");
			} else {
				TABLE.setGroupBy();
			}
		}
	</script>
	<script>handleSession();</script>
</body>
</html>
