<body>
	<div id="app">
		<header id="header">

						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>

				</div>
			</div>
			<div id="center-dropdown">
				<div class="select-wrapper">
					<label for="page-select" class="select-label">Page</label>
					<select id="page-select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>

				        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
				        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
				        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>

				      </svg>

				<span id="username" class="username loggedIn"></span>
				<button id="pricing" class="loggedOut" onclick="changePage('pricing')">Pricing</button>
				<button id="hide-username" onclick="hideUsername()">Hide</button>

		</header>
		<main>
			<div style="padding:0.25rem 0.5rem;font-size:0.75rem;color:#6b7280;text-align:center;">Stadium HR Rank: 🟢 1 = most HR-friendly &nbsp;🔴 30 = least HR-friendly</div>

			<div id="table-container">
				<div id="table"></div>
				<div id="watermark">
					<img src="logos/logo.png">
				</div>
			</div>
		</main>
		<footer class="site-footer">
			<p>All content is for entertainment purposes only. +EV Sharps is not affiliated with MLB. <a href="/disclaimer">Read Full Terms</a></p>
		</footer>
	</div>
	<script type="text/javascript" src="shared.js"></script>
	<script src="auth.js"></script>
	<script type="text/javascript">
		PAGE = "ranks";

		parseURLParams();
		SPORT = "mlb";

		if (MARK != undefined) {
			document.querySelector("#watermark").style.display = "initial";
			document.querySelector("#table-container").style["max-height"] = "initial";
			document.querySelector("#watermark").style.width = "15%";
		}

		if (PRETTY != undefined) {
			document.querySelector("html").style.overflow = "initial";
			document.querySelector("body").style.overflow = "initial";
			document.querySelector("main").style.overflow = "initial";
			document.querySelector("#table-container").style.overflow = "initial";
		}

		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		handleSession();

		// Build flat game rows from per-pitcher preview data
		function buildGameRows(data) {
			const map = {};
			data.forEach(row => {
				const g = row.game;
				if (!g) return;
				if (!map[g]) {
					// Parse home team from "AWAY @ HOME ..." format
					const atIdx = g.indexOf(" @ ");
					const homeTeam = atIdx >= 0 ? g.slice(atIdx + 3).trim().split(/\s+/)[0] : null;
					map[g] = {
						game: g,
						homeTeam,
						away: null,
						home: null,
						stadiumRank: row.stadiumRank,
						stadiumRankLeft: row.stadiumRankLeft,
						stadiumRankRight: row.stadiumRankRight,
						bpp: row.bpp,
						weather: row.weather,
					};
				}
				// Determine side by matching pitcher's team against parsed home team
				const isHome = map[g].homeTeam && row.team === map[g].homeTeam;
				if (isHome) {
					map[g].home = row;
				} else {
					map[g].away = row;
				}
			});
			// Flatten to sortable fields
			// percs copied as away_percs / home_percs so allowedFormatter can read
			// via field "away_percs.home_run" → data.away_percs.home_run
			return Object.values(map).map(g => {
				const row = {
					game: g.game,
					stadiumRank: g.stadiumRank,
					stadiumRankLeft: g.stadiumRankLeft,
					stadiumRankRight: g.stadiumRankRight,
					bpp: g.bpp,
					weather: g.weather,
					away_player: title(g.away?.player) ?? null,
					away_pitch_hand: g.away?.pitch_hand ?? null,
					away_team: g.away?.team ?? null,
					away_era: g.away?.p_era ?? null,
					away_hr_l: g.away?.hr_pitch_l ?? null,
					away_hr_r: g.away?.hr_pitch_r ?? null,
					home_player: title(g.home?.player) ?? null,
					home_pitch_hand: g.home?.pitch_hand ?? null,
					home_team: g.home?.team ?? null,
					home_era: g.home?.p_era ?? null,
					home_hr_l: g.home?.hr_pitch_l ?? null,
					home_hr_r: g.home?.hr_pitch_r ?? null,
				};
				if (g.away?.percs) row.away_percs = g.away.percs;
				if (g.home?.percs) row.home_percs = g.home.percs;
				return row;
			});
		}

		function fetchPreviewData() {
			renderTable([]);
			fetch(API_BASE+`/api/preview?sport=${SPORT}`, {
				headers: { "Accept": "application/vnd.github.v3.raw" }
			}).then(r => r.json()).then(data => {
				data = data.data;
				RES = data;
				renderTable(buildGameRows(data));
				if (PRETTY != undefined) setTimeout(pretty_, 200);
			}).catch(err => console.log(err));
		}

		// Stadium rank: 1 = most HR-friendly (green), 30 = least (red)
		function rankFormatter(cell) {
			const v = cell.getValue();
			if (v == null || v === "") return "";
			const n = parseInt(v);
			if (!isFinite(n)) return v;
			// color: rank 1-10 green, 11-20 neutral, 21-30 red
			let color;
			if (n <= 10) color = `hsl(${Math.round(120 - (n-1)*6)}, 65%, 45%)`;       // green shades
			else if (n <= 20) color = "#9ca3af";                                         // gray
			else color = `hsl(${Math.round(20 - (n-21)*2)}, 65%, 48%)`;                // red shades
			return `<span style="font-weight:600;color:${color}">${n}</span>`;
		}

		function pitcherCellFormatter(cell, playerField, eraField) {
			const row = cell.getRow().getData();
			const name = row[playerField];
			if (!name) return `<span style="color:#4b5563">—</span>`;
			return `
			<div class="player-cell">
				<span style="font-weight:500">${name}</span>
				<div class="bats">${row[eraField] || ""}</div>
			</div>
			`;
		}

function hrHistFormatter(cell, lField, rField) {
			const row = cell.getRow().getData();
			const l = row[lField]?.slice(-5) ?? [];
			const r = row[rField]?.slice(-5) ?? [];
			if (!l.length && !r.length) return "";
			return `<span style="font-size:0.72rem;color:#d1d5db">L:${l.join(",")} R:${r.join(",")}</span>`;
		}

		function renderTable(data) {
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
				placeholder: "Data Loading...",
				layout: "fitDataFill",
				autoResize: true,
				data: data,
				initialSort: [{column: "stadiumRank", dir: "asc"}],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					headerSortStartingDir: "asc",
				},
				columns: [
					{
						title: "Game", field: "game",
						hozAlign: "left", width: MOBILE ? 110 : 160,
						headerFilter: "input",
						formatter: gameFormatter,
						formatterParams: {text: true}
					},
					{
						title: "Stadium HR Ranks", columns: [
							{title: "Total", field: "stadiumRank", sorter: "number", width: 50, formatter: function(cell) {
								const v = cell.getValue(); if (v == null || v === "") return "";
								return `<span style="color:${getOppRankColor(v)}">${v}</span>`;
							}},
							{title: "LHB", field: "stadiumRankLeft", sorter: "number", width: 50, formatter: function(cell) {
								const v = cell.getValue(); if (v == null || v === "") return "";
								return `<span style="color:${getOppRankColor(v)}">${v}</span>`;
							}},
							{title: "RHB", field: "stadiumRankRight", sorter: "number", width: 50, formatter: function(cell) {
								const v = cell.getValue(); if (v == null || v === "") return "";
								return `<span style="color:${getOppRankColor(v)}">${v}</span>`;
							}},
						]
					},
					{
						title: "Weather", field: "weather",
						formatter: windFormatter, hozAlign: "left",
					},
					{
						title: "<a href='https://www.x.com/BallparkPal' target='new' onclick='event.stopPropagation()'>@BPP</a><br>Factor",
						field: "bpp", width: 55, sorter: "number",
						formatter: bppFormatter,
					},
					{
						title: "Away Pitcher", field: "away_player",
						hozAlign: "left", width: 120,
						formatter: function(cell) { return pitcherCellFormatter(cell, "away_player", "away_pitch_hand"); }
					},
					{title: "Away HR Allowed", columns: [
						{title: "Total", field: "away_percs.home_run", width: 55, sorter: "number", formatter: allowedFormatter},
						{title: "HR/PA%", field: "away_percs.hr_pa", width: 65, sorter: "number", formatter: allowedFormatter},
					]},
					{
						title: "Away<br>HR History", field: "away_hr_l",
						width: 130, hozAlign: "left",
						formatter: function(cell) { return hrHistFormatter(cell, "away_hr_l", "away_hr_r"); },
						headerSort: false,
						visible: false
					},
					{
						title: "Home Pitcher", field: "home_player",
						hozAlign: "left", width: MOBILE ? 100 : 150,
						formatter: function(cell) { return pitcherCellFormatter(cell, "home_player", "home_pitch_hand"); }
					},
					{title: "Home HR Allowed", columns: [
						{title: "Total", field: "home_percs.home_run", width: 55, sorter: "number", formatter: allowedFormatter},
						{title: "HR/PA%", field: "home_percs.hr_pa", width: 65, sorter: "number", formatter: allowedFormatter},
					]},
					{
						title: "Home<br>HR History", field: "home_hr_l",
						width: 130, hozAlign: "left",
						formatter: function(cell) { return hrHistFormatter(cell, "home_hr_l", "home_hr_r"); },
						headerSort: false,
						visible: false,
					},
					
				]
			});
		}
	</script>
</body>
