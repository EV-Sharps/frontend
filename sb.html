	<script type="text/javascript">
		PAGE = "sb";
		let TABLE, EV_COL, FV_COL, RES;
		let url = "";
		const windowURL = new URL(window.location.href);
		const URLParams = new URLSearchParams(windowURL.search);
		let SPORT = "mlb";
		let KAMBI = URLParams.get("kambi");
		let MARK = URLParams.get("mark");
		let BPP = URLParams.get("bpp") != undefined;
		let PH = URLParams.get("ph") != undefined;
		let SIMPLE = URLParams.get("simple");
		let PLAYER = URLParams.get("player");
		let REFRESH = URLParams.get("refresh") || "off";
		REFRESH = "auto";
		let BOOK = URLParams.get("book");
		let HISTORICAL = URLParams.get("historical");
		let PRETTY = URLParams.get("pretty");
		let IMP = URLParams.get("imp");
		let GAME = URLParams.get("game");
		TEAM = URLParams.get("team");
		let DATE = URLParams.get("date");
		let NOCACHE = URLParams.get("nocache");
		let NO365 = URLParams.get("no365");
		let BOOST = URLParams.get("boost");
		let DEVIG = URLParams.get("devig");

		if (GAME) {
			let [a,h] = GAME.split("-");
			GAME = `${a} @ ${h}`;
		}

		handleSession();

		if (MARK != undefined) {
			document.querySelector("#watermark").style.display = "initial";
			if (PRETTY != undefined || IMP !== undefined) {
				document.querySelector("#watermark").style.width = "20%";
			}
		}

		document.querySelector("#btwn-select").value = "pa";
		document.querySelector("#btwn-select").addEventListener("change", function(event) {
			if (event.target.value == "g") {
				plotHRGap(showGames=true);
			} else if (event.target.value == "feed") {
				renderFeed();
			} else {
				plotHRGap();
			}
		});

		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		async function fetchSBData(render=true) {
			let url = "/api/ev";
			const params = new URLSearchParams();
			params.set("sb", "true");
			if (NOCACHE != undefined) {
				params.set("nocache", "true");
			}
			if (params.toString()) {
				url += "?"+params.toString();
			}
			fetch(API_BASE+url, {
				headers: {
					Authorization: `Bearer ${ACCESS_TOKEN}`
				}
			}).then(res => res.json()).then(res => {
				UPDATED[PAGE] = res.data["updated"];
				RES = res.data;
				const gameSel = document.getElementById("game-select");
				RES.games.forEach(game => {
					const option = document.createElement("option");
					option.value = game.replace(" @ ", "-");
					option.textContent = game.toUpperCase();
					gameSel.appendChild(option);
				});

				setTimeout(function() {
					updateTimes();
					changeFilter();
				}, 500)
			}).catch(err => console.log(err));
		}

		function updateTimes() {
			updateHeaders();
		}

		function updateHeaders() {
			for (book in UPDATED[PAGE]) {
				if (!TABLE.getColumn(`bookOdds.${book}`)) {
					continue;
				}
				let el = TABLE.getColumn(`bookOdds.${book}`).getElement();
				el.querySelector(".tabulator-col-title").innerHTML = `${book.toUpperCase()}<img class='book-img' src='logos/${book}.png' alt='${book}' title='${book}' style='height:12px;width:12px;' /><br>${timeAgo(UPDATED[PAGE][book], short=true)}`;
			}
		}

		function hideCols() {
			if (SPORT == "mlb" || SPORT.includes("futures")) {
				const cols = ["totalSplits", "totalOver", "total10Over"];
				cols.forEach(col => TABLE.hideColumn(col));
			}

			if (SPORT == "mlbfutures") {
				TABLE.showColumn("bookOdds.bv");
			}
		}

		function changeFilter() {
			let devigBook = document.getElementById("devig-select").value;
			let boost = document.getElementById("boost-select").value;
			let game = document.getElementById("game-select").value;
			let book = document.getElementById("book-select").value;
			let excluded = [];
			if (boost === "custom") {
				boost = boostCustom.value;
			}
			BOOK = book;
			let url = new URL(window.location.href);

			const params = new URLSearchParams(window.location.search);
			params.set("boost", boost);
			params.set("devig", devigBook);
			params.set("game", game);
			params.set("book", book);

			RES.data.forEach(row => {
				const bookOdds = { ...row.bookOdds };
				let avg = getAverageImplied(bookOdds, row.under);
				if (!avg) {
					return;
				}
				const ex = excluded;
				ex.push("pn"); ex.push("circa");
				if (devigBook) {
					ex.push(devigBook);
				}
				const highest = highestOver(bookOdds, ex, boost, book, row.under);
				let ou = avg.avgAmerican.toString();
				if (row.under) {
				    // If under, swap priority
				    if (devigBook) {
				        // Use the book's under odds if available
				        const val = bookOdds[devigBook];
				        ou = val && String(val).includes("/") ? String(val).split("/")[1] : val;
				    } else if (devigBook === "pn+circa") {
				        // Fallback to averageSharps for unders if combining books
				        ou = averageSharps(bookOdds, true); // pass true for under-side avg if supported
				    }
				} else {
				    // Normal over-first logic
				    if (devigBook === "pn+circa") {
				        ou = averageSharps(bookOdds);
				    } else if (devigBook) {
				        ou = bookOdds[devigBook];
				    }
				}
				if (!ou) {
					row["ev"] = "";
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}

				let d = devig(ou, highest.value, boost);
				if (!d) {
					row["ev"] = "";
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}
				row["book"] = highest.book;
				row["line"] = highest.value;
				row["ev"] = d.ev;
				row["fairVal"] = d.fairVal;
				row["implied"] = d.implied;
				row["kelly"] = d.kelly;
			});
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			//TABLE.setData(RES.data);
			TABLE.setSort([
				{column: "ev", dir: "desc"}
			]);
			const filters = [];
			TABLE.clearFilter();
			if (game) {
				filters.push({field:"game", type:"=", value: game.replace("-", " @ ")});
			}
			if (filters.length > 0) {
				TABLE.setFilter(filters);
			}
			TABLE.setData(RES.data);
			//TABLE.redraw(true);
		}

		const boostSel = document.getElementById('boost-select');
		const boostCustom = document.getElementById('boost-custom');

		boostSel.value = BOOST || 0;
		if (BOOST == "custom") {
			boostCustom.style.display = "";
		}
		boostSel.addEventListener("change", (event) => {
			boostCustom.style.display = (event.target.value === "custom") ? '' : 'none';
			changeFilter();
		});

		boostCustom.addEventListener("input", () => {
			changeFilter();
		});

		document.querySelector("#devig-select").value = DEVIG || "";
		document.querySelector("#devig-select").addEventListener("change", (event) => {
			changeFilter();
		});

		if (GAME) {
			document.querySelector("#game-select").value = GAME.replace(" @ ", "-") || "";
		} else {
			document.querySelector("#game-select").value = "";
		}
		document.querySelector("#game-select").addEventListener("change", (event) => {
			GAME = event.target.value;
			const params = new URLSearchParams(window.location.search);
			params.set("game", GAME);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			TABLE.clearFilter();
			changeFilter();
		});

		document.querySelector("#book-select").value = BOOK || "";
		document.querySelector("#book-select").addEventListener("change", (event) => {
			BOOK = event.target.value;
			changeFilter();
		});

		function renderTable(data) {
			//data = data.filter(r => ["cal raleigh", "kyle schwarber"].includes(r.player));

			data.sort((a,b) => {
				return parseFloat(b.ev) || 0 - parseFloat(a.ev) || 0;
			});
			let first = [...data];
			first.sort((a,b) => {
				return parseInt(a.startSortable) - parseInt(b.startSortable);
			});
			const idx = data.findIndex(item => parseFloat(item.ev) < 0);
			if (idx != -1) {
				//data.splice(idx, 0, {prop: "separator", ev: ""});
			}
			let props = [...new Set(data.map(row => row.prop.toUpperCase()))];
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
    		placeholder:"Data Loading...",
				layout: "fitDataFill",
				responsiveLayout: MOBILE ? "" : "",
				autoResize: true,
				data: data,
				initialSort: [
					{column: "curr_ev", dir: "desc"},
				],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					resizable: false,
					headerSortStartingDir: "desc"
				},
				groupHeader: function(value, count, data, group){
					return `<span style='color: #c8c3bc'>${value.toUpperCase()} (${data[0].start})</span>`;
				},
				groupToggleElement: "header",
				groupBy: "",
				groupStartOpen: function (value) {
					return value == first[0].game;
				},
				columns: [
					//{title: "Confirmed", field: "confirmed", formatter:"tickCross", width: 30, hozAlign: "center"},
					{
						title: "Expected<br>Value",
						field: "ev",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: evMutFormatter,
						responsive: 0
					},
					{
						title: "Fair<br>Value",
						field: "fairVal",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: plusMinusFormatter,
						responsive: 0
					},
					{
						title: "Implied",
						field: "implied",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: impliedFormatter,
						responsive: 0,
						visible: MOBILE ? false : true
					},
					{
						title: "¼ Kelly",
						field: "kelly",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: function(cell) {
							if (!cell.getValue()) {
								return "";
							}
							return `${cell.getValue().toFixed(2)}u`;
						},
						responsive: 0,
						visible: MOBILE ? false : true
					},
					{
						title: "Player",
						field: "player",
						headerFilter: "input",
						formatter: playerFormatter,
						width: MOBILE ? 90 : 140,
						formatterParams:{
							sport: SPORT,
							noProp: true
						},
						hozAlign: "left",
						responsive: 0,
						frozen: MOBILE ? true : false
					},
					{
						title: "Best Book", field: "book",
						vertAlign:"bottom", width: MOBILE ? 65 : 70,
						formatter: evBookFormatter,
						formatterParams:{book:BOOK},
						responsive: 0
					},
					{title: "BPP", field: "bppProj", visible: BPP ? true : false, width: 50, sorter: "number", formatter: percentFormatter},
					{title: "Diff", field: "bppDiff", visible: BPP ? true : false, width: 60, sorter: "number", formatter: percentFormatter},
					{title: `FD<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["fd"], short=true)}`, field: "bookOdds.fd",  width: MOBILE ? 60 : 60, sorter: "number"},
					{title: `Circa`, field: "bookOdds.circa",  width: 70, sorter: "number", visible: MOBILE ? true : false},
					{title: `PN<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["pn"], short=true)}`, field: "bookOdds.pn",  width: 70, sorter: "number", visible: MOBILE ? true : false},
					{title: `B365<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["b365"], short=true)}`, field: "bookOdds.b365", hozAlign: "center", width: 80, sorter: "number", visible: NO365 == undefined ? true : false},
					{title: `DK<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["dk"], short=true)}`, field: "bookOdds.dk",  width: 80, sorter: "number", responsive: 6, visible: HISTORICAL ? false : true},
					{title: `MGM<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["mgm"], short=true)}`, field: "bookOdds.mgm",  width: 75, sorter: "number", visible: HISTORICAL ? false : true},
					{title: `PARX*<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["kambi"], short=true)}`, field: "bookOdds.kambi",  width: 70, sorter: "number"},
					{title: `CZ<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["cz"], short=true)}`, field: "bookOdds.cz",  width: 70, sorter: "number"},
					{title: `PN<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["pn"], short=true)}`, field: "bookOdds.pn",  width: 70, sorter: "number", visible: MOBILE ? false : true},
					{title: `Circa<br>${timeAgo(UPDATED ? 0 : UPDATED["dingers"]["circa"], short=true)}`, field: "bookOdds.circa", hozAlign: "center", width: 70, sorter: "number", formatter: blurCircaFormatter},
					//{title: "Kambi*", field: "bookOdds.kambi",  width: 70, sorter: "number"},
					//{title: "Bats", field: "bats", width: 40, formatter: blurFormatter},
					{title: "Bat<br>Order", field: "order",  width: MOBILE ? 20 : 40, sorter: "number", formatter: blurFormatter},
					
					{title: "Pinch Hits", field: "ph", visible: PH ? true : false},
					{title: "Pitcher", field: "pitcherCols", columns: [
						{title: "Name", field: "pitcher", width: 90, formatter: pitcherFormatter},
						{title: "HR/PA %", field: "percs.hr_pa", width: 60, formatter: allowedFormatter},
						{title: "Homers", field: "percs.home_run", width: 60, formatter: allowedFormatter},
						{title: "Vs Pitcher", field: "bvp", hozAlign: "left", formatter: bvpFormatter, width: 75},
					]},
					{title: "BPP<br>HR", field: "bpp", width: 45, formatter: bppFormatter},
					{title: "Batter Metrics", columns: [
						{title: "xBA", field: "savant.est_ba", width: 45, formatter: baFormatter, visible: false },
						{title: "xwOBA", field: "savant.est_woba", width: 45, formatter: xwobaFormatter, visible: false },
						{title: "SwSp%", field: "savant.sweet_spot_percent", width: 45, formatter: percentileFormatter, visible: false },
						{title: "EVelo", field: "savant.exit_velocity_avg", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : true },
						{title: "HH%", field: "savant.hard_hit_percent", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : false },
						{title: "BRL%", field: "savant.barrels_per_bip", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : true },
					]},
					{title: "Pitcher Metrics", columns: [
						{title: "ERA", field: "pitcherData.p_era", width: 45, formatter: eraFormatter, visible: false },
						{title: "xBA", field: "pitcherData.xba", width: 45, formatter: baFormatter, visible: false },
						{title: "xwOBA", field: "pitcherData.xwoba", width: 45, formatter: xwobaFormatter, visible: false },
						{title: "Fly%", field: "pitcherData.flyballs_percent", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : true },
						{title: "SwSp%", field: "pitcherData.sweet_spot_percent", width: 45, formatter: percentileFormatter, visible: false },
						{title: "EVelo", field: "pitcherData.exit_velocity_avg", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : true },
						{title: "HH%", field: "pitcherData.hard_hit_percent", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : false },
						{title: "BRL%", field: "pitcherData.barrel_batted_rate", width: 45, formatter: percentileFormatter, visible: HISTORICAL ? false : true },

					{title: "Opp<br>Rank", field: "oppRank", formatter: rankingFormatter, width: 50, visible: HISTORICAL ? false : true},
					{title: "Stadium<br>Rank", field: "stadiumRank", formatter: stadiumRankFormatter, width: 60, visible: HISTORICAL ? false : true},
					{title: "Last Homer (Due)", columns: [
						//{title: "Gms", field: "homerLogs.last", width: 40, formatter: gapFormatter},
						{title: "PA", field: "homerLogs.pa.streak", width: 40, formatter: homerLogFormatter},
						{title: "Med", field: "homerLogs.pa.med", width: 40, formatter: homerLogFormatter},
						{title: "Z", field: "homerLogs.pa.z_median", width: 40, formatter: homerLogFormatter, sorter: "number"},
						{title: "Avg", field: "homerLogs.pa.avg", width: 40, formatter: homerLogFormatter, visible: false},
						{title: "Z", field: "homerLogs.pa.z", width: 40, formatter: homerLogFormatter, sorter: "number", visible: false},
					]},
					{title: "Weather", field: "weather", formatter: windFormatter, hozAlign: "left"},
					{title: "Game", field: "game", visible: false},
					{title: "Start", field: "startSortable", visible: false, sorter: "number"},
					{title: "FD Z", field: "analysis.fd_z_score", width: 45, sorter: "number", visible: HISTORICAL ? false : true},
					//{title: "Last HR", field: "lastHR"},
				]
			});

			TABLE.on("rowClick", function(e, row) {
				rowClick(row);
			});

			TABLE.on("dataLoaded", function(data) {
				//showHideUserTable()
			});
		}

		function rowClick(row) {
			const data = row.getData();
			const right = document.querySelector("#right-body");
			const left = document.querySelector("#table-container");
			const table = document.querySelector("#table");
			const tableContainer = document.querySelector("#table-container");
			const sel = TABLE.getSelectedRows();
			TABLE.deselectRow();
			if (sel.length > 0 && sel[0] == row) {
				right.style.display = "none";
				left.style.width = "100%";
				table.style.width = "100%";
				setTimeout(() => {
					table.style.width = "100%";
					tableContainer.style.width = "100%";
				}, 40);
			} else {
				row.select();
				left.style.width = MOBILE ? "100%" : "50%";
				right.style.display = "flex";
				table.style.width = "100%";
				tableContainer.style.width = "100%";
				document.querySelector("#btwn-select").value = "pa";
				plotHRGap();
			}
		}

		function groupByTop() {
			if (TABLE.options.groupBy === undefined || TABLE.options.groupBy == "game") {
				TABLE.setGroupBy("game");
				const groups = TABLE.getGroups();
				groups.forEach(group => {
					group.getRows().slice(3).forEach(row => {
						row.getElement().style.display = "none";
					});
				});
				TABLE.redraw();
			} else {
				TABLE.setGroupBy();
				TABLE.getRows().forEach(r => r.getElement().style.display = "");
			}
		}

		function groupByGame() {
			if (!TABLE.options.groupBy) {
				TABLE.setSort([
					{column: "curr_ev", dir: "desc"},
					{column: "startSortable", dir: "asc"},
				]);
				TABLE.setGroupBy("game");
			} else {
				TABLE.setGroupBy("");
				TABLE.setSort([
					{column: "curr_ev", dir: "desc"},
				]);
			}
		}

		function implied() {
			TABLE.getColumns().map(c => {
				c.hide()
			});
			["curr_ev", "curr_fv", "curr_implied", "curr_kelly", "player", "pitcher", "percs.hr_pa", "book", "bookOdds.circa",  "bpp", "homerLogs.pa.streak", "homerLogs.pa.med", "homerLogs.pa.z_median"].forEach(c => TABLE.showColumn(c));
			document.querySelector("#table").style.width = "max-content";
			TABLE.setSort([
				{column: "curr_implied", dir: "desc"}
			]);

			const rows = TABLE.getData("active");
			const tweet = [];

			let currentRank = 1;
			for (let i = 0; i < rows.length; i++) {
				const row = rows[i];
				const prev = rows[i - 1];

				// If not first, and impliedMut differs from previous, increment rank
				if (i > 0 && row["curr_implied"] !== prev["curr_implied"]) {
					currentRank++;
				}

				tweet.push(`${currentRank}. ${title(row.player)} - ${row["curr_implied"]}%`);
			}
			console.log(tweet.join("\n"));
		}

		function pretty_() {
			TABLE.getColumns().map(c => {
				c.hide()
			});
			[`curr_ev`, "curr_fv", "curr_implied", "curr_kelly", "player", "pitcher", "percs.hr_pa", "bvs", "book", "bookOdds.circa", "homerLogs.pa.streak", "homerLogs.pa.med", "homerLogs.pa.z_median"].forEach(c => TABLE.showColumn(c));
			document.querySelector("#table").style.width = "max-content";
		}

		window.addEventListener('popstate', (event) => {
			const book = event.state?.book || new URLSearchParams(location.search).get('book') || '';
			BOOK = book;
			RES.forEach(row => {
				row["curr_ev"] = row[`${BOOK ? `${BOOK}_` : ""}ev`]
				row["curr_fv"] = row[`${BOOK ? `${BOOK}_` : ""}fairVal`]
				row["curr_kelly"] = row[`${BOOK ? `${BOOK}_` : ""}kelly`]
				row["curr_implied"] = row[`${BOOK ? `${BOOK}_` : ""}implied`]
			});
			TABLE.updateData(RES);
			TABLE.setSort([
				{column: "curr_ev", dir: "desc"}
			]);
			TABLE.redraw(true);
		});
	</script>
</body>
</html>
