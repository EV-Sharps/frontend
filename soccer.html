	<script type="text/javascript" src="shared.js"></script>
	<script src="auth.js"></script>
	<script type="text/javascript">
		PAGE = "soccer";
		let TABLE, EV_COL, FV_COL, RES;
		let url = "";
		const windowURL = new URL(window.location.href);
		const URLParams = new URLSearchParams(windowURL.search);
		let SPORT = "soccer";
		let KAMBI = URLParams.get("kambi");
		let MARK = URLParams.get("mark");
		let BPP = URLParams.get("bpp") != undefined;
		let PH = URLParams.get("ph") != undefined;
		let SIMPLE = URLParams.get("simple");
		let PLAYER = URLParams.get("player");
		let REFRESH = URLParams.get("refresh") || "off";
		REFRESH = "auto";
		let BOOK = URLParams.get("book");
		let HISTORICAL = URLParams.get("historical");
		let PRETTY = URLParams.get("pretty");
		let IMP = URLParams.get("imp");
		let GAME = URLParams.get("game") || "";
		TEAM = URLParams.get("team");
		let DATE = URLParams.get("date");
		let NOCACHE = URLParams.get("nocache");
		let BOOST = URLParams.get("boost");
		let DEVIG = URLParams.get("devig");
		let PROP = URLParams.get("prop") || "";

		if (GAME) {
			GAME = GAME.replaceAll("-gm2", "_gm2");
			let [a,h] = GAME.split("-");
			GAME = `${a} @ ${h}`;
			GAME = GAME.replaceAll("_gm2", "-gm2");
		}

		handleSession();

		const dd = document.getElementById('exclude-dd');
		const excludeBtn = dd.querySelector('.chkdd-btn');
		let menu = dd.querySelector('.chkdd-menu');
		const boxes = [...dd.querySelectorAll('input[type="checkbox"]')];
		const countEl = dd.querySelector('.count');

		function getExcludedBooks() {
		  return boxes.filter(b => b.checked).map(b => b.value);
		}
		excludeBtn.addEventListener("click", (e) => {
			//const open = dd.classList.toggle("open");
			//excludeBtn.setAttribute("aria-expanded", open ? true : false);
			e.stopPropagation();
			const open = excludeBtn.getAttribute('aria-expanded') === 'true';
  			open ? closeMenu() : openMenu();
		});
		document.addEventListener('click', (e) => {
			if (menu.style.display === 'block' && !menu.contains(e.target)) closeMenu();
		});
		boxes.forEach(b => b.addEventListener('change', () => {
		  changeFilter();
		}));

		menu.addEventListener('click', (e) => {
		  const act = e.target?.dataset?.act;
		  if (!act) return;
		  const state = act === 'all';
		  boxes.forEach(b => b.checked = state);
		  changeFilter();
		});

		function openMenu() {
		  const r = excludeBtn.getBoundingClientRect();
		  menu.style.position = 'fixed';
		  menu.style.top = `${r.bottom + 6}px`;
		  menu.style.left = MOBILE ? 0 : `${Math.min(r.left, window.innerWidth - menu.offsetWidth - 8)}px`;
		  menu.style.right = 'auto';
		  document.body.appendChild(menu);       // move out of the scroller
		  menu.style.display = 'block';
		  excludeBtn.setAttribute('aria-expanded','true');
		}

		function closeMenu() {
		  menu.style.display = 'none';
		  dd.appendChild(menu);                  // put it back (optional)
		  excludeBtn.setAttribute('aria-expanded','false');
		}

		if (MARK != undefined) {
			document.querySelector("#watermark").style.display = "initial";
			if (PRETTY != undefined || IMP !== undefined) {
				document.querySelector("#watermark").style.width = "20%";
			}
		}

		window.addEventListener("resize", () => {
			MOBILE = window.innerWidth <= 600;
		});

		function parseData(data) {
			UPDATED[PAGE] = data["updated"];
			const games = data["games"];
			const props = data["props"];
			data = data["data"];

			if (PLAYER) {
				data = data.filter(r => PLAYER.split(",").includes(r.player))
			}
			let OLD = RES;
			RES = data;

			const gameSel = document.getElementById("game-select");
			gameSel.innerHTML = `<option value="" selected>All</option>`;
			if (games && games.length > 0) {
				games.forEach(game => {
					const option = document.createElement("option");
					option.value = game.replace(" @ ", "-");
					option.textContent = game.toUpperCase();
					gameSel.appendChild(option);
				});
			}
			gameSel.value = GAME;

			const propSel = document.getElementById("prop-select");
			propSel.innerHTML = `<option value="" selected>All</option>`;
			if (props && props.length > 0) {
				props.forEach(prop => {
					const option = document.createElement("option");
					option.value = prop;
					option.textContent = prop.toUpperCase();
					propSel.appendChild(option);
				});
			}
			propSel.value = PROP;
		}

		async function fetchMain() {
			let url = "/api/soccer";
			fetch(API_BASE+url, {
				headers: {
					Authorization: `Bearer ${ACCESS_TOKEN}`
				}
			}).then(res => res.json()).then(res => {
				parseData(res);
				setTimeout(function() {
					updateTimes();
					changeFilter();
				}, 500)
			}).catch(err => console.log(err));
		}

		function updateTimes() {
			updateHeaders();
		}

		function updateHeaders() {
			for (book in UPDATED[PAGE]) {
				if (!UPDATED[PAGE][book]) {
					continue;
				}

				if (!TABLE.getColumn(`bookOdds.${book}`)) {
					continue;
				}
				let el = TABLE.getColumn(`bookOdds.${book}`).getElement();
				el.querySelector(".tabulator-col-title").innerHTML = `${book.toUpperCase()}<img class='book-img' src='logos/${book}.png' alt='${book}' title='${book}' style='height:12px;width:12px;' /><br>${timeAgo(UPDATED[PAGE][book], short=true)}`;
			}
		}

		function renderTable(data) {
			data.sort((a,b) => {
				return parseFloat(b.ev) || 0 - parseFloat(a.ev) || 0;
			});
			let first = [...data];
			first.sort((a,b) => {
				return parseInt(a.startSortable) - parseInt(b.startSortable);
			});
			const idx = data.findIndex(item => parseFloat(item.ev) < 0);
			if (idx != -1) {
				//data.splice(idx, 0, {prop: "separator", ev: ""});
			}
			TABLE = new Tabulator("#table", {
				tooltipsHeader: true,
    		placeholder:"Data Loading...",
				layout: "fitDataFill",
				responsiveLayout: MOBILE ? "" : "",
				autoResize: true,
				data: data,
				initialSort: [
					{column: "ev", dir: "desc"},
				],
				columnDefaults: {
					vertAlign: "middle",
					hozAlign: "center",
					resizable: false,
					headerSortStartingDir: "desc"
				},
				groupHeader: function(value, count, data, group){
					return `<span style='color: #c8c3bc'>${value.toUpperCase()} (${data[0].start})</span>`;
				},
				groupToggleElement: "header",
				groupBy: "",
				groupStartOpen: function (value) {
					return value == first[0].game;
				},
				columns: [
					//{title: "Confirmed", field: "confirmed", formatter:"tickCross", width: 30, hozAlign: "center"},
					{
						title: "Expected<br>Value",
						field: "ev",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: evFormatter,
						responsive: 0
					},
					{
						title: "Best Book", field: "book",
						vertAlign:"bottom", width: MOBILE ? 75 : 75,
						formatter: evBookFormatter2,
						formatterParams:{book:BOOK},
						responsive: 0
					},
					{
						title: "Game", field: "game",
						vertAlign:"bottom", hozAlign: "left",
						responsive: 0,
						width: 150
					},
					{
						title: "Player",
						field: "player",
						headerFilter: "input",
						formatter: playerFormatter,
						width: 140,
						formatterParams:{ sport: SPORT, noProp: true, fullName: true },
						hozAlign: "left",
						responsive: 0,
						frozen: true
					},
					{
						title: "Line",
						field: "handicap",
						formatter: function(cell) {
							const data = cell.getRow().getData();
							const prop = data.prop;
							let ou = data.under ? "u" : "o";
							if (["atgs"].includes(prop)) {
								return cell.getValue();
							} else if (prop.includes("btts")) {
								return ou == "o" ? "Yes" : "No";
							}
							return `${ou}${cell.getValue()}`;
						},
						headerFilter:"list",
						headerFilterParams:{
							valuesLookup: true,
							clearable: true,
							placeholder: "All Props",
							sort: "asc"
						},
						headerFilterFunc: function(headerValue, rowValue) {
							if (headerValue == "All") {
								return true;
							}
							return rowValue === headerValue;
						}
					},
					{
						title: "Prop", field: "prop",
						formatter: function(cell) {
							const data = cell.getRow().getData();
							return data.prop;
						},
						headerFilter:"list",
						headerFilterParams:{
							valuesLookup: true,
							clearable: true,
							placeholder: "All Props",
							sort: "asc"
						},
						headerFilterFunc: function(headerValue, rowValue) {
							if (headerValue == "All") {
								return true;
							}
							return rowValue === headerValue;
						},
						frozen: true
					},
					{
						title: "Line",
						field: "handicap",
						formatter: function(cell) {
							const data = cell.getRow().getData();
							const prop = data.prop;
							let ou = data.under ? "u" : "o";
							return `${ou}${cell.getValue()}`;
						},
						width: 50,
						visible: false
					},
					{
						title: "Fair<br>Value",
						field: "fairVal",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: plusMinusFormatter,
						responsive: 0
					},
					{
						title: "Implied",
						field: "implied",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: impliedFormatter,
						responsive: 0,
						visible: MOBILE ? false : true
					},
					{
						title: "¼ Kelly",
						field: "kelly",
						width: MOBILE ? 40 : 60,
						sorter: "number",
						formatter: function(cell) {
							if (!cell.getValue()) {
								return "";
							}
							return `${cell.getValue().toFixed(2)}u`;
						},
						responsive: 0,
						visible: MOBILE ? false : true
					},
					{title: `FD<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["fd"], short=true)}`, field: "bookOdds.fd",  width: 70, sorter: "number", formatter: evOddsFormatter
					},
					{title: `Circa`, field: "bookOdds.circa",  width: 70, sorter: "number", visible: MOBILE ? true : false},
					{title: `PN<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["pn"], short=true)}`, field: "bookOdds.pn",  width: 70, sorter: "number", visible: MOBILE ? true : false},
					//{title: `B365<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["b365"], short=true)}`, field: "bookOdds.b365", hozAlign: "center", width: 70, sorter: "number", formatter: evOddsFormatter},
					{title: `DK<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["dk"], short=true)}`, field: "bookOdds.dk",  width: 70, sorter: "number", responsive: 6, visible: HISTORICAL ? false : true, formatter: evOddsFormatter},
					{title: `MGM<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["mgm"], short=true)}`, field: "bookOdds.mgm",  width: 70, sorter: "number", visible: false, formatter: evOddsFormatter},
					{title: `ESPN<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["espn"], short=true)}`, field: "bookOdds.espn",  width: 70, sorter: "number", formatter: evOddsFormatter, visible: false},
					{title: `BB<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["kambi"], short=true)}`, field: "bookOdds.kambi",  width: 70, sorter: "number", formatter: evOddsFormatter, visible: false},
					{title: `CZ<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["cz"], short=true)}`, field: "bookOdds.cz",  width: 60, sorter: "number", formatter: evOddsFormatter, visible: false},
					{title: `FN<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["fn"], short=true)}`, field: "bookOdds.fn",  width: 70, sorter: "number", visible: false, formatter: evOddsFormatter},
					{title: `HR<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["hr"], short=true)}`, field: "bookOdds.hr",  width: 70, sorter: "number", visible: false, formatter: evOddsFormatter},
					{title: `BR<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["br"], short=true)}`, field: "bookOdds.br",  width: 70, sorter: "number", visible: true, formatter: evOddsFormatter},
					{title: `BV<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["bv"], short=true)}`, field: "bookOdds.bv",  width: 70, sorter: "number", visible: true, formatter: evOddsFormatter},
					{title: `BOL<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["bol"], short=true)}`, field: "bookOdds.bol",  width: 70, sorter: "number", visible: true, formatter: evOddsFormatter},
					{title: `MB<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["mb"], short=true)}`, field: "bookOdds.mb",  width: 70, sorter: "number", visible: true, formatter: evOddsFormatter},
					{title: `FL<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["fl"], short=true)}`, field: "bookOdds.fl",  width: 70, sorter: "number", visible: true, formatter: evOddsFormatter},
					{title: `PN<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["pn"], short=true)}`, field: "bookOdds.pn",  width: 70, sorter: "number", visible: MOBILE ? false : true, formatter: evOddsFormatter},
					{title: `Circa<br>${timeAgo(UPDATED ? 0 : UPDATED[PAGE]["circa"], short=true)}`, field: "bookOdds.circa", hozAlign: "center", width: 70, sorter: "number", formatter: blurCircaFormatter, visible: false},
					{title: "Game", field: "game", visible: false},
					{title: "Start", field: "startSortable", visible: false, sorter: "number"},
					{title: "Start", field: "start", visible: false},
				]
			});
		}

		window.addEventListener('popstate', (event) => {
			const book = event.state?.book || new URLSearchParams(location.search).get('book') || '';
			const game = event.state?.game || new URLSearchParams(location.search).get('game') || '';
			BOOK = book;
			GAME = game;
			changeFilter();
		});

		document.querySelector("#book-select").value = BOOK || "";
		document.querySelector("#book-select").addEventListener("change", (event) => {
			BOOK = event.target.value;
			changeFilter();
		});

		const boostSel = document.getElementById('boost-select');
		const boostCustom = document.getElementById('boost-custom');

		boostSel.value = BOOST || 0;
		if (BOOST == "custom") {
			boostCustom.style.display = "";
		}
		boostSel.addEventListener("change", (event) => {
			boostCustom.style.display = (event.target.value === "custom") ? '' : 'none';
			changeFilter();
		});

		boostCustom.addEventListener("input", () => {
			changeFilter();
		});

		document.querySelector("#devig-select").value = DEVIG || "";
		document.querySelector("#devig-select").addEventListener("change", (event) => {
			changeFilter();
		});

		if (GAME) {
			document.querySelector("#game-select").value = GAME.replace(" @ ", "-") || "";
		} else {
			document.querySelector("#game-select").value = "";
		}
		document.querySelector("#game-select").addEventListener("change", (event) => {
			GAME = event.target.value;
			const params = new URLSearchParams(window.location.search);
			params.set("game", GAME);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			TABLE.clearFilter();
			changeFilter();
		});

		document.querySelector("#prop-select").value = PROP || "";
		document.querySelector("#prop-select").addEventListener("change", (event) => {
			PROP = event.target.value;
			const params = new URLSearchParams(window.location.search);
			params.set("prop", PROP);
			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			changeFilter();
		});

		function changeFilter() {
			let devigBook = document.getElementById("devig-select")?.value;
			let boost = document.getElementById("boost-select")?.value;
			GAME = document.getElementById("game-select")?.value;
			let game = GAME;
			let book = document.getElementById("book-select")?.value;
			PROP = document.getElementById("prop-select").value;
			let prop = PROP;
			let excluded = getExcludedBooks();
			if (boost === "custom") {
				boost = boostCustom.value;
			}

			let url = new URL(window.location.href);
			const params = new URLSearchParams(window.location.search);

			params.set("boost", boost);
			params.set("devig", devigBook);
			params.set("game", game);
			params.set("book", book);
			params.set("prop", PROP);

			RES.forEach(row => {
				const bookOdds = { ...row.bookOdds };
				//let avg = getAverageImplied(bookOdds, row.under);
				let ou = buildOU(bookOdds, row.under);
				if (!ou) {
					return;
				}
				const ex = excluded;
				ex.push("pn"); ex.push("circa");
				if (devigBook) {
					ex.push(devigBook);
				}
				const highest = highestOver(bookOdds, ex, boost, book, row.under);
				//let ou = avg.avgAmerican.toString();

				if (!isFinite(highest.value)) {
					row["ev"] = "";
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}
				if (row.under) {
				    // If under, swap priority
				    if (devigBook) {
				        // Use the book's under odds if available
				        const val = bookOdds[devigBook];
				        ou = val && String(val).includes("/") ? String(val).split("/")[1] : val;
				    } else if (devigBook === "pn+circa") {
				        // Fallback to averageSharps for unders if combining books
				        ou = averageSharps(bookOdds, true); // pass true for under-side avg if supported
				    }
				} else {
				    if (devigBook === "pn+circa") {
				        ou = averageSharps(bookOdds);
				    } else if (devigBook) {
				        ou = bookOdds[devigBook];
				    }
				}
				if (!ou) {
					row["ev"] = "";
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}

				let d = devig(ou, highest.value, boost);
				if (!d) {
					row["ev"] = "";
					row["fairVal"] = "";
					row["implied"] = "";
					row["kelly"] = "";
					return;
				}
				row["book"] = highest.book;
				row["line"] = highest.value;
				row["ev"] = d.ev;
				row["fairVal"] = d.fairVal;
				row["implied"] = d.implied;
				row["kelly"] = d.kelly;
			});

			const newUrl = `${window.location.pathname}?${params.toString()}`;
			history.pushState({}, '', newUrl);
			TABLE.setSort([
				{column: "ev", dir: "desc"}
			]);
			const filters = [];
			TABLE.clearFilter();
			if (game) {
				game = game.replaceAll("-gm2", "_gm2");
				let [a,h] = game.split("-");
				game = `${a} @ ${h}`;
				game = game.replaceAll("_gm2", "-gm2");
				filters.push({field:"game", type:"=", value: game});
			}
			if (prop) {
				filters.push({field:"prop", type:"=", value: prop});
			}
			if (filters.length > 0) {
				TABLE.setFilter(filters);
			}
			TABLE.replaceData(RES);
		}
	</script>
</body>
</html>
