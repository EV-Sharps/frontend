<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="google" content="notranslate">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Watchlist | +EV Sharps</title>
	<script type="text/javascript" src="tabulator.min.js"></script>
	<script type="text/javascript" src="peity-vanilla.min.js"></script>
	<link href="tabulator.min.css" rel="stylesheet">
	<link href="style.css" rel="stylesheet">
	<script src="plotly-3.0.0.min.js" charset="utf-8"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<link rel="icon" type="image/x-icon" href="logos/icon.png">
</head>
<style type="text/css">
	#table { width: 100%; }
	#chart { max-height: 400px; margin-top: 0.5rem; }
	main {
		justify-content: flex-start;
	}

	/* Search + customize bar */
	#tracker-search-wrap {
		padding: 0.4rem 0.5rem;
		position: relative;
		display: flex;
		align-items: center;
		gap: 0.5rem;
	}
	#tracker-customize-btn {
		flex-shrink: 0;
		padding: 0.35rem 0.65rem;
		background: var(--bg-secondary, #1e2130);
		border: 1px solid var(--border, #374151);
		border-radius: 6px;
		color: var(--text-muted, #6b7280);
		cursor: pointer;
		font-size: 0.82rem;
	}
	#tracker-customize-btn:hover { border-color: #3b82f6; color: #e5e7eb; }

	/* Customize overlay */
	#customize-overlay {
		display: none;
		position: absolute;
		top: 0; left: 0; right: 0; bottom: 0;
		background: rgba(0,0,0,0.7);
		z-index: 400;
		align-items: flex-start;
		justify-content: center;
		padding-top: 3rem;
	}
	#customize-overlay.open { display: flex; }
	#customize-panel {
		background: linear-gradient(160deg, #0d3b66 0%, #021526 100%);
		border-radius: 8px;
		padding: 1.5rem;
		width: 420px;
		max-width: 95vw;
		max-height: 80vh;
		overflow-y: auto;
		box-shadow: 0 0 20px rgba(0,0,0,0.4);
	}
	#customize-panel h2 { text-align: center; margin: 0 0 1rem; font-size: 1rem; }
	#customize-panel h3 { font-size: 0.85rem; text-align: center; margin: 0 0 0.5rem; }
	#cust-items {
		display: flex;
		flex-wrap: wrap;
		gap: 1rem;
	}
	#cust-items > div { min-width: 140px; }
	#cust-items div > div {
		display: flex;
		align-items: center;
		gap: 0.35rem;
		margin-bottom: 0.3rem;
		font-size: 0.82rem;
	}
	#cust-items input[type=checkbox] { cursor: pointer; }
	#cust-items label { cursor: pointer; }
	.cust-actions {
		display: flex;
		justify-content: center;
		gap: 0.5rem;
		margin-top: 1rem;
	}
	.cust-actions button {
		padding: 0.4rem 1.1rem;
		border: none;
		border-radius: 5px;
		background: #007bff;
		color: #fff;
		cursor: pointer;
		font-size: 0.85rem;
	}
	.cust-actions button:hover { background: #0056b3; }
	#tracker-search {
		width: 100%;
		max-width: 340px;
		padding: 0.4rem 0.7rem;
		background: var(--bg-secondary, #1e2130);
		border: 1px solid var(--border, #374151);
		border-radius: 6px;
		color: var(--text, #e5e7eb);
		font-size: 0.85rem;
		box-sizing: border-box;
	}
	#tracker-search:focus { outline: none; border-color: #3b82f6; }
	#tracker-search::placeholder { color: var(--text-muted, #6b7280); }

	#search-dropdown {
		display: none;
		position: absolute;
		top: calc(100% - 2px);
		left: 0.5rem;
		width: 340px;
		max-width: calc(100vw - 1rem);
		background: var(--bg, #111827);
		border: 1px solid var(--border, #374151);
		border-radius: 0 0 6px 6px;
		z-index: 200;
		max-height: 260px;
		overflow-y: auto;
	}
	#search-dropdown.open { display: block; }
	.search-result {
		padding: 0.45rem 0.75rem;
		cursor: pointer;
		font-size: 0.82rem;
		border-bottom: 1px solid var(--border, #374151);
		display: flex;
		justify-content: space-between;
		align-items: center;
		gap: 0.5rem;
	}
	.search-result:last-child { border-bottom: none; }
	.search-result:hover { background: rgba(59,130,246,0.15); }
	.search-result-player { font-weight: 600; }
	.search-result-meta { color: var(--text-muted, #6b7280); font-size: 0.75rem; }

	/* Add-bet modal */
	#add-bet-backdrop {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.6);
		z-index: 500;
		align-items: center;
		justify-content: center;
	}
	#add-bet-backdrop.open { display: flex; }
	#add-bet-modal {
		background: var(--bg, #111827);
		border: 1px solid var(--border, #374151);
		border-radius: 10px;
		padding: 1.25rem 1.5rem;
		width: 360px;
		max-width: 95vw;
		max-height: 85vh;
		overflow-y: auto;
		position: relative;
	}
	#add-bet-modal h3 { margin: 0 0 0.25rem; font-size: 1rem; }
	#add-bet-modal .meta { color: var(--text-muted, #6b7280); font-size: 0.78rem; margin-bottom: 1rem; }
	.modal-close {
		position: absolute; top: 0.75rem; right: 1rem;
		background: none; border: none;
		color: var(--text-muted, #6b7280); font-size: 1.2rem; cursor: pointer; line-height: 1;
	}
	.modal-close:hover { color: var(--text, #e5e7eb); }

	/* Book odds picker grid */
	.odds-grid-label { font-size: 0.72rem; color: var(--text-muted, #6b7280); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.4rem; }
	.odds-grid {
		display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem;
	}
	.odds-chip {
		padding: 0.3rem 0.55rem;
		border-radius: 5px;
		border: 1px solid var(--border, #374151);
		background: var(--bg-secondary, #1e2130);
		color: var(--text, #e5e7eb);
		font-size: 0.8rem;
		cursor: pointer;
		display: flex; flex-direction: column; align-items: center; gap: 1px;
		min-width: 52px;
	}
	.odds-chip:hover { border-color: #3b82f6; }
	.odds-chip.selected { border-color: #3b82f6; background: rgba(59,130,246,0.2); color: #93c5fd; }
	.odds-chip .chip-book { font-size: 0.68rem; color: var(--text-muted, #6b7280); }
	.odds-chip.selected .chip-book { color: #93c5fd; }

	.divider { text-align: center; color: var(--text-muted, #6b7280); font-size: 0.75rem; margin: 0.5rem 0; }

	.manual-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
	.manual-row input, .manual-row select {
		flex: 1; min-width: 0; padding: 0.4rem 0.5rem;
		background: var(--bg-secondary, #1e2130);
		border: 1px solid var(--border, #374151);
		border-radius: 5px; color: var(--text, #e5e7eb); font-size: 0.85rem;
	}
	.manual-row input:focus, .manual-row select:focus { outline: none; border-color: #3b82f6; }
	.manual-row input::placeholder { color: var(--text-muted, #6b7280); }
	#abt-error { color: #ef4444; font-size: 0.8rem; margin-bottom: 0.75rem; }
	#watchlist-table .wl-edit .book-img { display: block; flex: none; width: 14px; height: 14px; margin: 0; object-fit: contain; }

	.modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
	.modal-actions button {
		padding: 0.4rem 1rem; border-radius: 5px;
		border: 1px solid var(--border, #374151);
		cursor: pointer; font-size: 0.85rem;
	}
	#add-bet-save {
		background: #3b82f6; color: #fff; border-color: #3b82f6; font-weight: 600;
	}
	#add-bet-save:hover { opacity: 0.85; }
	#add-bet-cancel { background: transparent; color: var(--text-muted, #6b7280); }
	#add-bet-remove {
		background: transparent; color: #ef4444; border-color: #ef4444; margin-right: auto;
	}

	@media (max-width: 1350px) {
		#table-container { justify-content: normal; }
		#table-container, #table { width: 100%; }
	}
	.tracker-section-label {
		padding: 0.3rem 0.5rem 0.15rem;
		font-size: 0.72rem;
		font-weight: 600;
		color: var(--text-muted, #9ca3af);
		text-transform: uppercase;
		letter-spacing: 0.06em;
		border-top: 1px solid var(--border, #374151);
		margin-top: 0.3rem;
	}
	#mobile-table-toggle { display: none; }
	@media (max-width: 768px) {
		#tracker-search-wrap {
			overflow: auto;
		}
		#tracker-search-wrap button {
			flex: 0 0 auto;
		}
		#popular-watchlist-list, #popular-bets-list {
			overflow:auto;
			flex-wrap:nowrap !important;
		}

		#mobile-table-toggle {
			display: flex;
			border-bottom: 1px solid var(--border, #374151);
			margin: 4px 0;
		}
		#mobile-table-toggle button {
			flex: 1;
			padding: 7px 0;
			background: transparent;
			border: none;
			border-bottom: 2px solid transparent;
			color: var(--text-muted, #9ca3af);
			font-size: 0.85rem;
			cursor: pointer;
		}
		#mobile-table-toggle button.active {
			color: var(--text, #e5e7eb);
			border-bottom-color: #3b82f6;
		}
		#bets-section { display: none; }
	}
</style>
<body>
	<div id="app">
		<header id="header">
			<div id="title">
				<h1>+EV Sharps</h1>
			</div>
			<div id="center-dropdown">
				<div class="select-wrapper">
					<select id="page-select"></select>
					<svg class="select-arrow" viewBox="0 0 20 20">
						<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
					</svg>
				</div>
			</div>
			<div id="auth-buttons">
				<button class="discord-login loggedOut" onclick="loginWithDiscord()">
					<img src="/logos/discord.png" alt="Discord logo">
					<span class="btn-text">Sign in with Discord</span>
				</button>
				<button class="gsi-material-button loggedOut" onclick="loginWithGoogle()">
				  <div class="gsi-material-button-state"></div>
				  <div class="gsi-material-button-content-wrapper">
				    <div class="gsi-material-button-icon">
				      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
				        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
				        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
				        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
				        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
				        <path fill="none" d="M0 0h48v48H0z"></path>
				      </svg>
				    </div>
				    <span style="display: none;">Sign in with Google</span>
				  </div>
				</button>
				<span id="username" class="loggedIn username"></span>
				<button id="pricing" class="loggedOut" onclick="changePage('pricing')">Pricing</button>
				<button id="hide-username" onclick="hideUsername()">Hide</button>
				<button id="account" class="loggedIn" onclick="changePage('profile')">Profile</button>
				<button id="upgrade" class="loggedIn" onclick="changePage('pricing')">Upgrade 🎯</button>
				<button id="logout" class="loggedIn" onclick="logout()">Logout</button>
			</div>
		</header>
		<main>
			<!-- Player search + customize -->
			<div id="tracker-search-wrap">
				<label style="font-size:0.78rem;color:var(--text-muted,#9ca3af);white-space:nowrap;display:flex;align-items:center;gap:0.3rem;">
					Method:
					<select id="tracker-method-select" style="font-size:0.78rem;padding:2px 4px;background:var(--bg-secondary,#1e2130);border:1px solid var(--border,#374151);color:var(--text,#e5e7eb);border-radius:4px;">
						<option value="" selected>Worst-Case</option>
						<option value="add">Additive</option>
						<option value="mult">Multiplicative</option>
						<option value="probit">Probit</option>
					</select>
				</label>
				<button onclick="addAllWatchlistToBets()" style="font-size:0.7rem;padding:2px 8px;background:var(--bg-secondary,#1e2130);border:1px solid var(--border,#374151);border-radius:4px;color:var(--text-muted,#9ca3af);cursor:pointer;" title="Add all watchlist players to bets using saved odds when available">Add All to Bets</button>
				<button onclick="clearAllBets()" style="flex-shrink:0;padding:0.35rem 0.65rem;background:var(--bg-secondary,#1e2130);border:1px solid var(--border,#374151);border-radius:6px;color:#ef4444;cursor:pointer;font-size:0.78rem;" title="Clear all bets">Clear All Bets</button>
				<button id="tracker-customize-btn" onclick="openCustomize()">⚙️</button>
			</div>

			<!-- Customize overlay -->
			<div id="customize-overlay">
				<div id="customize-panel">
					<h2>Customize Columns</h2>
					<div id="cust-items">
						<div>
							<h3>Book Odds</h3>
							<div><input id="cust_circa"  type="checkbox"><label for="cust_circa">Circa</label></div>
							<div><input id="cust_fd"     type="checkbox"><label for="cust_fd">FanDuel</label></div>
							<div><input id="cust_b365"   type="checkbox"><label for="cust_b365">Bet365</label></div>
							<div><input id="cust_dk"     type="checkbox"><label for="cust_dk">DraftKings</label></div>
							<div><input id="cust_mgm"    type="checkbox"><label for="cust_mgm">MGM</label></div>
							<div><input id="cust_espn"   type="checkbox"><label for="cust_espn">ESPN</label></div>
							<div><input id="cust_cz"     type="checkbox"><label for="cust_cz">Caesars</label></div>
							<div><input id="cust_fn"     type="checkbox"><label for="cust_fn">Fanatics</label></div>
							<div><input id="cust_br"     type="checkbox"><label for="cust_br">BetRivers</label></div>
							<div><input id="cust_hr"     type="checkbox"><label for="cust_hr">Hard Rock</label></div>
							<div><input id="cust_kal"    type="checkbox"><label for="cust_kal">Kalshi</label></div>
							<div><input id="cust_pn"     type="checkbox"><label for="cust_pn">Pinnacle</label></div>
							<div><input id="cust_kambi"  type="checkbox"><label for="cust_kambi">Kambi</label></div>
							<div><input id="cust_bol"    type="checkbox"><label for="cust_bol">BetOnline</label></div>
							<div><input id="cust_nv"     type="checkbox"><label for="cust_nv">NoVig</label></div>
							<div><input id="cust_px"     type="checkbox"><label for="cust_px">ProphetX</label></div>
							<div><input id="cust_poly"   type="checkbox"><label for="cust_poly">Polymarket</label></div>
							<div><input id="cust_bv"     type="checkbox"><label for="cust_bv">Bovada</label></div>
							<div><input id="cust_re"     type="checkbox"><label for="cust_re">Rebet</label></div>
							<div><input id="cust_fl"     type="checkbox"><label for="cust_fl">Fliff</label></div>
							<div><input id="cust_hr_oh"  type="checkbox"><label for="cust_hr_oh">Hard Rock OH</label></div>
							<div><input id="cust_hr_az"  type="checkbox"><label for="cust_hr_az">Hard Rock AZ</label></div>
						</div>
					</div>
					<div class="cust-actions">
						<button onclick="closeCustomize()">Close</button>
					</div>
				</div>
			</div>

			<div id="mobile-table-toggle">
				<button id="toggle-watchlist" class="active" onclick="showTrackerTab('watchlist')">⭐ Watchlist</button>
				<button id="toggle-bets" onclick="showTrackerTab('bets')">💰 My Bets</button>
			</div>
			<div id="watchlist-section">
			<div class="tracker-section-label" style="margin-top:0;border-top:none;display:flex;align-items:center;justify-content:space-between;">
				<span>⭐ Watchlist</span>
			</div>
			<div id="popular-watchlist-wrap" style="padding:0.3rem 0.5rem;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;font-size:0.78rem;min-height:1.6rem;">
				<span style="color:var(--text-muted,#6b7280);white-space:nowrap;">🔥 Trending:</span>
				<div id="popular-watchlist-list" style="display:flex;gap:0.3rem;flex-wrap:wrap;"></div>
			</div>
			<div id="watchlist-table"></div>
			</div><!-- /watchlist-section -->

			<div id="bets-section">
			<div class="tracker-section-label">💰 My Bets</div>
			<div style="padding:0.3rem 0.5rem;position:relative;">
				<input id="tracker-search" type="text" placeholder="Search to add a player...">
				<div id="search-dropdown"></div>
			</div>
			<div id="popular-bets-wrap" style="padding:0.3rem 0.5rem;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;font-size:0.78rem;min-height:1.6rem;">
				<span style="color:var(--text-muted,#6b7280);white-space:nowrap;">🔥 Trending:</span>
				<div id="popular-bets-list" style="display:flex;gap:0.3rem;flex-wrap:wrap;"></div>
			</div>

			<div id="table-container">
				<div id="table"></div>
				<div id="right-body" class="body">
					<div style="display:flex;align-items:center;gap:6px;">
						<div class="select-wrapper">
							<select id="btwn-select">
								<option value="odds">Odds</option>
							</select>
							<svg class="select-arrow" viewBox="0 0 20 20">
								<path d="M7 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/>
							</svg>
						</div>
						<button onclick="TABLE.deselectRow(); closeRightBody();" style="background:none;border:1px solid #444;color:#aaa;border-radius:4px;cursor:pointer;font-size:1rem;line-height:1;padding:4px 8px;" title="Close">&times;</button>
					</div>
					<div id="chart"></div>
				</div>
			</div>
			</div><!-- /bets-section -->
		</main>
	</div>

	<!-- Add/Edit bet modal -->
	<div id="add-bet-backdrop">
		<div id="add-bet-modal">
			<button class="modal-close" onclick="closeAddBet()">×</button>
			<h3 id="abt-player"></h3>
			<div class="meta" id="abt-meta"></div>
			<div class="manual-row">
				<select id="abt-side" aria-label="Side"><option value="over">Over</option><option value="under">Under</option></select>
				<input type="number" step="any" id="abt-line" aria-label="Line" placeholder="Line">
			</div>

			<div class="odds-grid-label">Pick odds from book</div>
			<div class="odds-grid" id="abt-odds-grid"></div>

			<div class="divider">or enter manually</div>
			<div class="manual-row">
				<input type="number" id="abt-manual-odds" aria-label="American odds" placeholder="Odds (e.g. +755)">
				<select id="abt-manual-book" aria-label="Book">
					<option value="">Book</option>
					<option value="circa">Circa</option>
					<option value="fd">FanDuel</option>
					<option value="b365">Bet365</option>
					<option value="dk">DraftKings</option>
					<option value="mgm">MGM</option>
					<option value="espn">ESPN</option>
					<option value="cz">Caesars</option>
					<option value="fn">Fanatics</option>
					<option value="br">BetRivers</option>
					<option value="hr">Hard Rock</option>
					<option value="kal">Kalshi</option>
					<option value="pn">Pinnacle</option>
					<option value="kambi">Kambi</option>
					<option value="bol">BetOnline</option>
					<option value="nv">NoVig</option>
					<option value="px">ProphetX</option>
					<option value="poly">Polymarket</option>
					<option value="bv">Bovada</option>
					<option value="re">Rebet</option>
					<option value="fl">Fliff</option>
				</select>
			</div>

			<div id="abt-error" role="alert" hidden></div>
			<div class="modal-actions">
				<button id="add-bet-remove" style="display:none" onclick="removeBet()">Remove</button>
				<button id="add-bet-cancel" onclick="closeAddBet()">Cancel</button>
				<button id="add-bet-save"   onclick="saveBet()">Save</button>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="shared.js"></script>
	<script type="text/javascript" src="auth.js"></script>
	<script type="text/javascript">
		PAGE = "tracker";
		parseURLParams();
		SPORT = "mlb";
	
		if (IS_LOCALHOST) {
			CURR_USER = { metadata: {
				watchlist: [
					{ player: "jazz chisholm", dt: new Date().toISOString().slice(0,10) },
					{ player: "juan soto", dt: new Date().toISOString().slice(0,10) },
				],
				bets: [{ player: "juan soto", odds: 355, book: "pn", dt: new Date().toISOString().slice(0,10) }]

		async function persistBets() {
			if (!CURR_USER || !CURR_SESSION) return;

		// ── Matching ─────────────────────────────────────────────────────
		function findBet(row) {

		function trackerBetMatches(bet, row) {
			const player = (row.player || "").toLowerCase().trim();
			const savedPlayer = (bet.player || "").toLowerCase().trim();
			if (!player || !savedPlayer || !(player === savedPlayer || player.includes(savedPlayer) || savedPlayer.includes(player))) return false;
			if (watchlistSport(bet.sport || "mlb") !== watchlistSport(row.sport || "mlb")) return false;
			if (watchlistProp(bet) !== watchlistProp({ prop: row.prop, page: row.watchlistPage || row.page || "dingers" })) return false;
			if (bet.page && row.watchlistPage && bet.page !== row.watchlistPage) return false;
			return trackerQuoteMatches(bet, row);
		}

		function trackerQuoteMatches(quote, row) {
			return (!quote.game || quote.game === row.game)
				&& (quote.handicap == null || quote.handicap === "" || (row.handicap != null && row.handicap !== "" && Number(quote.handicap) === Number(row.handicap)))
				&& (typeof quote.under !== "boolean" || quote.under === !!row.under);
		}

		function bettedRows() {
			return BETS.map(bet => {
				const row = ALL_ROWS.find(row => trackerBetMatches(bet, row));
				return { team: "", bpp: "", prop: watchlistProp(bet), sport: bet.sport || "mlb",
					...bet, line: bet.odds, ...(row || {}), watchlistPage: bet.page,
					_bet: bet, _betOdds: bet.odds, _betBook: bet.book };
			});
		}

		// ── Fetch ─────────────────────────────────────────────────────────
		let trackerFetchPending = null;

		let trackerPageShown = true;
		let trackerResumePending = false;
		const trackerIsVisible = () => trackerPageShown && document.visibilityState !== "hidden";
		const trackerSourceRows = new Map();
		let trackerSourceOwner;
		const TRACKER_SOURCE_SPORTS = {
			nhl: "nhl", atgs: "nhl", atgs2: "nhl", fgs: "nhl",
			nfl: "nfl", tds: "nfl", tds2: "nfl", ftd: "nfl",
			nba: "nba", pts: "nba", threes: "nba", kotc: "nba", wnba: "wnba",
			mlb: "mlb", strikeouts: "mlb", dingers2: "mlb", wbc: "mlb",
			ncaaf: "ncaaf", ncaafprops: "ncaaf", ncaab: "ncaab", baseball_ncaa: "baseball_ncaa", ufc: "ufc"
		};

		function trackerSources() {
			const today = new Date().toISOString().slice(0, 10);
			const metadata = CURR_USER?.metadata || {};
			const sources = new Map();
			for (const entry of [...(metadata.watchlist || []), ...(metadata.bets || [])]) {
				if (!entry || entry.dt !== today) continue;
				const page = watchlistPage(entry);
				const sport = watchlistSport(entry.sport) || TRACKER_SOURCE_SPORTS[page];
				let path;
				if (Object.hasOwn(TRACKER_SOURCE_SPORTS, page)) {
					path = page === "ncaafprops" ? "/api/ncaaf?props=true" : `/api/${page}`;
				} else if (["outliers", "live"].includes(page) && sport) {
					path = `/api/${page}?sport=${encodeURIComponent(sport)}`;
				}
				// The original tracker feed continues to supply Dingers and legacy MLB entries.
				if (path) sources.set(path, { path, page, sport });
			}
			return [...sources.values()];
		}

		function trackerRowsFromData(data, source) {
			const raw = data?.data ?? data;
			if (!raw || typeof raw !== "object") throw new Error("Invalid tracker data response");
			const rows = Array.isArray(raw) ? raw : Object.entries(raw).map(([key, row]) => ({ _key: key, ...row }));
			return rows.filter(row => row && typeof row === "object").map(row => ({
				...row,
				sport: watchlistSport(row.sport) || source?.sport || "mlb",
				...(source ? { watchlistPage: source.page } : {}),
				...(row.under == null && row.ouIdx != null ? { under: Number(row.ouIdx) === 1 } : {})
			}));
		}

		function refreshTrackerFromProfile() {
			// Profile hydration can finish after the initial market request.
			// Queue a pass so newly saved sports also receive live book prices.
			return trackerFetchPending
				? trackerFetchPending.then(() => fetchTrackerData())
				: fetchTrackerData();
		}

		function fetchTrackerData({ refreshProfile = false } = {}) {
			if (!trackerIsVisible()) {
				trackerResumePending = true;
				return Promise.resolve();
			}
			if (trackerFetchPending) return trackerFetchPending;
			const controller = new AbortController();
			trackerFetchController = controller;
			let finishAborted;
			const aborted = new Promise(resolve => { finishAborted = () => resolve(null); });
			controller.signal.addEventListener("abort", finishAborted, { once: true });
			const version = ++trackerFetchVersion;
			const userId = CURR_SESSION?.user?.id;
			const user = CURR_USER;
			const metadata = user?.metadata;
			const token = ACCESS_TOKEN;
			const owner = userId || token;
			if (trackerSourceOwner !== owner) {
				trackerSourceRows.clear();
				trackerSourceOwner = owner;
			}
			const current = () => version === trackerFetchVersion && !controller.signal.aborted && trackerIsVisible()
				&& (userId ? CURR_SESSION?.user?.id === userId : ACCESS_TOKEN === token);
			const context = { signal: controller.signal, current };
			const requestData = async path => {
				const response = await fetch(API_BASE + path, {
					headers: { Authorization: `Bearer ${token}` }, signal: controller.signal
				});
				if (!response.ok) throw new Error(`Tracker refresh failed (${response.status}): ${path}`);
				return response.json();
			};
			const run = Promise.resolve().then(async () => {
				if (!current()) return;
				const profileRequest = async () => {
					if (!refreshProfile || !userId) return null;
					let request = SB.from('profiles').select('*').eq('id', userId).maybeSingle();
					if (typeof request.abortSignal === "function") request = request.abortSignal(controller.signal);
					const { data, error } = await request;
					if (error) throw error;
					return data;
				};
				const popularResults = Promise.allSettled([fetchPopularBets(context), fetchPopularWatchlist(context)]);
				const results = await Promise.race([Promise.allSettled([
					requestData("/api/tracker"),
					profileRequest()
				]), aborted]);
				if (!results || !current()) return;
				for (const result of results) {
					if (result.status === "rejected" && result.reason?.name !== "AbortError") console.error("Tracker refresh failed", result.reason);
				}
				const profile = results[1].status === "fulfilled" ? results[1].value : null;
				// Never replace changes made here while the cross-tab profile read was pending.
				if (profile && profile.id === userId && CURR_USER === user && CURR_USER?.metadata === metadata && !_savingBet) {
					CURR_USER = profile;
					cacheProfile(CURR_USER);
				}
				if (results[0].status === "fulfilled") {
					const data = results[0].value;
					RES = data;
					UPDATED[PAGE] = data.updated || {};
					trackerSourceRows.set("/api/tracker", trackerRowsFromData(data));
				}
				loadBetsFromMetadata();
				await Promise.race([loadWatchlistFromMetadata(), aborted]);
				if (!current()) return;
				const sources = trackerSources();
				const publish = () => {
					// Prefer each saved play's source feed; retain the original feed for search/legacy rows.
					ALL_ROWS = [...sources.flatMap(source => trackerSourceRows.get(source.path) || []),
						...(trackerSourceRows.get("/api/tracker") || [])];
					refreshTable(); refreshWatchlist();
				};
				publish();
				await Promise.race([Promise.allSettled(sources.map(async source => {
					try {
						const data = await requestData(source.path);
						if (!current()) return;
						trackerSourceRows.set(source.path, trackerRowsFromData(data, source));
						publish();
					} catch (error) {
						// One unavailable sport must not erase the other feeds or saved quotes.
						if (current() && error?.name !== "AbortError") console.error("Tracker book prices failed", error);
					}
				})), aborted]);
				if (!current()) return;
				// Popular lists are supplementary; their requests must not delay the main tables.
				const popular = await Promise.race([popularResults, aborted]);
				if (popular && current()) {
					for (const result of popular) {
						if (result.status === "rejected" && result.reason?.name !== "AbortError") console.error("Tracker popular refresh failed", result.reason);
					}
				}
			}).catch(error => {
				if (current() && error?.name !== "AbortError") console.error("Tracker refresh failed", error);
			}).finally(() => {
				controller.signal.removeEventListener("abort", finishAborted);
				if (trackerFetchPending === run) { trackerFetchPending = null; trackerFetchController = null; }
			});
			trackerFetchPending = run;
			return run;
		}

		function pauseTrackerRefresh() {
			trackerResumePending = true;

			trackerFetchController = null;
			trackerFetchPending = null;

		// ── EV helpers ───────────────────────────────────────────────────
		let CIRCA_DEVIG = "circa"; // "market" = use fairVal, else a bookOdds key

		const ALL_BOOK_KEYS = ["fd","b365","dk","mgm","espn","cz","fn","br","hr","kal","pn","kambi","bol","nv","px","poly","bv","re","fl","hr_oh","hr_az"];
		const TRACKER_BOOK_COLUMNS = [
			["circa", "Circa"], ["fd", "FD", 60], ["b365", "B365"], ["dk", "DK", 60],
			["mgm", "MGM"], ["espn", "ESPN"], ["cz", "CZ", 60], ["fn", "FN", 60],
			["br", "BR"], ["hr", "HR"], ["pn", "PN"], ["kambi", "Kambi"],

		function toImplied(odds) {
			if (!odds) return null;
			odds = Number(odds);
			return odds > 0 ? 100 / (odds + 100) : Math.abs(odds) / (Math.abs(odds) + 100);
		}

		function calcEV(prob, betOdds) {
			if (!prob || !betOdds) return null;
			betOdds = Number(betOdds);
			const payout = betOdds > 0 ? betOdds / 100 : 100 / Math.abs(betOdds);
			return (prob * (1 + payout) - 1) * 100;
		}

		function getTrackerWeights(devigKey) {
			const books = devigKey ? devigKey.split("+") : [...ALL_BOOK_KEYS, "circa", "pn"];
			const w = {};
			books.forEach(b => w[b] = 1);
			return w;
		}

		function computeDevigged(row, devigKey) {
			const prevDevig = DEVIG;
			DEVIG = devigKey ?? DEVIG;
			const fv = averageDevigs(row.bookOdds || {}, null, row.under, getTrackerWeights(devigKey));
			DEVIG = prevDevig;
			return isFinite(fv) ? fv : null;
		}

		function getMarketFairProb(row) {
			return computeDevigged(row, DEVIG) ?? toImplied(row.fairVal);

		function getFairProb(row) {
			if (CIRCA_DEVIG === "market") return getMarketFairProb(row);
			return computeDevigged(row, CIRCA_DEVIG) ?? toImplied((row.bookOdds || {})[CIRCA_DEVIG]);
		}

		function getBestMarketOdds(row) {
			const bo = row.bookOdds || {};
			let best = null;
			ALL_BOOK_KEYS.forEach(k => {
				const o = bo[k];
				if (!o) return;
				if (best === null || Number(o) > Number(best)) best = o;
			});
			return best;
		}

		// ── Watchlist table ──────────────────────────────────────────────
		function watchlistedRows() {
			const watchlist = CURR_USER?.metadata?.watchlist || [];
			return watchlist.map(w => {
				const p = (w.player ?? w).toLowerCase().trim();
				const sport = watchlistSport(w.sport) || "mlb";
				const prop = watchlistProp(w);
				const quote = sanitizeWatchlistQuote(w.quote);
				const row = ALL_ROWS.find(r => {
					const rp = (r.player || "").toLowerCase().trim();
					return rp && (watchlistSport(r.sport) || "mlb") === sport
						&& (!r.watchlistPage || r.watchlistPage === watchlistPage(w))
						&& watchlistProp({ prop: r.prop, page: r.watchlistPage || "dingers" }) === prop
						&& (rp === p || rp.includes(p) || p.includes(rp))
						&& (!quote || trackerQuoteMatches(quote, r));
				});
				const sourcePage = watchlistPage(w);
				return { ...(row || { player: w.player ?? w, team: w.team || "", game: "" }),
					...(quote ? { ...quote, line: quote.odds } : {}),
					sport, prop, watchlistPage: sourcePage, watchlistPlayer: p,
					_watchlistQuote: quote, _watchlistEntry: w };
			});
		}

		function trackerBookOdds(row, book, under = !!row.under) {
			const raw = row.bookOdds?.[book];
			if (raw == null || raw === "" || row.blurred) return null;
			const sides = String(raw).split("/");
			if (under && (sides.length < 2 || !sides[1].trim())) return null;
			const odds = Number((sides.length > 1 ? sides[under ? 1 : 0] : sides[0])?.trim());
			return Number.isFinite(odds) && Math.abs(odds) >= 100 ? odds : null;
		}

		function trackerStartingQuote(row) {
			if (row._watchlistQuote) return row._watchlistQuote;
			const displayed = watchlistQuote(row, row.watchlistPage || row.page || "dingers");
			if (displayed?.odds != null && displayed.book) return displayed;
			if (row.blurred) return null;
			let best = null;
			for (const book of ["circa", ...ALL_BOOK_KEYS]) {
				const odds = trackerBookOdds(row, book);
				if (odds != null && (!best || odds > best.odds)) best = { book, odds };
			}
			return best ? sanitizeWatchlistQuote({ ...best, handicap: row.handicap, under: !!row.under, game: row.game }) : displayed;
		}

			const row = cell.getRow().getData();
			const quote = row._watchlistQuote;
			if (!quote) return bestBookFormatter(cell, params, rendered);
			const button = document.createElement("button");
			button.type = "button";
			button.className = "wl-edit";
			button.title = "Edit saved line, book and odds";
			button.style.cssText = "display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:transparent;color:inherit;cursor:pointer";
			if (quote.book) {
				const logo = document.createElement("img");
				logo.className = "book-img";
				logo.src = `logos/${quote.book.replace("kambi", "parx").replace("hr_az", "hr").replace("hr_oh", "hr")}.png`;
				logo.alt = quote.book;
				button.appendChild(logo);
			}
			button.appendChild(document.createTextNode(quote.odds == null ? "Edit" : oddsDisplay(`${quote.odds > 0 ? "+" : ""}${quote.odds}`)));
			button.addEventListener("click", event => { event.stopPropagation(); openWatchlistEdit(row); });
			return button;
		}

		function addAllWatchlistToBets() {
			const today = new Date().toISOString().slice(0, 10);
			const rows = watchlistedRows();
			let added = 0;
			for (const row of rows) {
				if (findBet(row)) continue;
				const quote = trackerStartingQuote(row);
				if (quote?.odds == null || !quote.book) continue;
				BETS.push({ dt: today, game: row.game || "", player: row.player || "", sport: row.sport || "mlb",
					page: row.watchlistPage || "dingers", prop: row.prop || "hr", ...quote });
				added++;
			}
			if (added > 0) { persistBets(); refreshTable(); }
		}

			return new Set(CUST_DEFAULT);
		}

		const BOOK_KEYS = ["circa", ...ALL_BOOK_KEYS];

		function openAddBet(row) {

		function openTrackerEditor(row, mode) {
			if (_savingBet) return;
			_addBetRow = row;
			_addBetMode = mode;
			const existing = mode === "bet" ? findBet(row) : null;
			const initial = existing || trackerStartingQuote(row) || {};

			const player = row.player ? row.player.split(' ').map(w => w[0].toUpperCase()+w.slice(1)).join(' ') : "";
			document.getElementById("abt-player").textContent = player;
			document.getElementById("abt-meta").textContent = `${row.game || ""} · ${convertProp(row.prop || "hr")} · ${mode === "watchlist" ? "Edit watchlist" : existing ? "Edit bet" : "Add bet"}`;
			document.getElementById("abt-line").value = initial.handicap ?? row.handicap ?? "";
			document.getElementById("abt-side").value = (initial.under ?? row.under) ? "under" : "over";
			document.getElementById("abt-manual-odds").value = initial.odds ?? "";
			const bookSelect = document.getElementById("abt-manual-book");
			if (initial.book && !Array.from(bookSelect.options).some(option => option.value === initial.book)) {
				const option = document.createElement("option");
				option.value = initial.book;
				option.textContent = initial.book.toUpperCase();
				bookSelect.appendChild(option);
			}
			bookSelect.value = initial.book || "";
			document.getElementById("abt-error").hidden = true;
			document.getElementById("add-bet-save").textContent = mode === "watchlist" ? "Save Watchlist" : "Save Bet";
			document.getElementById("add-bet-remove").style.display = existing ? "" : "none";
			renderTrackerOddsChoices();
			document.getElementById("add-bet-backdrop").classList.add("open");
		}

		function renderTrackerOddsChoices() {
			if (!_addBetRow) return;
			const grid = document.getElementById("abt-odds-grid");
			grid.innerHTML = "";
			const line = document.getElementById("abt-line").value;
			if (line === "" || Number(line) !== Number(_addBetRow.handicap)) return;
			const under = document.getElementById("abt-side").value === "under";
			BOOK_KEYS.forEach(bk => {
				// A scalar quote only describes the source row's side.
				if (under !== !!_addBetRow.under && !String(_addBetRow.bookOdds?.[bk] ?? "").includes("/")) return;
				const val = trackerBookOdds(_addBetRow, bk, under);
				if (val == null) return;
				const chip = document.createElement("button");
				chip.type = "button";
				chip.className = "odds-chip";
				chip.dataset.book = bk;
				chip.dataset.odds = val;
				chip.innerHTML = `<span>${val > 0 ? "+" : ""}${val}</span><span class="chip-book">${bk.toUpperCase()}</span>`;
				chip.addEventListener("click", function() {
					grid.querySelectorAll(".odds-chip").forEach(c => c.classList.remove("selected"));
					chip.classList.add("selected");
					document.getElementById("abt-manual-odds").value = val;
					document.getElementById("abt-manual-book").value = bk;
				});
				grid.appendChild(chip);
			});
		}

		function closeAddBet() {
			if (_savingBet) return;
			document.getElementById("add-bet-backdrop").classList.remove("open");
			_addBetRow = null;
		}

		async function saveBet() {
			if (!_addBetRow || _savingBet) return;
			const row = _addBetRow;
			const odds = Number(document.getElementById("abt-manual-odds").value);
			const book = document.getElementById("abt-manual-book").value;
			const rawLine = document.getElementById("abt-line").value;
			const quote = sanitizeWatchlistQuote({ odds, book,
				...(rawLine !== "" ? { handicap: Number(rawLine) } : {}),
				under: document.getElementById("abt-side").value === "under", game: row.game });
			const errorBox = document.getElementById("abt-error");
			if (!quote?.book || quote.odds == null || (rawLine !== "" && !Number.isFinite(Number(rawLine)))) {
				errorBox.textContent = "Choose a book and enter valid American odds (at least +100 or -100).";
				errorBox.hidden = false;
				return;
			}
			_savingBet = true;
			const save = document.getElementById("add-bet-save");
			save.disabled = true;
			errorBox.hidden = true;
			let succeeded = false;
			try {
				if (!CURR_USER) throw new Error("Sign in to save your changes.");
				const user = CURR_USER;
				const userId = CURR_SESSION?.user?.id;
				const metadata = { ...(CURR_USER.metadata || {}) };
				if (_addBetMode === "watchlist") {
					let found = false;
					metadata.watchlist = (metadata.watchlist || []).map(entry => {
						if (!watchlistMatches(entry, row.watchlistPlayer, row.sport, row.watchlistPage, row.prop)) return entry;
						found = true;
						return { ...(typeof entry === "object" ? entry : { player: entry }), quote };
					});
					if (!found) throw new Error("This play is no longer in your watchlist.");
				} else {
					const existing = findBet(row);
					metadata.bets = BETS.filter(bet => bet !== existing);
					metadata.bets.push({ dt: new Date().toISOString().slice(0, 10),
						player: row.player || "", sport: row.sport || "mlb",
						page: row.watchlistPage || row.page || "dingers", prop: row.prop || "hr", ...quote });
				}
				if (userId) {
					const { error } = await SB.from('profiles').update({ metadata }).eq('id', userId);
					if (error) throw new Error("Could not save changes. Please try again.");
				}
				if (CURR_USER !== user || CURR_SESSION?.user?.id !== userId) throw new Error("Your session changed. Please sign in and try again.");
				CURR_USER.metadata = metadata;
				if (_addBetMode === "bet") BETS = metadata.bets;
				cacheProfile(CURR_USER);
				refreshWatchlist();
				refreshTable();
				succeeded = true;
			} catch (error) {
				errorBox.textContent = error.message || "Could not save changes. Please try again.";
				errorBox.hidden = false;
			} finally {
				_savingBet = false;
				save.disabled = false;
				resumeTrackerRefresh();
			}
			if (succeeded) closeAddBet();
		}

		function removeBet() {
			if (!_addBetRow || _savingBet || _addBetMode !== "bet") return;
			const existing = findBet(_addBetRow);
			BETS = BETS.filter(bet => bet !== existing);
			closeAddBet();
			refreshTable();
			persistBets();
		}

		// Typing in manual odds deselects chips
		document.getElementById("abt-manual-odds").addEventListener("input", function() {
			document.getElementById("abt-odds-grid").querySelectorAll(".odds-chip").forEach(c => c.classList.remove("selected"));
		});
		document.getElementById("abt-side").addEventListener("change", renderTrackerOddsChoices);
		document.getElementById("abt-line").addEventListener("input", renderTrackerOddsChoices);

		// Close backdrop click
		document.getElementById("add-bet-backdrop").addEventListener("click", function(e) {
			if (e.target === this) closeAddBet();
		});

		// ── Right panel (odds chart) ──────────────────────────────────────
		function closeRightBody() {
			const right = document.querySelector("#right-body");
			const left  = document.querySelector("#table-container");
			const table = document.querySelector("#table");
			right.style.display = "none";
			right.classList.remove("mobile-open");
			left.style.width  = "100%";
			table.style.display = "";
			setTimeout(() => { left.style.width = "100%"; }, 40);
		}

		}

		function plotOddsChart() {
			const data = TABLE.getSelectedData()[0];
			if (!data) return;
			const chart = data.oddsChart;
			const el = document.getElementById('chart');

			if (!chart || chart.length === 0) {
				el.innerHTML = '<div style="color:#888;padding:1rem;">No odds data available.</div>';
				return;
			}

			const bookSet = new Set();
			chart.forEach(entry => {
				Object.keys(entry).forEach(k => { if (k !== 'ts' && !k.endsWith('_under')) bookSet.add(k); });
			});

			const now = new Date();
			const BOOK_COLORS  = ['#3b82f6','#1db954','#f97316','#f43f5e','#a78bfa','#ffcc00','#34caff','#ff9500','#5eff72','#c388ff'];
			const DASH_PATTERNS = ['solid','dash','dot','dashdot'];
			const books   = [...bookSet];
			const tooMany = books.length > BOOK_COLORS.length;

			const traces = books.map((book, i) => {
				const pts = chart.filter(e => e[book] != null).map(e => ({ x: new Date(e.ts), y: e[book] }));
				if (!pts.length) return null;
				const xs    = [...pts.map(p => p.x), now];
				const ys    = [...pts.map(p => p.y), pts.at(-1).y];
				const color = BOOK_COLORS[i % BOOK_COLORS.length];
				const dash  = tooMany ? DASH_PATTERNS[Math.floor(i / BOOK_COLORS.length) % DASH_PATTERNS.length] : 'solid';
				return {
					x: xs, y: ys, name: book.toUpperCase(), mode: 'lines+markers',
					line: { color, width: 2, dash }, marker: { size: 5, color },
					hovertemplate: `%{x|%I:%M %p}<br>${book.toUpperCase()}: %{y}<extra></extra>`
				};
			}).filter(Boolean);

			const playerName = data.player ? data.player.split(' ').map(w => w[0].toUpperCase()+w.slice(1)).join(' ') : '';
			const layout = {
				title: { text: `${playerName}: HR Over Odds`, font: { size: 13 } },
				plot_bgcolor: '#181a1b', paper_bgcolor: '#181a1b',
				font: { color: '#e8e6e3' },
				legend: { orientation: 'h', y: 1.08, bgcolor: 'rgba(0,0,0,0)' },
				xaxis: { type: 'date', tickformat: '%I:%M %p', showgrid: false },
				yaxis: { showgrid: true, gridcolor: 'rgba(255,255,255,0.06)' },
				margin: { l: 45, r: 10, t: 50, b: 40 },
				hovermode: 'x unified'
			};

			Plotly.newPlot('chart', traces, layout, { displayModeBar: false, responsive: true });
			if (MOBILE) requestAnimationFrame(() => Plotly.Plots.resize(document.getElementById('chart')));
		}
	</script>
