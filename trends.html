	<script type="text/javascript">
		PAGE = "trends";

		parseURLParams();

		const windowURL = new URL(window.location.href);
		const URLParams = new URLSearchParams(windowURL.search);
		let GRAPH = URLParams.get("graph") || "3d";
		let DEBUG = URLParams.get("debug");
		let CLOSE = URLParams.get("close");

		let HRTABLE = null;
		let HRROWS = [];
		let ALMOST = [];
		let YBY = {};
		let currentYear = new Date().getFullYear();

		if (PLAYER) {
			document.querySelector("#table").style["max-width"] = "520px";
		}

		document.querySelector("#graph-select").value = GRAPH;
		document.querySelector("#graph-select").addEventListener("change", (event) => {
			const g = event.target.value;
			if (g == "5d") {
				plotGraph(RES, 5);
			} else if (g == "3d") {
				plotGraph(RES, 3);
			} else if (g == "1d") {
				plotGraph(RES, 1);
			} else if (g == "1d-hr") {
				plotGraph(RES, 1, "hr");
			} else if (g == "reg") {
				plotGraph(RES, 3, "hr/g", true);
			} else if (g == "weather") {
				plotWeatherGraph(RES);
			} else if (g == "monthly") {
				plotMonthlyBar(RES, "hr/g");
			} else if (g == "brl-1d") {
				plotGraph(RES, 1, "brl/g");
			} else if (g == "brl-3d") {
				plotGraph(RES, 3, "brl/g");
			} else if (g == "monthly-brl") {
				plotMonthlyBar(RES, "brl/g");
			}
		});

		function filterHR() {
			if (TABLE.getFilters().length > 0) {
				TABLE.clearFilter();
			} else {
				TABLE.setFilter([
					{field:"result", type:"=", value: "Home Run"}
				]);
			}
		}

		const SKIP_YEARS = ["2015", "2020"];
		const MIN_YEAR = 2006;
		const MIN_GAMES = 5; // filter days with too few games (avoids early-season 1-game spikes)
		const MONTHS = ["03", "04", "05", "06", "07", "08", "09"];
		const YEAR_COLORS = [
			"#ff9500", "#0a84ff", "#1db954", "#ff3b30",
			"#8e44ad", "#ffcc00", "#34caff", "#5eff72",
			"#ff5e84", "#c388ff"
		];

		function getYearData(res, year, graph) {
			const xVals = [], yVals = [];
			MONTHS.forEach(month => {
				if (!res[year]?.[month]) return;
				const d = res[year][month];
				d.dt.forEach((dt, i) => {
					if (d.g[i] >= MIN_GAMES) {
						xVals.push("2026-" + dt);
						yVals.push(d[graph][i]);
					}
				});
			});
			return { xVals, yVals };
		}

		function plotGraph(res, movingAvg=3, graph="hr/g", regression=false) {
			const traces = [];
			const years = Object.keys(res).filter(y => !SKIP_YEARS.includes(y) && parseInt(y) >= MIN_YEAR).sort();
			const currYear = currentYear.toString();

			years.forEach((year, idx) => {
				const { xVals, yVals } = getYearData(res, year, graph);
				if (xVals.length === 0) return;

				const isCurrent = year === currYear;
				const color = YEAR_COLORS[idx % YEAR_COLORS.length];
				const ySmooth = movingAverage(yVals, movingAvg);

				if (regression) {
					const regY = linearRegression(yVals.map((_, i) => i), yVals).predictedY;
					traces.push({
						x: xVals, y: regY,
						name: year, mode: "lines",
						hovertemplate: `${year} %{x|%b %d}<br>${graph}: %{y:.2f}<extra></extra>`,
						line: { color, width: isCurrent ? 3 : 1.5, dash: isCurrent ? "solid" : "dot" },
						opacity: isCurrent ? 1 : 0.5
					});
				} else {
					traces.push({
						x: xVals,
						y: graph === "hr" ? yVals : ySmooth,
						name: year, mode: "lines",
						hovertemplate: `${year} %{x|%b %d}<br>${graph}: %{y:.2f}<extra></extra>`,
						line: { color, width: isCurrent ? 3 : 1 },
						opacity: isCurrent ? 1 : 0.35
					});
				}
			});

			const graphLabel = graph === "hr" ? "HR Count" : graph === "brl/g" ? "BRL/G" : "HR/G";
			const title = regression
				? `HR/G Regression by Year`
				: `${movingAvg}-Day ${graphLabel} — Year over Year`;

			const layout = {
				plot_bgcolor: '#181a1b', paper_bgcolor: '#181a1b',
				title: { text: title, font: { size: 14 } },
				font: { color: '#e8e6e3' },
				legend: { orientation: 'h', y: 1.08, bgcolor: 'rgba(0,0,0,0)' },
				xaxis: { showgrid: false, type: 'date', tickformat: '%b %d', dtick: 'M1' },
				yaxis: { showgrid: true, gridcolor: 'rgba(255,255,255,0.06)', rangemode: 'tozero' },
				hovermode: 'closest',
				margin: MOBILE ? { l: 30, r: 10, t: 40, b: 40 } : { l: 50, r: 20, t: 50, b: 50 }
			};

			Plotly.newPlot('table', traces, layout, { displayModeBar: false });
			setTimeout(() => Plotly.Plots.resize('table'), 100);
		}

		function plotWeatherGraph(res) {
			// For each calendar day-slot (by month+day), collect hr/g across all years
			// Then average to show how homer rate changes early vs late season
			const bySlot = {}; // "2026-MM-DD" -> [values]

			Object.keys(res).filter(y => !SKIP_YEARS.includes(y) && parseInt(y) >= MIN_YEAR).forEach(year => {
				MONTHS.forEach(month => {
					if (!res[year]?.[month]) return;
					const d = res[year][month];
					d.dt.forEach((dt, i) => {
						if (d.g[i] < MIN_GAMES) return;
						const key = "2026-" + dt;
						if (!bySlot[key]) bySlot[key] = [];
						bySlot[key].push(d["hr/g"][i]);
					});
				});
			});

			const slots = Object.keys(bySlot).sort();
			const xVals = slots;
			const yMean = slots.map(k => {
				const vals = bySlot[k];
				return vals.reduce((a, b) => a + b, 0) / vals.length;
			});
			const ySmooth = movingAverage(yMean, 7);

			// shade band: mean ± 0.5 std dev
			const yHi = slots.map((k, i) => {
				const vals = bySlot[k];
				const mean = yMean[i];
				const std = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
				return +(mean + std * 0.5).toFixed(2);
			});
			const yLo = slots.map((k, i) => {
				const vals = bySlot[k];
				const mean = yMean[i];
				const std = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
				return +(mean - std * 0.5).toFixed(2);
			});

			const traces = [
				// shaded band
				{
					x: [...xVals, ...xVals.slice().reverse()],
					y: [...yHi, ...yLo.slice().reverse()],
					fill: 'toself', fillcolor: 'rgba(255,149,0,0.12)',
					line: { color: 'transparent' },
					name: '±0.5 std dev', hoverinfo: 'skip', showlegend: true
				},
				// smoothed mean line
				{
					x: xVals, y: ySmooth,
					mode: 'lines', name: 'Avg HR/G (7-day)',
					line: { color: '#ff9500', width: 3 },
					hovertemplate: '%{x|%b %d}<br>Avg HR/G: %{y:.2f}<extra></extra>'
				},
			];

			const layout = {
				plot_bgcolor: '#181a1b', paper_bgcolor: '#181a1b',
				title: { text: 'Early Season Weather Effect — Avg HR/G by Calendar Day (all years)', font: { size: 14 } },
				font: { color: '#e8e6e3' },
				legend: { orientation: 'h', y: 1.08, bgcolor: 'rgba(0,0,0,0)' },
				xaxis: { showgrid: false, type: 'date', tickformat: '%b %d', dtick: 'M1' },
				yaxis: { showgrid: true, gridcolor: 'rgba(255,255,255,0.06)', rangemode: 'tozero' },
				hovermode: 'x unified',
				margin: MOBILE ? { l: 30, r: 10, t: 40, b: 40 } : { l: 50, r: 20, t: 50, b: 50 }
			};

			Plotly.newPlot('table', traces, layout, { displayModeBar: false });
			setTimeout(() => Plotly.Plots.resize('table'), 100);
		}

		function plotMonthlyBar(res, field="hr/g") {
			const MONTH_LABELS = { "03": "Mar", "04": "Apr", "05": "May", "06": "Jun", "07": "Jul", "08": "Aug", "09": "Sep", "10": "Oct" };
			const label = field === "brl/g" ? "BRL/G" : "HR/G";
			// collect per-month values across all qualifying years
			const monthVals = {}; // month -> [yearly averages]
			Object.keys(res).filter(y => !SKIP_YEARS.includes(y) && parseInt(y) >= MIN_YEAR).forEach(year => {
				MONTHS.forEach(month => {
					if (!res[year]?.[month]) return;
					const d = res[year][month];
					if (!d[field]) return;
					const valid = d[field].filter((_, i) => d.g[i] >= MIN_GAMES);
					if (valid.length === 0) return;
					const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
					if (!monthVals[month]) monthVals[month] = [];
					monthVals[month].push(avg);
				});
			});

			const months = MONTHS.filter(m => monthVals[m]);
			const means = months.map(m => {
				const vals = monthVals[m];
				return +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2);
			});
			const stds = months.map((m, i) => {
				const vals = monthVals[m];
				const mean = means[i];
				return +(Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length)).toFixed(3);
			});

			// color gradient: cold (Apr) → warm (peak summer) → cooling (Sep/Oct)
			const barColors = months.map(m => {
				const palette = { "03": "#7ec8e3", "04": "#60a5fa", "05": "#86efac", "06": "#fde68a", "07": "#fb923c", "08": "#f97316", "09": "#fbbf24", "10": "#a78bfa" };
				return palette[m] || "#e4e4e7";
			});

			const peakMean = Math.max(...means);

			const traces = [
				{
					type: "bar",
					x: months.map(m => MONTH_LABELS[m]),
					y: means,
					error_y: { type: "data", array: stds, visible: true, color: "rgba(255,255,255,0.3)", thickness: 2, width: 4 },
					marker: { color: barColors, line: { color: "rgba(0,0,0,0.3)", width: 1 } },
					text: means.map(v => v.toFixed(2)),
					textposition: "outside",
					textfont: { size: 13, color: "#e4e4e7" },
					hovertemplate: `<b>%{x}</b><br>Avg ${label}: %{y:.2f}<extra></extra>`,
					showlegend: false
				},
				// invisible scatter for year-by-year dots per month
				...months.map((m, mi) => ({
					type: "scatter", mode: "markers",
					x: monthVals[m].map(() => MONTH_LABELS[m]),
					y: monthVals[m].map(v => +v.toFixed(2)),
					marker: { color: "rgba(255,255,255,0.25)", size: 5 },
					hovertemplate: "%{x} (single year): %{y:.2f}<extra></extra>",
					showlegend: false
				}))
			];

			const aprilMean = means[months.indexOf("04")] ?? means[0];
			const diffPct = Math.round((peakMean - aprilMean) / aprilMean * 100);

			const layout = {
				plot_bgcolor: "#0f0f11",
				paper_bgcolor: "#0f0f11",
				title: {
					text: `MLB ${label} by Month — Avg across last 10 seasons<br><span style="font-size:12px;color:#a1a1aa">April is ~${diffPct}% below peak.</span>`,
					font: { size: 15, color: "#f4f4f5" },
					x: 0.5
				},
				font: { color: "#e4e4e7", family: "system-ui, sans-serif" },
				xaxis: { showgrid: false, zeroline: false },
				yaxis: {
					showgrid: true, gridcolor: "rgba(255,255,255,0.06)",
					range: [0, peakMean * 1.25],
					title: { text: "HR / Game", font: { size: 12 } }
				},
				bargap: 0.25,
				margin: { l: 50, r: 30, t: 80, b: 50 },
				annotations: [
					{
						x: MONTH_LABELS[months.find(m => means[months.indexOf(m)] === peakMean)],
						y: peakMean,
						text: "🔥 Peak",
						showarrow: true, arrowhead: 2, arrowcolor: "#fb923c",
						font: { color: "#fb923c", size: 12 },
						ay: -30
					},
					{
						x: MONTH_LABELS["04"] ?? MONTH_LABELS[months[0]],
						y: aprilMean,
						text: "❄️ Cold start",
						showarrow: true, arrowhead: 2, arrowcolor: "#60a5fa",
						font: { color: "#60a5fa", size: 12 },
						ay: 35
					}
				]
			};

			Plotly.newPlot("table", traces, layout, { displayModeBar: false });
			setTimeout(() => Plotly.Plots.resize("table"), 100);
		}

		async function fetchFeed(render=false) {
			//fetch("month_xy.json")
			fetch(API_BASE+"/api/trends", {
				headers: {
					Authorization: `Bearer ${ACCESS_TOKEN}`
				}
			})
			.then(response => response.json())
			.then(res => {
				if (GRAPH == "weather") { plotWeatherGraph(res); } else if (GRAPH == "1d") {
					plotGraph(res, 1);
				} else if (GRAPH == "5d") {
					plotGraph(res, 5);
				} else if (GRAPH == "reg") {
					plotGraph(res, 3, "hr/g", true);
				} else if (GRAPH == "1d-hr") {
					plotGraph(res, 1, "hr");
				} else if (GRAPH == "monthly") {
					plotMonthlyBar(res, "hr/g");
				} else if (GRAPH == "brl-1d") {
					plotGraph(res, 1, "brl/g");
				} else if (GRAPH == "brl-3d") {
					plotGraph(res, 3, "brl/g");
				} else if (GRAPH == "monthly-brl") {
					plotMonthlyBar(res, "brl/g");
				} else {
					plotGraph(res, 3);
				}
				RES = res;
				recap();
			}).catch(err => console.log(err));
		}
		fetchFeed(render=true);

			HRTABLE = new Tabulator("#hrtable", {

					{column: "dt", dir: "desc"},
				],
				groupHeader: function(value, count, data, group){
					return `<span style='color: #c8c3bc'>${value.toUpperCase()}</span>`;
				},
				groupToggleElement: "header",
				columns: [
					//{title: "Confirmed", field: "confirmed", formatter:"tickCross", width: 30, hozAlign: "center"},
					{title: "", field: "dt", formatter: dtFormatter, hozAlign: "center", visible: PLAYER ? true : false},
					{title: "", field: "in", formatter: inningFormatter, hozAlign: "center", width: 30, visible: PLAYER ? false : true},
					{title: "Player", field: "player", headerFilter: "input",
						formatter: playerFormatter,
						formatterParams:{ sport: PAGE },
						width: 130
					},
					{title: "Result", field: "result", width: MOBILE ? 50 : 60, visible: false},
					{title: "Dist", field: "dist", hozAlign: "center", sorter: "number", formatter: ftFormatter},
					{title: "HR/Park", field: "hr/park", hozAlign: "center", sorter: "number", width: MOBILE ? 60 : 60},
					{title: "EVelo", field: "evo", hozAlign: "center", sorter: "number", width: MOBILE ? 45 : 60, visible: MOBILE ? false : true},
					{title: "LA", field: "la", hozAlign: "center", sorter: "number", width: MOBILE ? 45 : 60, visible: MOBILE ? false : true},
					{title: "DT", field: "dt", visible: false},
				]
			});
		}

		function groupByGameFeed() {
			if (!TABLE.options.groupBy) {
				TABLE.setGroupBy("game");
			} else {
				TABLE.setGroupBy();
			}
		}

		function recap() {
			//document.querySelector("#graph-select").value = "1d";
			//plotGraph(RES, movingAvg=1);
			return;
			const td = new Date().toISOString().split('T')[0];
			const [y,m,d] = td.split("-");
			const dt = new Date(y+" "+RES[y][m]["dt"].at(-1)+" 10:00");
			const mo = dt.toString().split(" ")[1];
			const day = parseInt(dt.toString().split(" ")[2]);
			const suffix = ["th", "st", "nd", "rd"][(day % 10 > 3 || [11,12,13].includes(day)) ? 0 : day % 10];
			const vals = RES[y][m]["hr/g"];
			const reg = linearRegression(vals.map((_, i) => i), vals).predictedY.at(-1);
			const hrG = RES[y][m]["hr/g"].at(-1);
			const trend = hrG > reg ? "📈" : "📉";
			const sep = "||";
			console.log(`${mo} ${day}${suffix} Homer Recap

${RES[y][m]["hr"].at(-1)} Hit ${sep} ${hrG} per game ${trend} ${sep} ${reg.toFixed(2)} '${y.substring(2)} Trend

Longest: 
			`);
		}

	</script>
