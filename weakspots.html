<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚾ Weakspot Analysis</title>
  <script src="plotly-3.0.0.min.js" charset="utf-8"></script>
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="logos/icon.png">
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0 12px 40px;
      overflow: auto;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 16px 0 4px;
      color: #f1f5f9;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* ── Summary Cards ── */
    #summary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 16px;
      flex: 1;
      min-width: 140px;
    }
    .card-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .card-value {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
    }
    .card-value.verdict-noise {
      color: #34d399;
      font-size: 20px;
    }
    .card-value.verdict-real {
      color: #f87171;
      font-size: 20px;
    }

    /* ── 2×2 Chart Grid ── */
    #chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) {
      #chart-grid { grid-template-columns: 1fr; }
    }
    .chart-wrap {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }
    .chart-wrap .plotly-graph-div {
      width: 100% !important;
    }

    /* ── Profiles Section ── */
    #profiles-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }
    #profiles-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #334155;
    }
    #profiles-header:hover { background: #243449; }
    #profiles-toggle-icon {
      font-size: 12px;
      color: #94a3b8;
      transition: transform 0.2s;
    }
    #profiles-header span {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }
    #profiles-body {
      display: none;
      padding: 12px 14px;
    }
    #profiles-body.open { display: block; }

    #pitcher-selector {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      min-width: 220px;
    }
    #profile-chart { width: 100%; }
  </style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FX06BZ5MRL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FX06BZ5MRL');
</script>
<body>
  <h1>Batting-Order Weakspot Analysis</h1>
  <p class="subtitle">Does the batting slot a pitcher struggles with repeat year to year?</p>

  <div id="summary-row"></div>

  <div id="chart-grid">
    <div class="chart-wrap" id="wrap-scatter"></div>
    <div class="chart-wrap" id="wrap-pearson"></div>
    <div class="chart-wrap" id="wrap-persist"></div>
    <div class="chart-wrap" id="wrap-rtm"></div>
  </div>

  <div id="profiles-section">
    <div id="profiles-header" onclick="toggleProfiles()">
      <span id="profiles-toggle-icon">▶</span>
      <span>Per-Pitcher Slot Profiles</span>
      <span style="font-size:12px;color:#64748b;margin-left:4px;">(click to expand)</span>
    </div>
    <div id="profiles-body">
      <select id="pitcher-selector" onchange="renderProfile()"></select>
      <div id="profile-chart"></div>
    </div>
  </div>

  <script>
  const DARK = {
    paper_bgcolor: '#1e293b',
    plot_bgcolor: '#1e293b',
    font: { color: '#e2e8f0', size: 11 },
    xaxis: { gridcolor: '#334155', zerolinecolor: '#475569', tickfont: { color: '#94a3b8', size: 10 } },
    yaxis: { gridcolor: '#334155', zerolinecolor: '#475569', tickfont: { color: '#94a3b8', size: 10 } },
    margin: { l: 50, r: 20, t: 50, b: 50 }
  };
  const CONF = { responsive: true, displayModeBar: false };

  let DATA = null;

  async function init() {
    const res = await fetch('weakspot_analysis.json');
    DATA = await res.json();
    renderSummary();
    renderScatter();
    renderPearson();
    renderPersistence();
    renderRTM();
    buildPitcherSelector();
  }

  /* ── Summary Cards ── */
  function renderSummary() {
    const s = DATA.summary;
    const verdict = s.verdict === 'NOISE' ? 'NOISE - profiles are random' : s.verdict;
    const verdictClass = s.verdict === 'NOISE' ? 'verdict-noise' : 'verdict-real';
    const cards = [
      { label: 'Verdict', value: verdict, cls: verdictClass },
      { label: 'Mean Pearson r', value: s.mean_pearson_r.toFixed(3), cls: '' },
      { label: 'Worst-slot persistence', value: s.worst_slot_pct_actual.toFixed(1) + '%', cls: '' },
      { label: 'Outlier reversion', value: (100 - s.outlier_pct_still_above).toFixed(1) + '% collapse', cls: '' },
    ];
    const row = document.getElementById('summary-row');
    row.innerHTML = cards.map(c => `
      <div class="card">
        <div class="card-label">${c.label}</div>
        <div class="card-value ${c.cls}">${c.value}</div>
      </div>`).join('');
  }

  /* ── Chart 1: Scatter Year-N vs Year-N+1 ── */
  function renderScatter() {
    const sc = DATA.scatter_yn_yn1;
    const reg = sc.regression;

    const points = {
      x: sc.x, y: sc.y, text: sc.labels,
      mode: 'markers', type: 'scatter',
      marker: { color: '#6366f1', opacity: 0.5, size: 5 },
      hovertemplate: '%{text}<extra></extra>',
      name: 'Slot pair'
    };

    const regLine = {
      x: reg.x_range, y: reg.y_range,
      mode: 'lines', type: 'scatter',
      line: { color: '#f97316', width: 2 },
      name: `Fit (slope=${reg.slope.toFixed(2)}, r=${reg.r.toFixed(2)})`
    };

    const allVals = [...sc.x, ...sc.y];
    const lo = Math.min(...allVals) * 0.95;
    const hi = Math.max(...allVals) * 1.02;
    const diagLine = {
      x: [lo, hi], y: [lo, hi],
      mode: 'lines', type: 'scatter',
      line: { color: '#64748b', width: 1, dash: 'dash' },
      name: 'Perfect persistence (y=x)'
    };

    const layout = {
      ...DARK,
      title: { text: 'If weakspots were real, points would follow the diagonal', font: { size: 12, color: '#f1f5f9' } },
      xaxis: { ...DARK.xaxis, title: { text: 'OPS allowed (slot, year N)', font: { size: 10, color: '#94a3b8' } } },
      yaxis: { ...DARK.yaxis, title: { text: 'OPS allowed (same slot, year N+1)', font: { size: 10, color: '#94a3b8' } } },
      legend: { font: { size: 9, color: '#94a3b8' }, bgcolor: 'transparent' },
      annotations: [{
        x: reg.x_range[1], y: reg.y_range[1],
        xanchor: 'right', yanchor: 'bottom',
        text: `slope=${reg.slope.toFixed(2)} · r=${reg.r.toFixed(2)} · p=${reg.p_value < 0.001 ? '<0.001' : reg.p_value.toFixed(3)}`,
        showarrow: false,
        font: { size: 10, color: '#f97316' },
        bgcolor: '#1e293b',
        borderpad: 3
      }]
    };

    Plotly.newPlot('wrap-scatter', [points, regLine, diagLine], layout, CONF);
  }

  /* ── Chart 2: Pearson r Distribution ── */
  function renderPearson() {
    const pd = DATA.pearson_dist;
    const vals = pd.values;
    const mean = pd.mean;

    // bin into 0.05-wide buckets, colour by sign
    const binSize = 0.05;
    const posVals = vals.filter(v => v >= 0);
    const negVals = vals.filter(v => v < 0);

    const posBars = {
      x: posVals, type: 'histogram', xbins: { size: binSize },
      marker: { color: '#f97316', opacity: 0.8 },
      name: 'Positive r',
      hovertemplate: 'r: %{x:.2f}<br>count: %{y}<extra></extra>'
    };
    const negBars = {
      x: negVals, type: 'histogram', xbins: { size: binSize },
      marker: { color: '#3b82f6', opacity: 0.8 },
      name: 'Negative r',
      hovertemplate: 'r: %{x:.2f}<br>count: %{y}<extra></extra>'
    };

    const layout = {
      ...DARK,
      barmode: 'overlay',
      title: { text: 'Year-to-year profile correlations are centered near 0', font: { size: 12, color: '#f1f5f9' } },
      xaxis: { ...DARK.xaxis, title: { text: 'Pearson r', font: { size: 10, color: '#94a3b8' } } },
      yaxis: { ...DARK.yaxis, title: { text: 'Pitchers', font: { size: 10, color: '#94a3b8' } } },
      legend: { font: { size: 9, color: '#94a3b8' }, bgcolor: 'transparent' },
      shapes: [
        { type: 'line', x0: 0, x1: 0, y0: 0, y1: 1, yref: 'paper', line: { color: '#94a3b8', width: 1.5, dash: 'dash' } },
        { type: 'line', x0: mean, x1: mean, y0: 0, y1: 1, yref: 'paper', line: { color: '#facc15', width: 1.5, dash: 'dot' } }
      ],
      annotations: [
        { x: 0, y: 1, yref: 'paper', xanchor: 'left', yanchor: 'top', text: '  pure noise', showarrow: false, font: { size: 9, color: '#94a3b8' } },
        { x: mean, y: 1, yref: 'paper', xanchor: 'left', yanchor: 'top', text: `  mean=${mean.toFixed(3)}`, showarrow: false, font: { size: 9, color: '#facc15' } }
      ]
    };

    Plotly.newPlot('wrap-pearson', [posBars, negBars], layout, CONF);
  }

  /* ── Chart 3: Worst-Slot Persistence ── */
  function renderPersistence() {
    const wp = DATA.worst_persistence;

    const bars = {
      x: ['Actual', 'Random chance (1/9)'],
      y: [wp.actual_pct, wp.expected_pct],
      type: 'bar',
      marker: { color: ['#3b82f6', '#475569'] },
      hovertemplate: '%{x}: %{y:.1f}%<extra></extra>'
    };

    const layout = {
      ...DARK,
      title: { text: 'Does the worst batting-order slot repeat next year?', font: { size: 12, color: '#f1f5f9' } },
      yaxis: {
        ...DARK.yaxis,
        title: { text: '% of times worst slot repeated', font: { size: 10, color: '#94a3b8' } },
        range: [0, Math.max(wp.actual_pct, wp.expected_pct) * 1.4]
      },
      shapes: [{
        type: 'line', x0: -0.5, x1: 1.5, y0: wp.expected_pct, y1: wp.expected_pct,
        line: { color: '#64748b', width: 1.5, dash: 'dash' }
      }],
      annotations: [{
        x: 0, y: wp.actual_pct + 0.8,
        text: `${wp.persisted}/${wp.total} pairs`,
        showarrow: false,
        font: { size: 10, color: '#94a3b8' }
      }]
    };

    Plotly.newPlot('wrap-persist', [bars], layout, CONF);
  }

  /* ── Chart 4: Regression to Mean ── */
  function renderRTM() {
    const rtm = DATA.regression_to_mean;
    const n = rtm.yr_n_vals.length;

    const colors = rtm.yr_n1_vals.map((y1, i) => y1 > rtm.pitcher_avg_n1[i] ? '#f97316' : '#3b82f6');

    const points = {
      x: rtm.yr_n_vals,
      y: rtm.yr_n1_vals,
      text: rtm.labels,
      mode: 'markers', type: 'scatter',
      marker: { color: colors, size: 6, opacity: 0.7 },
      hovertemplate: '%{text}<extra></extra>',
      name: 'Slot in year N+1'
    };

    // horizontal lines at pitcher_avg_n1 per point — group unique avg values
    const avgGroups = {};
    for (let i = 0; i < n; i++) {
      const avg = rtm.pitcher_avg_n1[i];
      if (!avgGroups[avg]) avgGroups[avg] = { xs: [], y: avg };
      avgGroups[avg].xs.push(rtm.yr_n_vals[i]);
    }
    const avgTraces = Object.values(avgGroups).map(g => ({
      x: [Math.min(...g.xs) - 0.01, Math.max(...g.xs) + 0.01],
      y: [g.y, g.y],
      mode: 'lines', type: 'scatter',
      line: { color: '#475569', width: 1 },
      showlegend: false,
      hoverinfo: 'skip'
    }));

    const layout = {
      ...DARK,
      title: { text: 'Outlier slots collapse toward pitcher average in year N+1', font: { size: 12, color: '#f1f5f9' } },
      xaxis: { ...DARK.xaxis, title: { text: 'OPS allowed (outlier slot, year N)', font: { size: 10, color: '#94a3b8' } } },
      yaxis: { ...DARK.yaxis, title: { text: 'OPS allowed (same slot, year N+1)', font: { size: 10, color: '#94a3b8' } } },
      legend: { font: { size: 9, color: '#94a3b8' }, bgcolor: 'transparent' },
      annotations: [{
        x: 0.98, y: 0.97, xref: 'paper', yref: 'paper',
        xanchor: 'right', yanchor: 'top',
        text: `${rtm.pct_still_above}% still above pitcher avg`,
        showarrow: false,
        font: { size: 10, color: '#facc15' },
        bgcolor: '#1e293b',
        borderpad: 3
      }]
    };

    Plotly.newPlot('wrap-rtm', [points, ...avgTraces], layout, CONF);
  }

  /* ── Per-Pitcher Profiles ── */
  function buildPitcherSelector() {
    const sel = document.getElementById('pitcher-selector');
    DATA.profiles.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name.replace(/\b\w/g, c => c.toUpperCase());
      sel.appendChild(opt);
    });
  }

  function renderProfile() {
    const idx = parseInt(document.getElementById('pitcher-selector').value);
    const pitcher = DATA.profiles[idx];

    const traces = [];
    pitcher.years.forEach(yr => {
      if (!yr.slots || yr.slots.every(v => v === null)) return;
      const xs = [], ys = [];
      yr.slots.forEach((v, i) => {
        if (v !== null) { xs.push(i + 1); ys.push(v); }
      });
      if (xs.length === 0) return;
      traces.push({
        x: xs, y: ys,
        mode: 'lines+markers', type: 'scatter',
        name: String(yr.year),
        marker: { size: 5 },
        hovertemplate: `Slot %{x}: %{y:.3f} OPS (${yr.year})<extra></extra>`
      });
    });

    const layout = {
      ...DARK,
      title: {
        text: pitcher.name.replace(/\b\w/g, c => c.toUpperCase()) + ' — OPS allowed by batting slot',
        font: { size: 13, color: '#f1f5f9' }
      },
      xaxis: {
        ...DARK.xaxis,
        title: { text: 'Batting order slot', font: { size: 10, color: '#94a3b8' } },
        tickvals: [1,2,3,4,5,6,7,8,9]
      },
      yaxis: {
        ...DARK.yaxis,
        title: { text: 'OPS allowed', font: { size: 10, color: '#94a3b8' } }
      },
      legend: { font: { size: 10, color: '#94a3b8' }, bgcolor: 'transparent' },
      margin: { ...DARK.margin, b: 40 }
    };

    Plotly.newPlot('profile-chart', traces, layout, { ...CONF, responsive: true });
  }

  function toggleProfiles() {
    const body = document.getElementById('profiles-body');
    const icon = document.getElementById('profiles-toggle-icon');
    const isOpen = body.classList.toggle('open');
    icon.style.transform = isOpen ? 'rotate(90deg)' : '';
    icon.textContent = '▶';
    if (isOpen && document.getElementById('pitcher-selector').options.length > 0 &&
        document.getElementById('profile-chart').children.length === 0) {
      renderProfile();
    }
  }

  init();
  </script>
</body>
</html>
